<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Digest 한국어 피드</title>
  <meta name="description" content="AI platform 및 agent engineer를 위한 한국어 요약 피드입니다." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://www.llm-digest.com/ko/" />
  <link rel="alternate" hreflang="en" href="https://www.llm-digest.com/" />
  <link rel="alternate" hreflang="x-default" href="https://www.llm-digest.com/" />
  <link rel="stylesheet" href="https://oat.ink/oat.min.css" />
  <link rel="stylesheet" href="/site-chrome.css?v=20260705-language-switch" />
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script defer src="/site-chrome.js?v=20260705-language-switch"></script>
  <style>
    :root,
    html[data-theme="light"] {
      color-scheme: light;
      --bg:#f5f7fa; --card:#ffffff; --border:#d7dde7; --accent:#2457d6;
      --muted:#687386; --fg:#121722; --feed-wash:#eaf0ff; --feed-ink:#18243b;
      --signal:#23875b; --warm:#b6780c; --alert:#c4483f;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg:#11151c; --card:#171d26; --border:#313946; --accent:#7ca0ff;
      --muted:#9aa6b6; --fg:#eff3f8; --feed-wash:#1c2a48; --feed-ink:#e8eefb;
      --signal:#54b886; --warm:#e0ad4e; --alert:#ef756d;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Avenir Next","Segoe UI",system-ui,sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 980px;
      margin: 1rem auto;
      padding: 0 1.35rem 2.5rem;
      overflow-x: clip;
    }
    .feed-hero {
      display: grid;
      grid-template-columns: minmax(0,1.35fr) minmax(15rem,.65fr);
      gap: 1.5rem 2.5rem;
      align-items: end;
      margin: 2rem 0 1.45rem;
    }
    .feed-kicker {
      margin: 0 0 .35rem;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .feed-title {
      margin: 0;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(2.8rem, 7vw, 4.7rem);
      font-weight: 700;
      letter-spacing: -0.048em;
      line-height: 0.92;
    }
    .feed-promise {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .feed-promise strong {
      color: var(--fg);
    }
    #meta {
      margin: 0.75rem 0 0;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.68rem;
      line-height: 1.55;
      color: var(--muted);
    }
    #list {
      gap: 0;
      margin-top: 1.3rem;
    }
    #list > article {
      position: relative;
      padding: 1.05rem 0 1.1rem 3.35rem;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    #list > article:first-of-type {
      border-top: 1px solid var(--border);
    }
    .rank-no {
      position: absolute;
      left: 0;
      top: 1rem;
      width: 2.25rem;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 700;
      color: color-mix(in srgb, var(--muted) 55%, transparent);
    }
    .card-top {
      margin: 0 0 0.4rem;
      padding-right: 5.5rem;
      gap: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.7rem;
    }
    .card-top .src, .when {
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.64rem;
      font-weight: 500;
      color: var(--muted);
    }
    .card-top .src {
      color: var(--fg);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .card-main {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    .card-text {
      flex: 1;
    }
    article h3 {
      margin: 0 0 0.35rem;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: 1.28rem;
      line-height: 1.22;
    }
    article h3 a {
      font-weight: 650;
      color: inherit;
      text-decoration: none;
    }
    article h3 a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .why {
      max-width: 45rem;
      margin: 0.3rem 0 0;
      font-size: 0.93rem;
      line-height: 1.56;
    }
    .state {
      border: 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 1.2rem 0;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }
    .actions a {
      color: var(--accent);
      font-size: 0.88rem;
      text-decoration: none;
    }
    .actions a:hover {
      text-decoration: underline;
    }

    @media (max-width:640px) {
      main { padding-left:1rem; padding-right:1rem; }
      .feed-hero { grid-template-columns:1fr; gap:0.15rem; margin:0.9rem 0 0.8rem; }
      .feed-kicker { display:none; }
      .feed-title { font-size:1.9rem; line-height:1.05; letter-spacing:-.035em; }
      .feed-promise { display:none; }
      #meta { margin-top:0.4rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="site-chrome" data-site-section="/">
      <div class="site-bar">
        <a class="site-brand" href="/ko/" aria-label="LLM Digest 한국어 홈"><span aria-hidden="true">📰</span><span>LLM Digest</span></a>
        <div class="site-bar-actions">
          <a class="site-subscribe-action" href="/subscribe" aria-label="이메일 구독 신청" data-subscribe-channel="email" data-subscribe-placement="header">구독하기</a>
          <button type="button" data-site-browse-open aria-label="Editor's Desk 열기">Editor's Desk</button>
        </div>
      </div>
      <div class="site-page-heading">
        <h1>라이브 피드</h1>
        <p class="h1-sub">플랫폼 및 에이전트 엔지니어를 위한 AI 뉴스</p>
      </div>
      <nav class="site-nav-fallback" aria-label="LLM Digest">
        <a href="/ko/" data-site-destination="/" aria-current="page">한국어 피드</a>
        <a href="/daily" data-site-destination="/daily">Daily recap</a>
        <a href="/weekly" data-site-destination="/weekly">Weekly recap</a>
        <a href="/storylines" data-site-destination="/storylines">Storylines</a>
        <a href="/playbook" data-site-destination="/playbook">Playbook</a>
        <a href="/map" data-site-destination="/map">Knowledge map</a>
        <a href="/foundations" data-site-destination="/foundations">Foundations</a>
        <a href="/subscribe" data-site-destination="/subscribe">이메일 구독</a>
      </nav>
      <div class="site-actions-fallback" aria-label="페이지 작업">
        <a class="site-language-action" href="/" aria-label="Read this page in English" title="Read in English"><span aria-hidden="true">🌐</span><span>EN</span></a>
        <button id="themeToggle" type="button" aria-label="테마 전환" title="테마 전환">🌙</button>
      </div>

      <section class="feed-hero">
        <div>
          <p class="feed-kicker">Brief · 한국어 snapshot</p>
          <h2 class="feed-title">끝이 있는 AI 브리프.</h2>
        </div>
        <div>
          <p class="feed-promise"><strong>하나의 공유 랭킹.</strong> 최신 주요 뉴스를 훑어보고, 기억할 소식을 저장한 뒤, 할 일을 마치세요.</p>
          <p id="meta">불러오는 중...</p>
        </div>
      </section>
    </header>
    <section id="list" aria-live="polite">
      <div class="state">한국어 피드를 불러오는 중입니다.</div>
    </section>
  </main>
  <script>
    function esc(v) {
      return String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
    function kstWindow(days) {
      const now = new Date();
      const kstNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
      const end = new Date(kstNow.getFullYear(), kstNow.getMonth(), kstNow.getDate(), 23, 59, 59, 999);
      const start = new Date(kstNow.getFullYear(), kstNow.getMonth(), kstNow.getDate() - (days - 1), 0, 0, 0, 0);
      const offset = '+09:00';
      const fmt = (d) => {
        const pad = (n, w = 2) => String(n).padStart(w, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}${offset}`;
      };
      return { from: fmt(start), to: fmt(end) };
    }
    function relTime(value) {
      const t = Date.parse(value || '');
      if (!Number.isFinite(t)) return '';
      const hours = Math.max(0, Math.round((Date.now() - t) / 3600000));
      if (hours < 1) return '방금 업데이트';
      if (hours < 24) return `${hours}시간 전 업데이트`;
      return `${Math.round(hours / 24)}일 전 업데이트`;
    }
    function fallback(data) {
      const translated = data?.translated_at ? `마지막 번역: ${esc(relTime(data.translated_at))}` : '아직 사용 가능한 한국어 snapshot이 없습니다.';
      document.getElementById('meta').textContent = '현재 한국어 피드를 준비 중입니다.';
      document.getElementById('list').innerHTML = `<div class="state"><strong>한국어 피드가 아직 최신 상태가 아닙니다.</strong><p>${translated}</p><p>지금 최신 피드를 보려면 영어 live feed를 열어 주세요.</p><div class="actions"><a href="/">영어 live feed 보기</a></div></div>`;
    }
    function render(data) {
      if (!data || data.status !== 'current' || !data.is_current || !Array.isArray(data.items) || !data.items.length) {
        fallback(data);
        return;
      }
      document.getElementById('meta').textContent = `${relTime(data.source_run_at)} · 번역 ${data.items.length}개`;
      document.getElementById('list').innerHTML = data.items.map((it, i) => {
        const rank = i + 1;
        const source = esc(it.source || '');
        const published = it.published ? esc(it.published.slice(0, 10)) : '';
        const title = esc(it.title || 'Untitled');
        const href = esc(it.url || '#');
        const summary = it.summary_1line ? esc(it.summary_1line) : '';
        
        return `
          <article>
            <span class="rank-no" aria-label="Rank ${rank}">${String(rank).padStart(2, '0')}</span>
            <div class="card-top">
              <div class="card-meta">
                <span class="src">${source}</span>
                ${published ? `<span class="when">${published}</span>` : ''}
              </div>
            </div>
            <div class="card-main">
              <div class="card-text">
                <h3><a href="${href}" target="_blank" rel="noopener">${title}</a></h3>
                ${summary ? `<p class="why">${summary}</p>` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('') + '<div class="state">번역된 상위 Brief snapshot의 끝입니다. 최신 전체 피드는 <a href="/">영어 feed</a>에서 볼 수 있습니다.</div>';
    }
    async function load() {
      const w = kstWindow(7);
      const u = new URL('/api/feed', location.origin);
      u.searchParams.set('locale', 'ko');
      u.searchParams.set('localized_snapshot', 'latest');
      u.searchParams.set('label', 'brief');
      u.searchParams.set('limit', '20');
      u.searchParams.set('from', w.from);
      u.searchParams.set('to', w.to);
      const res = await fetch(u.pathname + u.search);
      if (!res.ok) throw new Error(`feed_${res.status}`);
      render(await res.json());

      // Move EN link before the browse button for desktop view
      const enLink = document.querySelector('.site-actions-fallback .site-language-action');
      const browseBtn = document.querySelector('[data-site-browse-open]');
      if (enLink && browseBtn) {
        enLink.classList.add('site-bar-language-action');
        browseBtn.before(enLink);
      }
    }
    load().catch(() => fallback(null));
  </script>
</body>
</html>
