<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Digest 한국어 피드</title>
  <meta name="description" content="AI platform 및 agent engineer를 위한 한국어 요약 피드입니다." />

  <link rel="alternate" hreflang="en" href="https://www.llm-digest.com/" />
  <link rel="alternate" hreflang="x-default" href="https://www.llm-digest.com/" />
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)" />

  <link rel="stylesheet" href="/site-chrome.css?v=20260805-agent-know-how" />

  <script>
    (function () {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script defer src="/site-chrome.js?v=20260805-agent-know-how"></script>
  <style>
    :root,
    html[data-theme="light"] {
      color-scheme: light;
      --bg:#f5f7fa; --card:#ffffff; --border:#d7dde7; --accent:#2457d6;
      --muted:#687386; --fg:#121722; --feed-wash:#eaf0ff; --feed-ink:#18243b;
      --signal:#23875b; --warm:#b6780c; --alert:#c4483f;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg:#11151c; --card:#171d26; --border:#313946; --accent:#7ca0ff;
      --muted:#9aa6b6; --fg:#eff3f8; --feed-wash:#1c2a48; --feed-ink:#e8eefb;
      --signal:#54b886; --warm:#e0ad4e; --alert:#ef756d;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
      letter-spacing: -0.01em;
    }
    main {
      width: 100%;
      max-width: 980px;
      margin: 1rem auto;
      padding: 0 1.35rem 2.5rem;
      overflow-x: clip;
    }
    .feed-hero {
      display: grid;
      grid-template-columns: minmax(0,1.35fr) minmax(15rem,.65fr);
      gap: 1.5rem 2.5rem;
      align-items: end;
      margin: 2rem 0 1.45rem;
    }
    .feed-kicker {
      margin: 0 0 .35rem;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .feed-title {
      margin: 0;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(2.8rem, 7vw, 4.7rem);
      font-weight: 700;
      letter-spacing: -0.048em;
      line-height: 0.92;
    }
    .feed-promise {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .feed-promise strong {
      color: var(--fg);
    }
    #meta {
      margin: 0.75rem 0 0;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.68rem;
      line-height: 1.55;
      color: var(--muted);
    }
    #list {
      gap: 0;
      margin-top: 1.3rem;
    }
    #list > article {
      position: relative;
      padding: 1.05rem 0 1.1rem 3.35rem;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    #list > article:first-of-type {
      border-top: 1px solid var(--border);
    }
    .rank-no {
      position: absolute;
      left: 0;
      top: 1rem;
      width: 2.25rem;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 700;
      color: color-mix(in srgb, var(--muted) 55%, transparent);
    }
    .card-top {
      margin: 0 0 0.4rem;
      padding-right: 5.5rem;
      gap: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.7rem;
    }
    .card-top .src, .when {
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.64rem;
      font-weight: 500;
      color: var(--muted);
    }
    .card-top .src {
      color: var(--fg);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .card-top .badge, .badge {
      border: 0;
      border-radius: 0;
      padding: 0.05rem 0;
      background: transparent;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.62rem;
      color: var(--muted);
    }
    .card-top .badge::before {
      content: "· ";
      color: var(--border);
    }
    .badge-fresh {
      color: #166534 !important;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-fresh {
      color: #bbf7d0 !important;
    }
    .badge-trend {
      color: #991b1b !important;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-trend {
      color: #fecaca !important;
    }
    .badge-new {
      color: #92400e !important;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-new {
      color: #fde68a !important;
    }
    a.badge-storyline {
      color: var(--accent) !important;
      font-weight: 600;
      text-decoration: none;
    }
    a.badge-storyline:hover {
      text-decoration: underline;
    }
    .card-main {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    .card-text {
      flex: 1;
    }
    article h3 {
      margin: 0 0 0.35rem;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: 1.28rem;
      line-height: 1.22;
    }
    article h3 a {
      font-weight: 650;
      color: inherit;
      text-decoration: none;
    }
    article h3 a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .why {
      max-width: 45rem;
      margin: 0.3rem 0 0;
      font-size: 0.93rem;
      line-height: 1.56;
    }
    .matters {
      max-width: 45rem;
      margin: 0.7rem 0 0;
      padding: 0.65rem 0.8rem;
      border-left: 2px solid var(--accent);
      background: var(--feed-wash);
      color: var(--feed-ink);
      font-size: 0.84rem;
      line-height: 1.5;
    }
    .also {
      margin: 0.4rem 0 0;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.64rem;
      color: var(--muted);
    }
    .also a {
      color: var(--accent);
      text-decoration: none;
    }
    .also a:hover {
      text-decoration: underline;
    }
    .state {
      border: 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 1.2rem 0;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }
    .actions a {
      color: var(--accent);
      font-size: 0.88rem;
      text-decoration: none;
    }
    .actions a:hover {
      text-decoration: underline;
    }
    .edition-heading {
      margin: 0.35rem 0 0;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .paused-notice {
      margin: 0 0 1.1rem;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-left: 3px solid var(--warm);
      border-radius: 4px;
      background: var(--card);
      color: var(--fg);
      font-size: 0.86rem;
      line-height: 1.55;
    }
    .paused-notice a {
      color: var(--accent);
      text-decoration: none;
    }
    .paused-notice a:hover {
      text-decoration: underline;
    }
    .newer-english {
      margin-top: 1.6rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--border);
    }
    .newer-english h2 {
      margin: 0 0 0.6rem;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--fg);
    }
    .newer-english ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .newer-english li {
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--fg);
    }
    .newer-english-note {
      margin: 0.7rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .newer-english-note a {
      color: var(--accent);
      text-decoration: none;
    }
    .newer-english-note a:hover {
      text-decoration: underline;
    }

    @media (max-width:640px) {
      main { padding-left:1rem; padding-right:1rem; }
      .feed-hero { grid-template-columns:1fr; gap:0.15rem; margin:0.9rem 0 0.8rem; }
      .feed-kicker { display:none; }
      .feed-title { font-size:1.9rem; line-height:1.05; letter-spacing:-.035em; }
      .feed-promise { display:none; }
      #meta { margin-top:0.4rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="site-chrome" data-site-section="/">

  <script>
    function esc(v) {
      return String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
    function kstWindow(days) {
      const now = new Date();
      const kstNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
      const end = new Date(kstNow.getFullYear(), kstNow.getMonth(), kstNow.getDate(), 23, 59, 59, 999);
      const start = new Date(kstNow.getFullYear(), kstNow.getMonth(), kstNow.getDate() - (days - 1), 0, 0, 0, 0);
      const offset = '+09:00';
      const fmt = (d) => {
        const pad = (n, w = 2) => String(n).padStart(w, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}${offset}`;
      };
      return { from: fmt(start), to: fmt(end) };
    }
    function relTime(value) {
      const t = Date.parse(value || '');
      if (!Number.isFinite(t)) return '';
      const hours = Math.max(0, Math.round((Date.now() - t) / 3600000));
      if (hours < 1) return '방금 업데이트';
      if (hours < 24) return `${hours}시간 전 업데이트`;
      return `${Math.round(hours / 24)}일 전 업데이트`;
    }
    // translation-budget-governor plan, Phase 6.3: single obvious toggle for
    // the "Newer in English" strip. Flip to false to ship dark without
    // touching the render logic below.
    const SHOW_NEWER_IN_ENGLISH_STRIP = true;

    function formatKstDate(value) {
      const t = Date.parse(value || '');
      if (!Number.isFinite(t)) return '';
      const kst = new Date(new Date(t).toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
      return `${kst.getMonth() + 1}월 ${kst.getDate()}일`;
    }

    // reason: "provider_daily_cap" resets at the next Google daily quota
    // window, close enough to "tomorrow" that a KST date would be
    // over-precise; "monthly_budget" resumes on a specific future date.
    function pausedResumeCopy(data) {
      if (data?.reason === 'provider_daily_cap') return '내일';
      return formatKstDate(data?.resumes_at) || null;
    }

    // Renders the calm one-line budget_paused notice above the feed.
    // Returns true when shown, so callers know to skip the generic stale
    // banner (the paused notice replaces it, never stacks with it).
    function renderPausedNotice(data) {
      const el = document.getElementById('pausedNotice');
      const resumeCopy = data?.status === 'budget_paused' ? pausedResumeCopy(data) : null;
      if (!resumeCopy) {
        el.hidden = true;
        el.innerHTML = '';
        return false;
      }
      const snapshotDate = formatKstDate(data.source_run_at) || '최근';
      // "내일" takes no particle; dates take "에" (8월 1일에 vs 내일).
      const resumePhrase = resumeCopy === '내일' ? '내일' : `${resumeCopy}에`;
      el.hidden = false;
      el.innerHTML = `이번 달 번역 예산이 소진되어 ${esc(snapshotDate)} 스냅샷을 보여드리고 있습니다. 새 번역은 ${esc(resumePhrase)} 재개됩니다 · 최신 소식은 <a href="/">영어 피드</a>에서 →`;
      return true;
    }

    // Dated-edition framing (Phase 6.2): when the page isn't current, show
    // the snapshot as a dated edition instead of a live feed with fine-print
    // staleness.
    function renderEditionHeading(data) {
      const el = document.getElementById('editionHeading');
      const isCurrent = !!(data && data.status === 'current' && data.is_current);
      const snapshotDate = data?.source_run_at ? formatKstDate(data.source_run_at) : '';
      if (isCurrent || !snapshotDate) {
        el.hidden = true;
        el.textContent = '';
        return;
      }
      el.hidden = false;
      el.textContent = `${snapshotDate} 기준 한국어 브리핑`;
    }

    function prettifySource(slug) {
      const s = String(slug || '').trim();
      if (!s) return 'unknown';
      return s.split(/[_\s]+/)
        .filter(Boolean)
        .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    // Simplified dated card for the frozen snapshot (paused state): same
    // card markup/classes as the live render, minus live-only badges
    // (Fresh/New/Climbing need live rank data a frozen snapshot doesn't have).
    function frozenCardHtml(it, i) {
      const rank = i + 1;
      const source = esc(prettifySource(it.source));
      const published = it.published ? esc(String(it.published).slice(0, 10)) : '';
      const title = esc(it.title || 'Untitled');
      const href = esc(it.url || '#');
      const summary = it.summary_1line ? esc(it.summary_1line) : '';
      const why = String(it.why_it_matters || '').trim();
      return `
        <article>
          <span class="rank-no" aria-label="Rank ${rank}">${String(rank).padStart(2, '0')}</span>
          <div class="card-top">
            <div class="card-meta">
              <span class="src">${source}</span>
              ${published ? `<span class="when">${published}</span>` : ''}
            </div>
          </div>
          <div class="card-main">
            <div class="card-text">
              <h3><a href="${href}" target="_blank" rel="noopener">${title}</a></h3>
              ${summary ? `<p class="why">${summary}</p>` : ''}
            </div>
          </div>
          ${why ? `<p class="matters">💡 ${esc(why)}</p>` : ''}
        </article>`;
    }

    function hideNewerInEnglish() {
      const el = document.getElementById('newerEnglish');
      el.hidden = true;
      el.innerHTML = '';
    }

    // Phase 6.3: when paused/stale, list English titles that entered the
    // Brief top-20 after the frozen snapshot's source_run_at, as a clearly
    // labeled separate section. Titles stay plain English text (not styled
    // as feed cards) and the section links out to / as a whole, so this
    // never reads as a mixed Korean/English card in the main list.
    async function renderNewerInEnglish(data) {
      const el = document.getElementById('newerEnglish');
      if (!SHOW_NEWER_IN_ENGLISH_STRIP) {
        hideNewerInEnglish();
        return;
      }
      const cutoff = Date.parse(data?.source_run_at || '');
      if (!Number.isFinite(cutoff)) {
        hideNewerInEnglish();
        return;
      }
      try {
        const w = kstWindow(7);
        const u = new URL('/api/feed', location.origin);
        u.searchParams.set('label', 'brief');
        u.searchParams.set('limit', '20');
        u.searchParams.set('from', w.from);
        u.searchParams.set('to', w.to);
        const res = await fetch(u.pathname + u.search);
        if (!res.ok) throw new Error(`feed_${res.status}`);
        const en = await res.json();
        const items = Array.isArray(en?.items) ? en.items : [];
        const newer = items.filter((it) => {
          const t = Date.parse(it?.first_seen || it?.published || '');
          return Number.isFinite(t) && t > cutoff;
        }).slice(0, 8);
        if (!newer.length) {
          hideNewerInEnglish();
          return;
        }
        el.hidden = false;
        el.innerHTML = `
          <h2>그 이후 새로 올라온 소식 (영어)</h2>
          <ul>${newer.map((it) => `<li>${esc(it.title || 'Untitled')}</li>`).join('')}</ul>
          <p class="newer-english-note"><a href="/">영어 live feed에서 확인하기 →</a></p>
        `;
      } catch (e) {
        hideNewerInEnglish();
      }
    }
    // Renders the frozen snapshot's Korean cards as a dated edition.
    // frozen_snapshot is the API's guarantee that items are the Korean
    // snapshot, not live English items from an older artifact.
    function renderFrozenList(data) {
      const frozen = data?.frozen_snapshot === true && Array.isArray(data.items) ? data.items : [];
      if (!frozen.length) return false;
      document.getElementById('list').innerHTML = frozen.map(frozenCardHtml).join('') +
        `<div class="state">${esc(formatKstDate(data.source_run_at) || '이전')} 스냅샷의 끝입니다. 최신 전체 피드는 <a href="/">영어 feed</a>에서 볼 수 있습니다.</div>`;
      return true;
    }
    function fallback(data) {
      const pausedShown = renderPausedNotice(data);
      if (pausedShown) {
        // The calm notice above the feed already explains the state; don't
        // stack the generic stale banner underneath it.
        document.getElementById('meta').textContent = '';
        if (!renderFrozenList(data)) {
          document.getElementById('list').innerHTML = `<div class="state"><p>표시할 수 있는 이전 스냅샷이 없습니다.</p><div class="actions"><a href="/">영어 live feed 보기</a></div></div>`;
        }
      } else if (renderFrozenList(data)) {
        // Transient incomplete (live feed slightly ahead of the snapshot):
        // keep the snapshot cards readable under one light meta line instead
        // of the heavy stale banner — never an empty page while a complete
        // snapshot exists.
        document.getElementById('meta').textContent = '일부 최신 항목의 번역을 준비 중입니다 · 최신 전체 피드는 영어 피드에서 볼 수 있습니다.';
      } else {
        const translated = data?.translated_at ? `마지막 번역: ${esc(relTime(data.translated_at))}` : '아직 사용 가능한 한국어 snapshot이 없습니다.';
        document.getElementById('meta').textContent = '현재 한국어 피드를 준비 중입니다.';
        document.getElementById('list').innerHTML = `<div class="state"><strong>한국어 피드가 아직 최신 상태가 아닙니다.</strong><p>${translated}</p><p>지금 최신 피드를 보려면 영어 live feed를 열어 주세요.</p><div class="actions"><a href="/">영어 live feed 보기</a></div></div>`;
      }
      renderEditionHeading(data);
      renderNewerInEnglish(data);
    }
    function render(data, storylines = []) {
      if (!data || data.status !== 'current' || !data.is_current || !Array.isArray(data.items) || !data.items.length) {
        fallback(data);
        return;
      }

      document.getElementById('pausedNotice').hidden = true;
      document.getElementById('editionHeading').hidden = true;
      hideNewerInEnglish();

      // Build storyline lookup map
      const storylineByUrl = new Map();
      for (const sl of storylines) {
        for (const u of sl.member_urls || []) {
          const norm = String(u || '').trim().replace(/\/$/, '').toLowerCase();
          storylineByUrl.set(norm, sl);
        }
      }

      const visitLastMs = Number(localStorage.getItem('ai_feed_last_visit_v1') || 0);

      function isNewSinceLastVisit(it) {
        if (!(visitLastMs > 0)) return false;
        const t = Date.parse(it.first_seen || it.published || '');
        return Number.isFinite(t) && t > visitLastMs;
      }


      document.getElementById('meta').textContent = `${relTime(data.source_run_at)} · 번역 ${data.items.length}개`;
      document.getElementById('list').innerHTML = data.items.map((it, i) => {
        const rank = i + 1;
        const source = esc(prettifySource(it.source));
        const published = it.published ? esc(it.published.slice(0, 10)) : '';
        const title = esc(it.title || 'Untitled');
        const href = esc(it.url || '#');
        const summary = it.summary_1line ? esc(it.summary_1line) : '';

        // Compute badges
        const isFresh = String(it.tier_hint || '') === 'tier1_fresh';
        const isNew = rank !== null && !isFresh && isNewSinceLastVisit(it);
        
        const normUrl = String(it.url || '').trim().replace(/\/$/, '').toLowerCase();
        const storyline = storylineByUrl.get(normUrl);
        let storylineBadge = '';
        if (storyline) {
          const t = new Date(it.published || it.first_seen || '');
          const day = Number.isNaN(t.getTime()) ? '' : t.toISOString().slice(0, 10);
          const idx = (storyline.days || []).indexOf(day);
          const dayNum = idx >= 0 ? idx + 1 : (storyline.day_count || 1);
          storylineBadge = `<a class="badge badge-storyline" href="/storyline/${esc(storyline.slug)}" title="Day ${dayNum} of a developing storyline: ${esc(storyline.label)}">📈 Developing · day ${dayNum}</a>`;
        }

        const alsoCoveredAll = (Array.isArray(it.also_covered) ? it.also_covered : [])
          .filter((e) => e && e.source && e.url);
        const sourceCount = alsoCoveredAll.length + 1;
        const lastRank = it.rank_at_last_seen == null ? NaN : Number(it.rank_at_last_seen);
        const prevRank = it.rank_prev_seen == null ? NaN : Number(it.rank_prev_seen);
        const isClimbing = Number.isFinite(lastRank) && Number.isFinite(prevRank) && prevRank - lastRank >= 2;
        const isReaderBoosted = Number(it.reader_adjustment || 0) >= 0.05;

        const alsoHtml = alsoCoveredAll.slice(0, 4)
          .map((e) => `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(prettifySource(e.source))}</a>`)
          .join(', ');

        const whyRaw = String(it.why_it_matters || '').trim();
        const why = (whyRaw && !whyRaw.startsWith('Matches feed focus:') && whyRaw !== 'Potential relevance to AI platform engineering; verify practical impact.') ? esc(whyRaw) : '';

        return `
          <article>
            <span class="rank-no" aria-label="Rank ${rank}">${String(rank).padStart(2, '0')}</span>
            <div class="card-top">
              <div class="card-meta">
                <span class="src">${source}</span>
                ${published ? `<span class="when">${published}</span>` : ''}
                ${isFresh ? `<span class="badge badge-fresh">⚡ Fresh</span>` : ''}
                ${isNew ? `<span class="badge badge-new">New</span>` : ''}
                ${sourceCount >= 2 ? `<span class="badge badge-trend" title="Covered by ${sourceCount} sources">🔥 ${sourceCount} sources</span>` : ''}
                ${isClimbing ? `<span class="badge badge-trend">⬆️ Climbing</span>` : ''}
                ${isReaderBoosted ? `<span class="badge badge-trend">👍 Reader-boosted</span>` : ''}
                ${storylineBadge}
              </div>
            </div>
            <div class="card-main">
              <div class="card-text">
                <h3><a href="${href}" target="_blank" rel="noopener">${title}</a></h3>
                ${summary ? `<p class="why">${summary}</p>` : ''}
              </div>
            </div>
            ${why ? `<p class="matters">💡 ${why}</p>` : ''}
            ${alsoHtml ? `<p class="also">Also covered by ${alsoHtml}</p>` : ''}
          </article>
        `;
      }).join('') + '<div class="state">번역된 상위 Brief snapshot의 끝입니다. 최신 전체 피드는 <a href="/">영어 feed</a>에서 볼 수 있습니다.</div>';
    }
    async function load() {
      let storylines = [];
      try {
        const slRes = await fetch('/api/storylines');
        if (slRes.ok) {
          const slData = await slRes.json();
          storylines = Array.isArray(slData.storylines) ? slData.storylines : [];
        }
      } catch (e) {
        console.warn('Failed to load storylines:', e);
      }

      const w = kstWindow(7);
      const u = new URL('/api/feed', location.origin);
      u.searchParams.set('locale', 'ko');
      u.searchParams.set('localized_snapshot', 'latest');
      u.searchParams.set('label', 'brief');
      u.searchParams.set('limit', '20');
      u.searchParams.set('from', w.from);
      u.searchParams.set('to', w.to);
      const res = await fetch(u.pathname + u.search);
      if (!res.ok) throw new Error(`feed_${res.status}`);
      render(await res.json(), storylines);

      // Move EN link before the browse button for desktop view
      const enLink = document.querySelector('.site-actions-fallback .site-language-action');
      const browseBtn = document.querySelector('[data-site-browse-open]');
      if (enLink && browseBtn) {
        enLink.classList.add('site-bar-language-action');
        browseBtn.before(enLink);
      }
    }
    load().catch(() => fallback(null));
  </script>
</body>
</html>
