    (function () {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);

  <style>
    /* Agent Builder's Playbook — "AI operations instrument" family member.
       Reader job: decide what to change in your agent. Signature: each entry is
       a change record with a SIGNAL → APPLY → EXPECTED spine, where APPLY is the
       single weighted, accent-ruled block (reads like a patch hunk). No boxed
       cards, no pills: hairline rules + monospace utility labels. Tokens/type
       are shared with the daily/weekly/story surfaces. */
    html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; }
    :root, html[data-theme="light"] {
      color-scheme: light;
      --bg:#f5f7fa; --card:#ffffff; --border:#d7dde7; --accent:#2457d6;
      --muted:#687386; --fg:#121722; --signal:#23875b; --warm:#b6780c;
      --apply-wash:#eef3ff; --apply-edge:#2457d6;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg:#11151c; --card:#171d26; --border:#313946; --accent:#7ca0ff;
      --muted:#9aa6b6; --fg:#eff3f8; --signal:#54b886; --warm:#e0ad4e;
      --apply-wash:#1b2436; --apply-edge:#7ca0ff;
    }
    body { margin:0; line-height:1.5; overflow-x:hidden; background:var(--bg); color:var(--fg);
      font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    button, input, select, textarea { color: inherit; background: var(--card); border-color: var(--border); }
    a { color: var(--accent); }
    code {
      font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 0.85em;
      padding: 0.12rem 0.3rem; background: var(--apply-wash, var(--card));
      border: 1px solid var(--border); border-radius: 4px; color: var(--fg); }
    main { width:100%; max-width:980px; margin:1rem auto; padding:0 1.35rem 3rem; overflow-x:clip; }
    header { margin-bottom: 1rem; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:0.75rem; }
    .topbar h1 { margin:0; font-size:1.5rem; line-height:1.2; overflow-wrap:anywhere; }
    .muted { color: var(--muted); }
    #meta { margin:.35rem 0 0; font-size:.8rem; color:var(--muted);
      font-family:ui-monospace,"SFMono-Regular",monospace; letter-spacing:.04em; }

    /* Quiet instrument nav — no Oat gray fills, hairline only. */
    menu { display:flex; flex-wrap:wrap; gap:.45rem .6rem; padding:0; margin:.85rem 0 0; align-items:center; }
    menu a[role="button"], .archive select {
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.74rem; letter-spacing:.03em;
      padding:.42rem .6rem; min-height:34px; display:inline-flex; align-items:center;
      border:1px solid var(--border); border-radius:0; background:transparent; color:var(--fg);
      text-decoration:none; cursor:pointer; transition:border-color .12s ease, color .12s ease; }
    menu a[role="button"]:hover, .archive select:hover {
      border-color:var(--accent); color:var(--accent); background:transparent; }
    .archive { margin-left:auto; display:flex; align-items:center; gap:.45rem;
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.66rem; letter-spacing:.1em;
      text-transform:uppercase; color:var(--muted); }
    .archive select { text-transform:none; letter-spacing:.02em; }

    /* Hero — finishable thesis: "N changes worth making". */
    .pb-hero { margin:2.3rem 0 1.7rem; }
    .pb-kicker { margin:0 0 .55rem; font-family:ui-monospace,"SFMono-Regular",monospace;
      font-size:.67rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); }
    .pb-headline { margin:0; font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
      font-size:clamp(2.5rem,6.4vw,4.2rem); font-weight:700; letter-spacing:-.045em; line-height:.94; }
    .pb-thesis { max-width:43rem; margin:1rem 0 0; font-size:1rem; line-height:1.62; }
    .pb-intro { max-width:43rem; margin:.7rem 0 0; font-size:.95rem; line-height:1.62; color:var(--muted); }
    .pb-intro p { margin:0 0 .6rem; }
    .pb-intro p:last-child { margin-bottom:0; }
    .pb-covers { margin:1.3rem 0 0; padding:.8rem 0 0; border-top:1px solid var(--border);
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.7rem; letter-spacing:.04em;
      color:var(--muted); line-height:1.8; }
    .pb-covers b { color:var(--accent); font-weight:700; letter-spacing:.12em;
      text-transform:uppercase; margin-right:.7rem; }
    .pb-covers .sep { color:var(--border); margin:0 .35rem; }

    /* The change records. */
    .pb-list { border-top:1px solid var(--border); margin:1.7rem 0 0; }
    .pb-record { display:grid; grid-template-columns:minmax(8.5rem,.4fr) minmax(0,1.6fr);
      gap:1rem 2.2rem; padding:1.6rem 0; border-bottom:1px solid var(--border); }
    .pb-rail { display:flex; flex-direction:column; gap:.7rem;
      font-family:ui-monospace,"SFMono-Regular",monospace; }
    .pb-area { font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
      color:var(--accent); line-height:1.3; }
    .pb-effort { display:flex; align-items:center; gap:.5rem; font-size:.6rem; letter-spacing:.11em;
      text-transform:uppercase; color:var(--muted); }
    .pb-eff-bar { display:inline-flex; gap:3px; }
    .pb-eff-seg { width:14px; height:5px; border:1px solid var(--border); border-radius:1px; background:transparent; }
    .pb-eff-seg.on { background:var(--accent); border-color:var(--accent); }

    .pb-body { min-width:0; }
    .pb-title { margin:0 0 1rem; font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
      font-size:clamp(1.22rem,2.5vw,1.5rem); font-weight:700; letter-spacing:-.02em; line-height:1.08; }
    .pb-label { font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.6rem; font-weight:700;
      letter-spacing:.13em; text-transform:uppercase; }
    .pb-signal { margin:0 0 1rem; }
    .pb-signal .pb-label { display:block; color:var(--muted); margin:0 0 .3rem; }
    .pb-signal p { margin:0; font-size:.88rem; line-height:1.58; color:var(--muted); }

    /* APPLY — the dominant instruction (the page's single bold move). */
    .pb-apply { margin:0 0 1rem; padding:.85rem 1.05rem .9rem;
      border-left:3px solid var(--apply-edge); background:var(--apply-wash); }
    .pb-apply .pb-label { display:block; color:var(--accent); margin:0 0 .35rem; }
    .pb-apply p { margin:0; font-size:1.06rem; line-height:1.5; font-weight:500; color:var(--fg); }

    .pb-expected { margin:0; }
    .pb-expected .pb-label { color:var(--signal); }
    .pb-expected p { margin:.3rem 0 0; font-size:.9rem; line-height:1.56; }

    .pb-source { margin:1.05rem 0 0; padding-top:.75rem; border-top:1px solid var(--border);
      display:flex; flex-wrap:wrap; justify-content:space-between; gap:.5rem 1rem;
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.68rem; letter-spacing:.03em;
      color:var(--muted); }
    .pb-source a { color:var(--accent); text-decoration:none; white-space:nowrap; }
    .pb-source a:hover { text-decoration:underline; }

    .pb-end { display:flex; align-items:center; gap:.8rem; margin:2.4rem 0 .4rem;
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.7rem; color:var(--signal);
      letter-spacing:.06em; text-transform:uppercase; }
    .pb-end::before, .pb-end::after { content:""; height:1px; flex:1; background:var(--border); }

    .state { padding:2.2rem 1rem; text-align:center; color:var(--muted);
      border:1px solid var(--border); margin:1.7rem 0 0; }
    footer { margin-top:2.2rem; padding-top:.9rem; border-top:1px solid var(--border);
      color:var(--muted); font-size:.82rem; }

    button:focus-visible, a:focus-visible, select:focus-visible {
      outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent); outline-offset:3px; }

    @media (max-width:620px) {
      main { padding-left:1rem; padding-right:1rem; }
      .pb-hero { margin-top:1.7rem; }
      .pb-headline { font-size:2.7rem; }
      .pb-record { grid-template-columns:1fr; gap:.75rem; padding:1.4rem 0; }
      .pb-rail { flex-direction:row; align-items:center; flex-wrap:wrap; gap:.8rem 1.2rem; }
      .archive { width:100%; margin-left:0; }
      .archive select { flex:1; }
    }
    @media (prefers-reduced-motion:reduce) {
      * { scroll-behavior:auto !important; }
      menu a[role="button"], .archive select { transition:none; }
    }
  </style>
</head>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const btn = document.getElementById('themeToggle');
      if (btn) {
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        btn.setAttribute('title', theme === 'dark' ? '라이트 테마로 전환' : '다크 테마로 전환');
        btn.setAttribute('aria-label', theme === 'dark' ? '라이트 테마로 전환' : '다크 테마로 전환');
      }
    }
    function initThemeToggle() {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
      btn.addEventListener('click', () => {
        const now = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(now === 'dark' ? 'light' : 'dark');
      });
    }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function safeUrl(u) {
      if (!u) return '#';
      try {
        const url = new URL(u, window.location.origin);
        return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '#';
      } catch { return '#'; }
    }

    function fmtLongDate(v) {
      if (!v) return '';
      const d = new Date(`${v}T00:00:00`);
      return Number.isNaN(d.getTime())
        ? String(v)
        : d.toLocaleDateString('ko-KR', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Locale-aware mapping for areas to Korean
    const AREA_TRANSLATIONS = {
      'orchestration': '오케스트레이션',
      'retrieval': '리트리벌 (RAG)',
      'memory': '메모리',
      'cost & latency': '비용 및 대기시간',
      'evals': '평가 (Evals)',
      'reliability': '신뢰성',
      'safety': '안전성'
    };

    function translateArea(area) {
      const a = String(area || '').trim();
      return AREA_TRANSLATIONS[a.toLowerCase()] || a;
    }

    function dateFromLocation() {
      const q = new URLSearchParams(window.location.search).get('date');
      if (q) return q;
      const m = window.location.pathname.match(/\/playbook\/(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : null;
    }

    const isLocal = () => /^(127\.0\.0\.1|localhost)$/.test(location.hostname);

    function introParagraphs(intro) {
      if (Array.isArray(intro)) return intro.map((p) => String(p).trim()).filter(Boolean);
      return String(intro || '').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
    }

    // Effort as an honest 3-segment meter (low=1, medium=2, high=3) — not a
    // colored hype pill. Empty effort renders nothing.
    function effortMeter(effort) {
      const e = String(effort || '').toLowerCase();
      const rank = { low: 1, medium: 2, high: 3 }[e];
      if (!rank) return '';
      const mapped = { low: '낮음', medium: '보통', high: '높음' }[e] || e;
      const segs = [1, 2, 3].map((n) => `<span class="pb-eff-seg${n <= rank ? ' on' : ''}"></span>`).join('');
      return `<span class="pb-effort" title="난이도: ${esc(mapped)}"><span>난이도</span>` +
        `<span class="pb-eff-bar" role="img" aria-label="난이도: ${esc(mapped)}">${segs}</span></span>`;
    }

    // One change record: a SIGNAL → APPLY → EXPECTED spine. APPLY is the single
    // dominant block; problem/result are quiet annotations bracketing it.
    function renderRecord(c) {
      const href = safeUrl(c.source_url || c.topic_url || c.url);
      const sourceLabel = c.source || (href !== '#' ? 'source' : '');
      const areaKo = translateArea(c.area);
      return `
        <article class="pb-record">
          <div class="pb-rail">
            ${c.area ? `<span class="pb-area">${esc(areaKo)}</span>` : ''}
            ${effortMeter(c.effort)}
          </div>
          <div class="pb-body">
            <h2 class="pb-title">${esc(c.title || '제목 없음')}</h2>
            ${c.problem ? `<div class="pb-signal"><span class="pb-label">시그널 (Signal)</span><p>${esc(c.problem)}</p></div>` : ''}
            ${c.apply ? `<div class="pb-apply"><span class="pb-label">적용 (Apply)</span><p>${esc(c.apply)}</p></div>` : ''}
            ${c.result ? `<div class="pb-expected"><span class="pb-label">→ 예상 결과 (Expected)</span><p>${esc(c.result)}</p></div>` : ''}
            ${href !== '#' ? `<p class="pb-source"><span>출처</span><a href="${href}" target="_blank" rel="noopener" data-track="playbook-link">${esc(sourceLabel)} →</a></p>` : ''}
          </div>
        </article>`;
    }

    function renderCovers(cards) {
      const areas = [];
      for (const c of cards) {
        const a = translateArea(c.area);
        if (a && !areas.includes(a)) areas.push(a);
      }
      if (!areas.length) return '';
      return `<p class="pb-covers"><b>다루는 분야</b>${
        areas.map(esc).join('<span class="sep">·</span>')
      }</p>`;
    }

    function renderEdition(edition) {
      document.title = `${edition.title || "아키텍트 플레이북"} | LLM Digest`;
      document.getElementById('jsonLink').href = `/api/playbook?date=${encodeURIComponent(edition.date)}&locale=ko`;
      const cards = Array.isArray(edition.cards) ? edition.cards : [];
      const n = cards.length;
      document.getElementById('meta').textContent =
        `${edition.date || ''} · ${n}개 액션 카드`;

      const headline = n
         ? `${n}개의 적용 가능한 변경 사항`
        : '적용할 변경 사항 없음';
      const intro = introParagraphs(edition.intro);

      document.getElementById('edition').innerHTML = `
        <section class="pb-hero">
          <p class="pb-kicker">에이전트 변경 로그 · ${esc(fmtLongDate(edition.date))}</p>
          <h2 class="pb-headline">${esc(headline)}</h2>
          <p class="pb-thesis">각 카드는 문제를 해결할 <strong>시그널(Signal)</strong>,
            에이전트에 구체적으로 <strong>적용할 사항(Apply)</strong>, 그리고 예상되는
            <strong>결과(Expected)</strong>를 정의합니다.</p>
          ${intro.length ? `<div class="pb-intro">${intro.map((p) => `<p>${esc(p)}</p>`).join('')}</div>` : ''}
          ${renderCovers(cards)}
        </section>
        ${n
          ? `<div class="pb-list">${cards.map(renderRecord).join('')}</div>
             <p class="pb-end">회차 끝 — ${n}개 항목</p>`
          : '<div class="state">이번 회차에 등록된 카드가 없습니다.</div>'}`;
    }

    async function loadArchive(currentDate) {
      const sel = document.getElementById('archive');
      try {
        let res = await fetch('/api/playbook?list=1&locale=ko');
        if (res.status === 404 && isLocal()) {
          res = await fetch('/data/i18n/ko/playbook/index.json', { cache: 'no-store' });
        }
        if (!res.ok) throw new Error('list_http_' + res.status);
        const payload = await res.json();
        const editions = Array.isArray(payload) ? payload : (payload.editions || []);
        if (!editions.length) { sel.innerHTML = '<option>—</option>'; return; }
        sel.innerHTML = editions.map((d) =>
          `<option value="${esc(d.date)}" ${d.date === currentDate ? 'selected' : ''}>${esc(d.date)}</option>`).join('');
        const index = editions.findIndex((d) => d.date === currentDate);
        const configureDirection = (id, item, label) => {
          const link = document.getElementById(id);
          if (!item) {
            link.hidden = true;
            link.removeAttribute('href');
            return;
          }
          link.hidden = false;
          link.href = `?date=${encodeURIComponent(item.date)}`;
          link.setAttribute('aria-label', `${label}, ${item.date}`);
        };
        configureDirection('archivePrev', index >= 0 ? editions[index + 1] : null, '이전 회차');
        configureDirection('archiveNext', index > 0 ? editions[index - 1] : null, '다음 회차');
        sel.addEventListener('change', () => {
          window.location.search = `?date=${encodeURIComponent(sel.value)}`;
        });
      } catch {
        sel.innerHTML = '<option>—</option>';
      }
    }

    async function run() {
      const date = dateFromLocation();
      const url = date ? `/api/playbook?date=${encodeURIComponent(date)}&locale=ko` : '/api/playbook?locale=ko';
      try {
        let res = await fetch(url);
        if (res.status === 404 && isLocal()) {
          res = await fetch(
            date ? `/data/i18n/ko/playbook/${encodeURIComponent(date)}.json` : '/data/i18n/ko/playbook/latest.json',
            { cache: 'no-store' }
          );
        }
        if (res.status === 404) {
          document.getElementById('meta').textContent = '회차가 없습니다';
          document.getElementById('edition').innerHTML =
            '<div class="state">발행된 플레이북 회차가 없습니다. 곧 다시 확인해 주세요.</div>';
          return;
        }
        if (!res.ok) throw new Error('playbook_http_' + res.status);
        const edition = await res.json();
        renderEdition(edition);
        loadArchive(edition.date);      } catch (err) {
        console.error(err);
        document.getElementById('meta').textContent = '플레이북 서비스 불가';
        document.getElementById('edition').innerHTML =
          '<div class="state">플레이북을 불러올 수 없습니다. 잠시 후 새로고침해 주세요.</div>';
      }
    }

    initThemeToggle();
    run();
  </script>

      const go = () => import('/mascot/mascot.js').catch(() => {});
      'requestIdleCallback' in window ? requestIdleCallback(go, { timeout: 5000 }) : setTimeout(go, 2500);
    }
  </script>
