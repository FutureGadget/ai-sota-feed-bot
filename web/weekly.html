<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Weekly Recap | LLM Digest</title>
  <meta name="description" content="What happened in AI this week — the week's model releases, research, and tooling news, summarized and categorized in one read." />
  <link rel="canonical" href="https://www.llm-digest.com/weekly" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LLM Digest" />
  <meta property="og:title" content="AI Weekly Recap" />
  <meta property="og:description" content="What happened in AI this week — the week's model releases, research, and tooling news, summarized and categorized in one read." />
  <meta property="og:url" content="https://www.llm-digest.com/weekly" />
  <meta property="og:image" content="https://www.llm-digest.com/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.llm-digest.com/og-default.png" />
  <link rel="alternate" type="application/rss+xml" title="LLM Digest feed" href="/rss.xml" />
  <link rel="stylesheet" href="https://oat.ink/oat.min.css" />
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://oat.ink/oat.min.js" defer></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    :root, html[data-theme="light"] {
      color-scheme: light;
      --bg:#f5f7fa; --card:#ffffff; --border:#d7dde7; --accent:#2457d6;
      --muted:#687386; --fg:#121722; --week-wash:#eaf0ff; --week-ink:#18243b;
      --signal:#23875b; --warm:#b6780c; --turn:#c4483f;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg:#11151c; --card:#171d26; --border:#313946; --accent:#7ca0ff;
      --muted:#9aa6b6; --fg:#eff3f8; --week-wash:#1c2a48; --week-ink:#e8eefb;
      --signal:#54b886; --warm:#e0ad4e; --turn:#ef756d;
    }
    body { margin:0; line-height:1.5; overflow-x:hidden; background:var(--bg); color:var(--fg);
      font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    button, input, select, textarea { color: inherit; background: var(--card); border-color: var(--border); }
    a { color: var(--accent); }
    code {
      font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 0.85em;
      padding: 0.12rem 0.3rem; background: var(--week-wash, var(--card));
      border: 1px solid var(--border); border-radius: 4px; color: var(--fg); }
    main { width:100%; max-width:980px; margin:1rem auto; padding:0 1.35rem 3rem; overflow-x:clip; }
    header { margin-bottom: 1rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .topbar h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
    /* Quiet instrument nav — no Oat gray fills, hairline only. */
    menu { display: flex; flex-wrap: wrap; gap: .45rem .6rem; padding: 0; margin: .85rem 0 0; align-items: center; }
    menu a[role="button"], #themeToggle, .archive select, menu .menu-share {
      font-family: ui-monospace, "SFMono-Regular", monospace; font-size: .74rem; letter-spacing: .03em;
      padding: .42rem .6rem; min-height: 34px; display: inline-flex; align-items: center;
      border: 1px solid var(--border); border-radius: 0; background: transparent; color: var(--fg);
      text-decoration: none; cursor: pointer; transition: border-color .12s ease, color .12s ease; }
    menu a[role="button"]:hover, #themeToggle:hover, .archive select:hover, menu .menu-share:hover {
      border-color: var(--accent); color: var(--accent); background: transparent; }
    menu .menu-share.copied { color: var(--muted); border-color: var(--border); cursor: default; }
    .archive { margin-left: auto; display: flex; align-items: center; gap: .45rem;
      font-family: ui-monospace, "SFMono-Regular", monospace; font-size: .66rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted); }
    .archive select { text-transform: none; letter-spacing: .02em; }
    .muted { color: var(--muted); }
    .weekly-hero { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(15rem,.55fr);
      gap:1.5rem 2.6rem; align-items:end; margin:2.35rem 0 1.7rem; }
    .weekly-kicker { margin:0 0 .35rem; font-family:ui-monospace,"SFMono-Regular",monospace;
      font-size:.67rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); }
    .recap-title { margin:0; max-width:49rem; font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
      font-size:clamp(2.75rem,7vw,4.75rem); font-weight:700; letter-spacing:-.047em; line-height:.92; }
    .recap-range { color:var(--muted); margin:0 0 .25rem; text-align:right;
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.72rem; line-height:1.65; }
    .weekly-mark { display:flex; justify-content:flex-end; gap:4px; height:7px; margin:.75rem 0 0; }
    .weekly-mark span { width:2.7rem; background:var(--accent); }
    .weekly-mark span:nth-child(2) { width:1.7rem; background:var(--signal); }
    .weekly-mark span:nth-child(3) { width:.9rem; background:var(--warm); }
    .intro { display:grid; grid-template-columns:minmax(16rem,.75fr) minmax(0,1.25fr);
      gap:1.5rem 2.4rem; padding:1.4rem 0 1.5rem; margin:0 0 1.6rem;
      border:0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
      border-radius:0; background:transparent; font-size:.98rem; }
    .intro p { margin:0 0 .8rem; line-height:1.64; }
    .intro p:last-child { margin-bottom: 0; }
    .intro-copy { min-width:0; }
    .tldr { margin:0; padding:0 1rem 0 0; border:0; }
    .tldr-label { margin:0 0 .65rem; font-family:ui-monospace,"SFMono-Regular",monospace;
      text-transform:uppercase; letter-spacing:.11em; font-size:.66rem; font-weight:700; color:var(--accent); }
    .tldr ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:.62rem; }
    .tldr li { position:relative; padding-left:1rem; font-size:.87rem; line-height:1.48; }
    .tldr li::before { content:""; position:absolute; left:0; top:.47rem; width:6px; height:6px;
      transform:rotate(45deg); background:var(--warm); }
    .toc { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; margin:0 0 2.5rem;
      border-top:1px solid var(--border); border-left:1px solid var(--border); }
    .toc a { min-width:0; padding:.8rem .75rem; border:0; border-right:1px solid var(--border);
      border-bottom:1px solid var(--border); border-radius:0; text-decoration:none;
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.67rem; color:var(--muted); }
    .toc a:hover { color:var(--accent); background:var(--week-wash); }
    .cat { position:relative; margin:0 0 3.1rem; padding-left:1.4rem; scroll-margin-top:1rem; }
    .cat::before { content:""; position:absolute; left:0; top:.1rem; bottom:0; width:3px; background:var(--accent); }
    .cat:nth-of-type(3n+1)::before { background:var(--signal); }
    .cat:nth-of-type(3n+2)::before { background:var(--warm); }
    .cat-head { display:grid; grid-template-columns:minmax(14rem,.72fr) minmax(0,1.28fr);
      gap:1rem 2.2rem; align-items:start; padding:0 0 1rem; border-bottom:1px solid var(--border); }
    .cat h2 { margin:0; font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
      font-size:1.85rem; line-height:1; letter-spacing:-.02em; }
    .cat h2 .count { display:block; margin-top:.45rem; font-family:ui-monospace,"SFMono-Regular",monospace;
      font-size:.64rem; color:var(--muted); font-weight:400; }
    .cat-summary { margin:0; color:var(--fg); font-size:1rem; line-height:1.58; }
    .articles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 2rem; }
    article { padding:1rem 0; border:0; border-bottom:1px solid var(--border);
      border-radius:0; background:transparent; box-shadow:none; }
    article h3 { margin:0 0 .45rem; font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
      font-size:1.08rem; line-height:1.25; }
    article h3 a { text-decoration: none; }
    article h3 a:hover { color:var(--accent); }
    .art-meta { display:flex; flex-wrap:wrap; gap:.65rem; align-items:center; margin:0 0 .4rem; }
    .badge { padding:0; border:0; border-radius:0; background:transparent; color:var(--muted);
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.62rem; }
    .badge + .badge::before { content:"·"; margin-right:.65rem; color:var(--border); }
    .art-summary { margin:0; font-size:.87rem; line-height:1.55; }
    .playbook-takeaway { margin:.8rem 0 0; padding:.8rem .9rem;
      border:0; border-left:3px solid var(--accent); background:var(--week-wash); }
    .playbook-takeaway p { margin:0 0 .45rem; font-size:.78rem; line-height:1.48; }
    .playbook-takeaway p:last-child { margin-bottom:0; }
    .playbook-label, .playbook-takeaway p span { font-family:ui-monospace,"SFMono-Regular",monospace;
      font-size:.61rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .playbook-takeaway p span { display:block; margin-bottom:.12rem; }
    .playbook-apply { padding:.5rem .6rem; background:var(--card); font-size:.88rem !important; }
    .playbook-links { display:flex; justify-content:space-between; gap:.75rem; align-items:center; }
    .playbook-links span { display:inline !important; margin:0 !important; }
    .weekly-close { display:flex; align-items:center; gap:.8rem; margin:3rem 0 .6rem;
      font-family:ui-monospace,"SFMono-Regular",monospace; font-size:.7rem; color:var(--accent);
      letter-spacing:.06em; text-transform:uppercase; }
    .weekly-close::before, .weekly-close::after { content:""; height:1px; flex:1; background:var(--border); }
    .state { padding: 2rem 1rem; text-align: center; color: var(--muted); }
    /* .archive styled in header menu styles */
    .subscribe-cta { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
      gap:.75rem; margin:1.5rem 0 0; padding:1rem 1.1rem; border:0; border-left:2px solid var(--accent);
      border-radius:0; background:var(--week-wash); color:var(--week-ink); }
    .subscribe-cta p { margin: 0; }
    .subscribe-cta a { white-space: nowrap; text-decoration: none; font-weight: 600; }
    footer { margin-top: 2rem; color: var(--muted); font-size: 0.85rem; }
    button:focus-visible, a:focus-visible, select:focus-visible {
      outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent); outline-offset:3px; }
    @media (max-width:560px) {
      main { padding-left:1rem; padding-right:1rem; }
      .weekly-hero { grid-template-columns:1fr; gap:.85rem; margin-top:1.75rem; }
      .recap-title { font-size:3rem; }
      .recap-range { text-align:left; }
      .weekly-mark { justify-content:flex-start; }
      .intro { grid-template-columns:1fr; gap:1.2rem; }
      .tldr { padding-right:0; }
      .toc { grid-template-columns:1fr 1fr; }
      .cat { padding-left:1rem; }
      .cat-head { grid-template-columns:1fr; gap:.75rem; }
      .articles { grid-template-columns:1fr; }
      menu {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 0.35rem;
        -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
        mask-image: linear-gradient(to right, black 85%, transparent 100%);
      }
      menu::-webkit-scrollbar {
        display: none;
      }
      menu a {
        white-space: nowrap;
        flex-shrink: 0;
      }
      .archive {
        flex-shrink: 0;
        margin-left: 1rem;
        width: auto !important;
      }
      .archive select {
        width: auto !important;
        max-width: none !important;
      }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <h1>🗓️ AI Weekly Recap</h1>
        <button id="themeToggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
      </div>
      <p id="meta" class="muted">Loading…</p>
      <menu>
        <a href="/" role="button">← Live feed</a>
        <a href="/daily" role="button">📰 Daily recap</a>
        <a href="/voices" role="button">🗣️ Voices</a>
        <a href="/subscribe" role="button">✉️ Email digest</a>
        <a id="jsonLink" href="/api/weekly" role="button">JSON</a>
        <label class="archive muted">Week
          <select id="archive" aria-label="Choose week"></select>
        </label>
      </menu>
    </header>

    <section id="recap" aria-live="polite">
      <div class="state">Loading the weekly recap…</div>
    </section>
    <aside class="subscribe-cta" aria-label="Email subscription">
      <p><strong>Get next week’s recap by email.</strong><br><span class="muted">Plus the finishable daily brief on weekdays.</span></p>
      <a href="/subscribe" role="button">Get the email digest →</a>
    </aside>

    <footer>
      Built from the AI SOTA feed. Each item links to its original source.
    </footer>
  </main>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }
    function initThemeToggle() {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
      btn.addEventListener('click', () => {
        const now = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(now === 'dark' ? 'light' : 'dark');
      });
    }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function safeUrl(u) {
      if (!u) return '#';
      try {
        const url = new URL(u, window.location.origin);
        return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '#';
      } catch { return '#'; }
    }

    function fmtDate(v) {
      if (!v) return '';
      const d = new Date(v);
      return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // ?week= or /weekly/<week> path segment.
    function weekFromLocation() {
      const q = new URLSearchParams(window.location.search).get('week');
      if (q) return q;
      const m = window.location.pathname.match(/\/weekly\/([0-9]{4}-W[0-9]{2})/i);
      return m ? m[1] : null;
    }

    // intro may be a single string (optionally with blank-line paragraph breaks)
    // or an array of paragraph strings. Normalize to a list of paragraphs.
    function introParagraphs(intro) {
      if (Array.isArray(intro)) return intro.map((p) => String(p).trim()).filter(Boolean);
      return String(intro || '').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
    }

    function renderIntro(recap) {
      const paras = introParagraphs(recap.intro);
      const highlights = Array.isArray(recap.highlights) ? recap.highlights.filter(Boolean) : [];
      if (!paras.length && !highlights.length) return '';
      const tldr = highlights.length
        ? `<div class="tldr">
             <p class="tldr-label">The week in signals</p>
             <ul>${highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>
           </div>`
        : '';
      const body = paras.map((p) => `<p>${esc(p)}</p>`).join('');
      return `<div class="intro">${tldr}<div class="intro-copy">${body}</div></div>`;
    }

    const PLAYBOOK_CAP = 5;
    let playbookByUrl = new Map();

    function renderPlaybookTakeaway(card) {
      if (!card) return '';
      const evidenceLabel = {
        'source-measured': 'Source measured',
        'source-claimed': 'Source claim',
        'editorial-inference': 'Editorial inference'
      }[card.evidence?.kind] || '';
      const guide = String(card.topic_url || '').startsWith('/topic/')
        ? card.topic_url
        : `/playbook?date=${encodeURIComponent(card.edition_date || '')}`;
      return `<aside class="playbook-takeaway" aria-label="Playbook takeaway">
        <p class="playbook-label">Playbook takeaway</p>
        <p><span>Problem</span>${esc(card.problem || '')}</p>
        <p class="playbook-apply"><span>Apply</span>${esc(card.apply || '')}</p>
        <p><span>Expected</span>${esc(card.result || '')}</p>
        <p class="playbook-links"><span>${esc(evidenceLabel)}</span>
          <a href="${esc(guide)}" data-track="weekly-playbook">Open guide →</a></p>
      </aside>`;
    }

    function renderRecap(recap) {
      document.title = `AI Weekly Recap — ${recap.title || recap.week}`;
      document.getElementById('jsonLink').href = `/api/weekly?week=${encodeURIComponent(recap.week)}`;
      const cats = Array.isArray(recap.categories) ? recap.categories : [];
      const totalArticles = cats.reduce((n, c) => n + (c.articles?.length || 0), 0);
      document.getElementById('meta').textContent =
        `${recap.article_count ?? totalArticles} articles · ${cats.length} categories`;

      const toc = cats.length > 1
        ? `<nav class="toc">${cats.map((c) =>
            `<a href="#${esc(c.slug || c.name)}">${esc(c.name)} (${c.articles?.length || 0})</a>`).join('')}</nav>`
        : '';

      let playbookRendered = 0;
      const playbookSeen = new Set();
      const sections = cats.map((c) => {
        const arts = (c.articles || []).map((a) => {
          const href = safeUrl(a.url);
          const date = fmtDate(a.published);
          const card = playbookRendered < PLAYBOOK_CAP && !playbookSeen.has(a.url)
            ? playbookByUrl.get(a.url) : null;
          if (card) {
            playbookRendered += 1;
            playbookSeen.add(a.url);
          }
          return `
            <article>
              <h3><a href="${href}" target="_blank" rel="noopener" data-track="weekly-link">${esc(a.title || 'Untitled')}</a></h3>
              <div class="art-meta">
                ${a.source ? `<span class="badge">${esc(a.source)}</span>` : ''}
                ${date ? `<span class="badge">${esc(date)}</span>` : ''}
              </div>
              ${a.summary ? `<p class="art-summary">${esc(a.summary)}</p>` : ''}
              ${renderPlaybookTakeaway(card)}
            </article>`;
        }).join('');
        return `
          <section class="cat" id="${esc(c.slug || c.name)}">
            <div class="cat-head">
              <h2>${esc(c.name)} <span class="count">${c.articles?.length || 0} supporting item${(c.articles?.length || 0) === 1 ? '' : 's'}</span></h2>
              ${c.summary ? `<p class="cat-summary">${esc(c.summary)}</p>` : '<span></span>'}
            </div>
            <div class="articles">${arts}</div>
          </section>`;
      }).join('');

      document.getElementById('recap').innerHTML = `
        <section class="weekly-hero">
          <div>
            <p class="weekly-kicker">Weekly pattern report</p>
            <h2 class="recap-title">${cats.length} shifts that shaped AI this week</h2>
          </div>
          <div>
            <p class="recap-range">${esc(recap.start || '')} → ${esc(recap.end || '')}<br>${esc(recap.week || '')} · ${recap.article_count ?? totalArticles} articles reviewed</p>
            <div class="weekly-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          </div>
        </section>
        ${renderIntro(recap)}
        ${toc}
        ${sections || '<div class="state">No categories in this recap yet.</div>'}
        ${sections ? '<p class="weekly-close">The week, resolved into patterns</p>' : ''}`;
    }

    async function loadArchive(currentWeek) {
      const sel = document.getElementById('archive');
      try {
        let res = await fetch('/api/weekly?list=1');
        if (res.status === 404 && /^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
          res = await fetch('/data/weekly/index.json', { cache: 'no-store' });
        }
        if (!res.ok) throw new Error('list_http_' + res.status);
        const payload = await res.json();
        const weeks = Array.isArray(payload) ? payload : (payload.weeks || []);
        if (!weeks.length) { sel.innerHTML = '<option>—</option>'; return; }
        sel.innerHTML = weeks.map((w) =>
          `<option value="${esc(w.week)}" ${w.week === currentWeek ? 'selected' : ''}>${esc(w.week)} · ${esc(w.title || '')}</option>`).join('');
        sel.addEventListener('change', () => {
          window.location.search = `?week=${encodeURIComponent(sel.value)}`;
        });
      } catch {
        sel.innerHTML = '<option>—</option>';
      }
    }

    async function loadPlaybookIndex() {
      try {
        let res = await fetch('/api/playbook?sources=1');
        if (res.status === 404 && /^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
          res = await fetch('/data/playbook/source-index.json', { cache: 'no-store' });
        }
        if (!res.ok) return new Map();
        const payload = await res.json();
        return new Map(Object.values(payload || {})
          .filter((card) => card && card.source_url)
          .map((card) => [card.source_url, card]));
      } catch {
        return new Map();
      }
    }

    async function run() {
      const week = weekFromLocation();
      const url = week ? `/api/weekly?week=${encodeURIComponent(week)}` : '/api/weekly';
      try {
        let res = await fetch(url);
        if (res.status === 404 && /^(127\.0\.0\.1|localhost)$/.test(location.hostname)) {
          res = await fetch(
            week ? `/data/weekly/${encodeURIComponent(week)}.json` : '/data/weekly/latest.json',
            { cache: 'no-store' }
          );
        }
        if (res.status === 404) {
          document.getElementById('meta').textContent = 'No recap yet';
          document.getElementById('recap').innerHTML =
            '<div class="state">No weekly recap has been published yet. Check back soon.</div>';
          return;
        }
        if (!res.ok) throw new Error('weekly_http_' + res.status);
        const [recap, sourceCards] = await Promise.all([res.json(), loadPlaybookIndex()]);
        playbookByUrl = sourceCards;
        renderRecap(recap);
        loadArchive(recap.week);
      } catch (err) {
        console.error(err);
        document.getElementById('meta').textContent = 'Recap unavailable';
        document.getElementById('recap').innerHTML =
          '<div class="state">Could not load the weekly recap right now. Please refresh in a moment.</div>';
      }
    }

    initThemeToggle();
    run();
  </script>

  <!-- Bubble Buddy mascot: decorative WebGL character, lazy-loaded on idle,
       skipped under prefers-reduced-motion. Never affects initial load. -->
  <script type="module">
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const go = () => import('/mascot/mascot.js').catch(() => {});
      'requestIdleCallback' in window ? requestIdleCallback(go, { timeout: 5000 }) : setTimeout(go, 2500);
    }
  </script>
  <!-- "New updates" nav dots — flag unread updates in the daily, weekly,
       storylines and knowledge-map sections. Daily and weekly are time-aware
       (a stale recap never reads as "fresh" even if you haven't opened it);
       storylines and the map rely on read history alone. Signals come from
       /api/updates; "seen" markers live in localStorage. See
       docs/product-specs/nav-update-indicators.md. -->
  <script>
    (function () {
      var SEEN = {
        daily: 'ai_feed_seen_daily_v1',
        weekly: 'ai_feed_seen_weekly_v1',
        storylines: 'ai_feed_seen_storylines_v1',
        map: 'ai_feed_seen_map_v1'
      };
      var ROUTE = { '/daily': 'daily', '/weekly': 'weekly', '/storylines': 'storylines', '/map': 'map' };
      // Daily/weekly age-out: a stale recap is not "fresh" even when unread.
      var DAILY_FRESH_MAX_AGE = 1;   // covers today or yesterday
      var WEEKLY_FRESH_MAX_AGE = 8;  // most recent completed week (+1 day grace)

      function getItem(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function setItem(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      function ms(s) { var t = s ? Date.parse(s) : NaN; return isFinite(t) ? t : NaN; }

      function currentSection() {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (p === '/daily' || p.indexOf('/daily/') === 0) return 'daily';
        if (p === '/weekly' || p.indexOf('/weekly/') === 0) return 'weekly';
        if (p === '/storylines' || p.indexOf('/storyline/') === 0) return 'storylines';
        if (p === '/map' || p.indexOf('/topic/') === 0) return 'map';
        return null;
      }

      // Whole-day difference (now - dateStr), UTC, in days.
      function dayAge(nowIso, dateStr) {
        if (!dateStr) return Infinity;
        var now = new Date(nowIso);
        var d = new Date(dateStr.length === 10 ? dateStr + 'T00:00:00Z' : dateStr);
        if (isNaN(now.getTime()) || isNaN(d.getTime())) return Infinity;
        var a = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
        var b = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
        return Math.round((a - b) / 86400000);
      }

      // Value compared against the "seen" marker for each section.
      function signalOf(u, section) {
        if (section === 'daily') return u.daily && u.daily.generated_at;
        if (section === 'weekly') return u.weekly && u.weekly.generated_at;
        if (section === 'storylines') return u.storylines && u.storylines.last_updated;
        if (section === 'map') return u.map && u.map.updated;
        return null;
      }

      function isUnread(section, signal) {
        var seen = getItem(SEEN[section]);
        if (!seen) return true;
        var a = ms(signal), b = ms(seen);
        if (isFinite(a) && isFinite(b)) return a > b;
        return String(signal) > String(seen); // date-only strings sort lexically
      }

      function isFresh(section, u) {
        if (section === 'daily') return dayAge(u.now, u.daily && u.daily.date) <= DAILY_FRESH_MAX_AGE;
        if (section === 'weekly') return dayAge(u.now, u.weekly && u.weekly.end) <= WEEKLY_FRESH_MAX_AGE;
        return true; // storylines + map: read history only, no time gate
      }

      function injectStyle() {
        if (document.getElementById('nav-update-style')) return;
        var s = document.createElement('style');
        s.id = 'nav-update-style';
        s.textContent = '.nav-update-dot{display:inline-block;margin-left:.4rem;padding:.03rem .34rem;font-size:.62rem;font-weight:700;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;color:var(--accent,#2563eb);background:color-mix(in srgb,var(--accent,#2563eb) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent,#2563eb) 38%,transparent);border-radius:999px;vertical-align:middle;animation:navUpdateIn .35s ease-out both}@keyframes navUpdateIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.nav-update-dot{animation:none}}.nav-update-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}';
        (document.head || document.documentElement).appendChild(s);
      }

      function decorate(section) {
        var links = document.querySelectorAll('.quicknav a[href], menu a[href]');
        for (var i = 0; i < links.length; i++) {
          var a = links[i];
          var pathOnly = (a.getAttribute('href') || '').split('#')[0].split('?')[0].replace(/\/+$/, '');
          if (ROUTE[pathOnly] !== section || a.querySelector('.nav-update-dot')) continue;
          var dot = document.createElement('span');
          dot.className = 'nav-update-dot';
          dot.textContent = 'New';
          dot.setAttribute('aria-hidden', 'true');
          a.appendChild(dot);
          var sr = document.createElement('span');
          sr.className = 'nav-update-sr';
          sr.textContent = ' (new updates)';
          a.appendChild(sr);
        }
      }

      function run() {
        fetch('/api/updates', { headers: { accept: 'application/json' } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (u) {
            if (!u) return;
            injectStyle();
            Object.keys(ROUTE).forEach(function (route) {
              var section = ROUTE[route];
              var signal = signalOf(u, section);
              if (signal && isUnread(section, signal) && isFresh(section, u)) decorate(section);
            });
            var cur = currentSection();
            if (cur) {
              var sig = signalOf(u, cur);
              if (sig) setItem(SEEN[cur], sig);
            }
          })
          .catch(function () {});
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
