<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LLM Digest">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#3a23a8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e6f0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd874"/>
      <stop offset="1" stop-color="#f0a51e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>

  <!-- distilled stack: layers narrow as they rise, gold = today. drawn top -> bottom -->
  <rect x="204" y="131" width="104" height="58" rx="18" fill="#cf8a18"/>
  <rect x="204" y="119" width="104" height="58" rx="18" fill="url(#gold)"/>

  <rect x="172" y="203" width="168" height="58" rx="18" fill="#b7bed3"/>
  <rect x="172" y="191" width="168" height="58" rx="18" fill="url(#slab)"/>

  <rect x="139" y="275" width="234" height="58" rx="18" fill="#b7bed3"/>
  <rect x="139" y="263" width="234" height="58" rx="18" fill="url(#slab)"/>

  <rect x="106" y="347" width="300" height="58" rx="18" fill="#b7bed3"/>
  <rect x="106" y="335" width="300" height="58" rx="18" fill="url(#slab)"/>
</svg>
