<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Digest — AI news feed for platform engineers</title>
  <meta name="description" content="A low-hype AI news feed for platform engineers: model releases, research, and tooling — ranked for what changed and why it matters." />
  <link rel="canonical" href="https://www.llm-digest.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LLM Digest" />
  <meta property="og:title" content="LLM Digest — AI news feed for platform engineers" />
  <meta property="og:description" content="A low-hype AI news feed for platform engineers: model releases, research, and tooling — ranked for what changed and why it matters." />
  <meta property="og:url" content="https://www.llm-digest.com/" />
  <meta name="twitter:card" content="summary" />
  <link rel="alternate" type="application/rss+xml" title="LLM Digest feed" href="/rss.xml" />
  <link rel="stylesheet" href="https://oat.ink/oat.min.css" />
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://oat.ink/oat.min.js" defer></script>
  <style>
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    :root,
    html[data-theme="light"] {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --card: #ffffff;
      --border: #e5e5e5;
      --accent: #2563eb;
      --muted: #6b7280;
    }
    html[data-theme="dark"] {
      --bg: #15171c;
      --fg: #e8e8ea;
      --card: #1e2128;
      --border: #34373f;
      --accent: #5b8def;
      --muted: #9aa0aa;
    }
    body {
      margin: 0;
      line-height: 1.5;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--fg);
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    button, input, select, textarea {
      color: inherit;
      background: var(--card);
      border-color: var(--border);
    }
    a {
      color: var(--accent);
    }
    main {
      width: 100%;
      max-width: 920px;
      margin: 1rem auto;
      padding: 0 0.9rem 2rem;
      overflow-x: clip;
    }
    header {
      margin-bottom: 1rem;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .topbar-actions button,
    .topbar-actions select {
      font-size: 0.92rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      cursor: pointer;
    }
    #meta {
      margin: 0.35rem 0 0;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .quicknav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1rem;
      margin-top: 0.5rem;
      font-size: 0.88rem;
    }
    .quicknav a {
      text-decoration: none;
      color: var(--accent);
      white-space: nowrap;
    }
    .quicknav a:hover {
      text-decoration: underline;
    }
    .sections {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      gap: 0.4rem;
      margin-top: 0.65rem;
      border-bottom: 1px solid var(--border, #e5e5e5);
      padding-bottom: 0.5rem;
    }
    .sections::-webkit-scrollbar {
      display: none;
    }
    .sections button {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sitefooter {
      margin-top: 2rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
      font-size: 0.86rem;
      color: var(--muted);
      text-align: center;
    }
    .sections button {
      font-size: 0.92rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: inherit;
    }
    .sections button:hover {
      border-color: var(--accent, #2563eb);
    }
    .sections button.active {
      background: var(--accent, #2563eb);
      border-color: var(--accent, #2563eb);
      color: #fff;
      font-weight: 600;
    }
    .searchbar {
      width: 100%;
      margin-top: 0.8rem;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: inherit;
      font-size: 16px;
    }
    .selected-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .selected-labels .badge {
      cursor: pointer;
    }
    #list {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    article {
      padding: 1rem;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      background: var(--card, #fff);
    }
    article.big-story {
      border-left: 4px solid color-mix(in srgb, var(--accent) 75%, transparent);
    }
    article.shared-highlight {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .thumb {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border, #e5e5e5);
      flex-shrink: 0;
    }
    .card-main {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .card-text {
      flex: 1;
      min-width: 0;
    }
    article h3 {
      margin: 0 0 0.3rem;
      font-size: 1.08rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    article h3 a {
      color: inherit;
      text-decoration: none;
      font-weight: 650;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    article h3 a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .card-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
      min-width: 0;
    }
    .card-top .src {
      font-size: 0.84rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .card-top .badge {
      font-size: 0.74rem;
      padding: 0.08rem 0.45rem;
    }
    .badge {
      display: inline-block;
      max-width: 100%;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 999px;
      padding: 0.18rem 0.55rem;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, var(--card));
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .badge-fresh {
      border-color: #16a34a;
      color: #166534;
      background: #ecfdf3;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-fresh {
      border-color: #22c55e;
      color: #bbf7d0;
      background: #14532d;
    }
    .badge-trend {
      border-color: #dc2626;
      color: #991b1b;
      background: #fef2f2;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-trend {
      border-color: #ef4444;
      color: #fecaca;
      background: #7f1d1d;
    }
    .badge-new {
      border-color: #d97706;
      color: #92400e;
      background: #fef3c7;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-new {
      border-color: #f59e0b;
      color: #fde68a;
      background: #78350f;
    }
    .save-btn,
    .share-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1;
      padding: 0 0.2rem;
      color: var(--muted);
    }
    .save-btn {
      margin-left: auto;
    }
    .save-btn:hover,
    .save-btn[aria-pressed="true"] {
      color: #f59e0b;
    }
    .share-btn {
      font-size: 1rem;
    }
    .share-btn:hover {
      color: var(--accent);
    }
    .fb-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }
    .fb-label {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .fb-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      padding: 0.18rem 0.6rem;
      cursor: pointer;
    }
    .fb-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .fb-btn[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, var(--card));
      font-weight: 600;
    }
    .why {
      margin: 0.35rem 0 0;
      font-size: 1rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
      word-break: break-word;
      /* Publisher summaries can run 5-6 lines on mobile; clamp so the first
         screen fits ~3 stories instead of 1. The headline link has the rest. */
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .matters {
      margin: 0.45rem 0 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
      border-left: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      padding-left: 0.55rem;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .also {
      margin: 0.35rem 0 0;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .also a {
      color: inherit;
      text-decoration: underline dotted;
    }
    .when {
      align-self: center;
      color: var(--muted);
      font-size: 0.86rem;
      white-space: nowrap;
    }
    .saved-tools {
      display: flex;
      justify-content: flex-end;
    }
    .saved-tools button {
      font-size: 0.86rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      cursor: pointer;
    }
    .saved-tools button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .catchup {
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
      background: color-mix(in srgb, var(--accent) 8%, var(--card));
      border-radius: 10px;
      padding: 0.8rem 1rem;
    }
    .catchup-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .catchup-sub {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .catchup-dismiss {
      margin-left: auto;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 0.2rem;
    }
    .catchup ul {
      margin: 0.5rem 0 0;
      padding-left: 1.1rem;
    }
    .catchup li {
      margin-top: 0.3rem;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }
    .catchup li a {
      font-weight: 600;
      text-decoration: none;
    }
    .catchup li a:hover {
      text-decoration: underline;
    }
    .catchup .catchup-summary {
      color: var(--muted);
    }
    .catchup li .badge {
      font-size: 0.72rem;
      padding: 0.05rem 0.4rem;
      vertical-align: 0.08em;
    }
    .catchup-more {
      margin: 0.55rem 0 0;
      font-size: 0.88rem;
    }
    .catchup-more a {
      text-decoration: none;
    }
    .catchup-more a:hover {
      text-decoration: underline;
    }
    .subscribe-wrap {
      position: relative;
    }
    /* display:flex would override the UA's [hidden]{display:none} — keep the
       closed state authoritative or the empty popover renders permanently. */
    .subscribe-menu[hidden] {
      display: none;
    }
    .subscribe-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 240px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      text-align: left;
    }
    .subscribe-menu a {
      display: block;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      font-size: 0.92rem;
      white-space: nowrap;
    }
    .subscribe-menu a:hover {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .subscribe-menu .sub-desc {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .onboard {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
    }
    .onboard-head {
      font-size: 0.92rem;
    }
    .onboard-head span {
      color: var(--muted);
    }
    .onboard-chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .onboard-chips button,
    .onboard-chips a[role="button"] {
      font-size: 0.88rem;
      padding: 0.28rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: inherit;
      text-decoration: none;
    }
    .onboard-chips a[data-subscribe-channel] {
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--accent);
    }
    .onboard-chips button[data-subscribe-nudge-skip] {
      border-color: transparent;
      color: var(--muted);
    }
    .onboard-chips button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .onboard-chips button[data-onboard-save]:not([disabled]) {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .onboard-chips button[data-onboard-save][disabled] {
      opacity: 0.5;
      cursor: default;
    }
    .onboard-chips button[data-onboard-skip] {
      border-color: transparent;
      color: var(--muted);
    }
    .state {
      border: 1px dashed var(--border, #d9d9d9);
      border-radius: 10px;
      padding: 1rem;
      opacity: 0.85;
    }
    input, button, a[role="button"] {
      font-size: 16px;
    }
    @media (max-width: 640px) {
      main {
        margin-top: 0.75rem;
      }
      .topbar h1 {
        font-size: 1.35rem;
      }
      .thumb {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <h1>📰 AI Feed</h1>
        <div class="topbar-actions">
          <div class="subscribe-wrap">
            <button id="subscribeToggle" type="button" aria-label="Subscribe to the feed" aria-haspopup="true" aria-expanded="false">🔔</button>
            <div id="subscribeMenu" class="subscribe-menu" hidden></div>
          </div>
          <button id="searchToggle" type="button" aria-label="Search the feed" aria-expanded="false">🔍</button>
          <select id="rangeSelect" aria-label="Time range">
            <option value="1">Today</option>
            <option value="3">Last 3d</option>
            <option value="7" selected>Last 7d</option>
            <option value="30">Last 30d</option>
            <option value="all">All</option>
          </select>
          <button id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
        </div>
      </div>
      <p id="meta">Loading...</p>
      <nav class="quicknav" aria-label="More pages">
        <a href="/daily">📰 Daily recap</a>
        <a href="/weekly">🗓️ Weekly recap</a>
        <a href="/voices">🗣️ Voices</a>
      </nav>

      <nav class="sections" id="sections" aria-label="Sections">
        <button type="button" data-section="" class="active">All</button>
        <button type="button" data-section="platform">Platform</button>
        <button type="button" data-section="release">Releases</button>
        <button type="button" data-section="research">Research</button>
        <button type="button" data-section="paper">Papers</button>
        <button type="button" data-section="news">News</button>
        <button type="button" id="savedTab">⭐ Saved</button>
      </nav>

      <input type="search" id="searchBox" class="searchbar" placeholder="Search the feed…" aria-label="Search the feed" hidden />
      <div id="selectedLabels" class="selected-labels"></div>
    </header>

    <section id="list" aria-live="polite"></section>

    <footer class="sitefooter">
      <a href="/rss.xml" data-subscribe-channel="rss" data-subscribe-placement="footer">RSS feed</a> · <a href="/api/feed">JSON feed</a>
    </footer>
  </main>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const btn = document.getElementById('themeToggle');
      if (btn) {
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      }
    }

    function initThemeToggle() {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current);
      btn.addEventListener('click', () => {
        const now = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(now === 'dark' ? 'light' : 'dark');
      });
    }

    // Dates are forced to en-US: the UI copy is English, and the device
    // locale (e.g. ko-KR "6월 10일") next to English chrome reads as a bug.
    function fmtCompactDate(v) {
      if (!v) return '';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '';
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return d.toLocaleDateString('en-US', sameYear
        ? { month: 'short', day: 'numeric' }
        : { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Card timestamps: relative within a week ("2h ago", "yesterday") —
    // easier to scan than absolute dates — then fall back to "Jun 10".
    function fmtCardDate(v) {
      const t = Date.parse(v || '');
      if (!Number.isFinite(t)) return '';
      const mins = Math.round((Date.now() - t) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.round(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.round(hours / 24);
      if (days === 1) return 'yesterday';
      if (days < 7) return `${days}d ago`;
      return fmtCompactDate(v);
    }

    function fmtRelTime(iso) {
      const t = Date.parse(iso || '');
      if (!Number.isFinite(t)) return '';
      const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.round(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.round(hours / 24);
      return `${days}d ago`;
    }

    function toIsoDateStart(dateStr) {
      if (!dateStr) return null;
      return `${dateStr}T00:00:00`;
    }

    function toIsoDateEnd(dateStr) {
      if (!dateStr) return null;
      return `${dateStr}T23:59:59`;
    }

    function toDateInput(d) {
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    // Search stays collapsed behind the 🔍 toggle until needed, so the first
    // screen shows stories instead of an empty input.
    function setSearchVisible(visible, { focus = false } = {}) {
      const box = document.getElementById('searchBox');
      const toggle = document.getElementById('searchToggle');
      if (!box) return;
      box.hidden = !visible;
      toggle?.setAttribute('aria-expanded', visible ? 'true' : 'false');
      if (visible && focus) box.focus();
    }

    let presetDaysState = '7';
    // Explicit ?from/?to dates from a shared URL (no UI for these); presets clear it.
    let customRangeState = { from: '', to: '' };
    let limitState = '200';
    let searchQueryState = '';

    function setDateRangeDays(days) {
      presetDaysState = String(days);
      customRangeState = { from: '', to: '' };
      syncRangeSelect();
    }

    function syncRangeSelect() {
      const sel = document.getElementById('rangeSelect');
      if (!sel) return;
      const v = ['1', '3', '7', '30', 'all'].includes(presetDaysState) ? presetDaysState : '7';
      sel.value = v;
    }

    // 'feed' renders the API feed; 'saved' renders locally saved items.
    let viewState = 'feed';

    // Items from the last feed render, keyed by itemKey, so saves can snapshot
    // the full item even after the DOM only holds rendered HTML.
    let itemsByKey = new Map();

    const VISIT_LAST_KEY = 'ai_feed_last_visit_at';
    const VISIT_SESSION_KEY = 'ai_feed_visit_session_at';
    const VISIT_SESSION_GAP_MS = 30 * 60 * 1000;

    // Returns when the previous visit session started (0 = first visit).
    // Reloads within VISIT_SESSION_GAP_MS keep the same baseline so "New"
    // markers don't vanish on refresh.
    function initVisitTracking() {
      try {
        const now = Date.now();
        const sessionStart = Number(localStorage.getItem(VISIT_SESSION_KEY) || 0);
        if (sessionStart && now - sessionStart <= VISIT_SESSION_GAP_MS) {
          return Number(localStorage.getItem(VISIT_LAST_KEY) || 0);
        }
        if (sessionStart) localStorage.setItem(VISIT_LAST_KEY, String(sessionStart));
        localStorage.setItem(VISIT_SESSION_KEY, String(now));
        return sessionStart || 0;
      } catch {
        return 0;
      }
    }

    const visitLastMs = initVisitTracking();

    function isNewSinceLastVisit(it) {
      if (!(visitLastMs > 0)) return false;
      const t = Date.parse(it.first_seen || it.collected_at || it.published || '');
      return Number.isFinite(t) && t > visitLastMs;
    }

    const SAVED_ITEMS_KEY = 'ai_feed_saved_items_v1';

    function loadSavedItems() {
      try {
        const v = JSON.parse(localStorage.getItem(SAVED_ITEMS_KEY) || '{}');
        return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
      } catch {
        return {};
      }
    }

    let savedItemsState = loadSavedItems();

    function persistSavedItems() {
      try {
        localStorage.setItem(SAVED_ITEMS_KEY, JSON.stringify(savedItemsState));
      } catch {}
    }

    function itemKey(it) {
      return String(it.id || `${it.url || ''}::${it.title || ''}`);
    }

    function isItemSaved(key) {
      return Object.prototype.hasOwnProperty.call(savedItemsState, key);
    }

    function snapshotForSave(it) {
      return {
        id: it.id || null,
        title: it.title || '',
        url: it.url || '',
        source: it.source || '',
        type: it.type || 'news',
        summary_1line: it.summary_1line || '',
        why_it_matters: it.why_it_matters || '',
        llm_label_source: it.llm_label_source || '',
        image_url: it.image_url || '',
        published: it.published || it.first_seen || it.last_seen || null,
        saved_at: new Date().toISOString(),
      };
    }

    function toggleSaved(key) {
      if (isItemSaved(key)) {
        delete savedItemsState[key];
        persistSavedItems();
        posthogCapture('item_save', { item_id: key, action: 'unsave' });
        return false;
      }
      const it = itemsByKey.get(key);
      if (!it) return false;
      savedItemsState[key] = snapshotForSave(it);
      persistSavedItems();
      posthogCapture('item_save', { item_id: key, action: 'save', source: it.source || null });
      return true;
    }

    // One-tap reader feedback (spec: docs/product-specs/feedback-loop.md).
    // Choice per item is kept locally so the UI remembers it; the signal is
    // sent to PostHog as `item_feedback` and synced into
    // data/feedback/events.jsonl by pipeline/feedback.py.
    const FEEDBACK_KEY = 'ai_feed_feedback_v1';
    const FEEDBACK_PROMPT = 'Was this useful?';
    const FEEDBACK_THANKS = 'Thanks — your feedback tunes tomorrow’s ranking.';
    const FEEDBACK_SIGNALS = [
      { signal: 'useful', label: '👍 Useful' },
      { signal: 'irrelevant', label: '👎 Not relevant' },
      { signal: 'hype', label: '🫧 Hype' },
    ];

    function loadFeedbackState() {
      try {
        const v = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '{}');
        return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
      } catch {
        return {};
      }
    }

    let feedbackState = loadFeedbackState();

    function persistFeedbackState() {
      try {
        localStorage.setItem(FEEDBACK_KEY, JSON.stringify(feedbackState));
      } catch {}
    }

    function itemForKey(key) {
      return itemsByKey.get(key) || savedItemsState[key] || null;
    }

    // Tap = set signal; tap the same signal again = retract. Returns the
    // active signal after the toggle (null when retracted).
    function toggleFeedback(key, signal, { rank = null, runId = null } = {}) {
      const prev = feedbackState[key]?.signal || null;
      const action = prev === signal ? 'unset' : 'set';
      if (action === 'unset') delete feedbackState[key];
      else feedbackState[key] = { signal, ts: new Date().toISOString() };
      persistFeedbackState();

      const it = itemForKey(key) || {};
      posthogCapture('item_feedback', {
        item_id: key,
        signal,
        action,
        prev_signal: prev,
        url: it.url || null,
        source: it.source || null,
        title: it.title || null,
        rank_position: rank,
        run_id: runId,
      });
      return action === 'set' ? signal : null;
    }

    // Share our /s permalink, not the source URL, so shares land readers on
    // this feed with the story highlighted. The endpoint (api/share.js)
    // serves item-specific Open Graph tags to unfurlers, then redirects
    // humans to /?item=<url>. Native share sheet when available, clipboard
    // fallback otherwise.
    function sharePermalink(it) {
      const href = safeUrl(it.url || '');
      if (href === '#') return '';
      return `${window.location.origin}/s?u=${encodeURIComponent(href)}`;
    }

    async function shareItem(btn) {
      const key = btn.dataset.shareId || '';
      const it = itemForKey(key);
      if (!it) return;
      const url = sharePermalink(it);
      if (!url) return;
      posthogCapture('item_share', {
        item_id: key,
        source: it.source || null,
        url: it.url || null,
        share_url: url,
        method: navigator.share ? 'web_share' : 'clipboard',
      });
      const text = `${it.title || ''} — via llm-digest.com`;
      if (navigator.share) {
        try {
          await navigator.share({ title: it.title || '', text, url });
        } catch {}
        return;
      }
      try {
        await navigator.clipboard.writeText(`${text}\n${url}`);
        const orig = btn.textContent;
        btn.textContent = '✓';
        btn.title = 'Link copied';
        setTimeout(() => {
          btn.textContent = orig;
          btn.title = 'Share';
        }, 1200);
      } catch {}
    }

    // Share-landing deep link (?item=<url>, set by the /s permalink redirect):
    // scroll to the shared story and flash it. If it isn't in the current
    // window (default is 7 days), widen once to 30 days before giving up.
    let pendingSharedItemUrl = '';
    let landingUtmSource = '';
    let sharedItemRetried = false;

    function normShareUrl(v) {
      const s = String(v || '').trim();
      return s.endsWith('/') && s.length > 1 ? s.slice(0, -1) : s;
    }

    function maybeHighlightSharedItem() {
      if (!pendingSharedItemUrl || viewState !== 'feed') return;
      const target = normShareUrl(pendingSharedItemUrl);
      const it = feedCache.items.find((x) => normShareUrl(x.url) === target);

      if (!it) {
        const isDefaultWindow = !customRangeState.from && !customRangeState.to && presetDaysState === '7';
        if (!sharedItemRetried && isDefaultWindow) {
          sharedItemRetried = true;
          setDateRangeDays(30);
          refreshFeed();
          return;
        }
        pendingSharedItemUrl = '';
        posthogCapture('share_landing', { found: false, url: target, utm_source: landingUtmSource || null });
        document.getElementById('list')?.insertAdjacentHTML(
          'afterbegin',
          '<div class="state">The shared story has aged out of the live feed — here&#39;s what&#39;s new instead.</div>'
        );
        return;
      }

      pendingSharedItemUrl = '';
      posthogCapture('share_landing', {
        found: true,
        url: target,
        source: it.source || null,
        utm_source: landingUtmSource || null,
      });
      const btn = document.querySelector(`button[data-share-id="${CSS.escape(itemKey(it))}"]`);
      const card = btn?.closest('article');
      if (card) {
        card.classList.add('shared-highlight');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function updateSavedTab() {
      const btn = document.getElementById('savedTab');
      if (!btn) return;
      const n = Object.keys(savedItemsState).length;
      btn.textContent = n > 0 ? `⭐ Saved (${n})` : '⭐ Saved';
      btn.classList.toggle('active', viewState === 'saved');
    }

    function readFiltersFromUrl() {
      const p = new URLSearchParams(window.location.search);

      // Share-landing deep link (?item=<url> via the /s permalink). Captured
      // here because syncUrlFromFilters() rewrites the URL right after boot.
      pendingSharedItemUrl = p.get('item') || '';
      landingUtmSource = p.get('utm_source') || '';

      viewState = p.get('view') === 'saved' ? 'saved' : 'feed';
      limitState = p.get('limit') || '200';

      searchQueryState = p.get('q') || '';
      const searchEl = document.getElementById('searchBox');
      if (searchEl) searchEl.value = searchQueryState;
      if (searchQueryState) setSearchVisible(true);

      const from = p.get('from');
      const to = p.get('to');
      if (from || to) {
        customRangeState = { from: from || '', to: to || '' };
        presetDaysState = 'all'; // explicit range wins; disable preset fallback
        syncRangeSelect();
      } else {
        const days = p.get('days');
        const valid = days === 'all' || (Number(days) > 0);
        setDateRangeDays(valid ? days : 7);
      }

      const labels = p.getAll('label').flatMap((v) => String(v).split(','));
      // No labels in the URL → fall back to the reader's pinned defaults —
      // unless this is a share landing, where pinned topics could hide the
      // very story the reader came for.
      const fallbackLabels = pendingSharedItemUrl ? [] : pinnedLabelsState;
      setSelectedLabels(labels.some((l) => normalizeLabel(l)) ? labels : fallbackLabels);
    }

    function syncUrlFromFilters() {
      const p = new URLSearchParams();
      if (viewState === 'saved') p.set('view', 'saved');
      if (searchQueryState.trim()) p.set('q', searchQueryState.trim());
      for (const l of getSelectedLabels()) p.append('label', l);

      if (customRangeState.from || customRangeState.to) {
        if (customRangeState.from) p.set('from', customRangeState.from);
        if (customRangeState.to) p.set('to', customRangeState.to);
      } else if (presetDaysState !== '7') {
        p.set('days', presetDaysState);
      }

      if (limitState !== '200') p.set('limit', limitState);

      const qs = p.toString();
      history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
    }

    let selectedLabelsState = new Set();

    // Pinned "my topics": label selection saved as the reader's default,
    // auto-applied on visits that don't specify labels in the URL.
    const PINNED_LABELS_KEY = 'ai_feed_pinned_labels_v1';

    function loadPinnedLabels() {
      try {
        const v = JSON.parse(localStorage.getItem(PINNED_LABELS_KEY) || '[]');
        return Array.isArray(v) ? v.map((l) => normalizeLabel(l)).filter(Boolean) : [];
      } catch {
        return [];
      }
    }

    let pinnedLabelsState = loadPinnedLabels();

    function persistPinnedLabels() {
      try {
        localStorage.setItem(PINNED_LABELS_KEY, JSON.stringify(pinnedLabelsState));
      } catch {}
    }

    function sameLabels(a, b) {
      return a.length === b.length && [...a].sort().join(',') === [...b].sort().join(',');
    }

    // Section tabs are a quick-select over the existing label filter.
    // Each maps to a single llm_category/type label value.
    const SECTION_VALUES = new Set(['platform', 'release', 'research', 'paper', 'news']);

    function activeSection() {
      const labels = getSelectedLabels();
      if (labels.length === 0) return '';
      if (labels.length === 1 && SECTION_VALUES.has(labels[0])) return labels[0];
      return null; // advanced/multi-label selection: no single section is active
    }

    function syncSectionTabs() {
      const current = viewState === 'saved' ? null : activeSection();
      const buttons = document.querySelectorAll('#sections button[data-section]');
      buttons.forEach((b) => {
        const matches = current !== null && (b.dataset.section || '') === current;
        b.classList.toggle('active', matches);
      });
      updateSavedTab();
    }

    function normalizeLabel(v) {
      return String(v || '')
        .trim()
        .toLowerCase()
        .replace(/^#+/, '')
        .replace(/\s+/g, '_');
    }

    function getSelectedLabels() {
      return [...selectedLabelsState];
    }

    function setSelectedLabels(values) {
      selectedLabelsState = new Set(
        (Array.isArray(values) ? values : [])
          .map((v) => normalizeLabel(v))
          .filter(Boolean)
      );
      renderSelectedLabelsChips();
      syncSectionTabs();
    }

    function renderSelectedLabelsChips() {
      const box = document.getElementById('selectedLabels');
      if (!box) return;
      const labels = getSelectedLabels();
      const chips = labels.map((l) => `<button type="button" class="badge" data-chip-remove="${esc(l)}">#${esc(l)} ×</button>`);

      if (labels.length) {
        const isPinned = sameLabels(labels, pinnedLabelsState);
        chips.push(`<button type="button" class="badge" data-pin-toggle="1" aria-pressed="${isPinned ? 'true' : 'false'}" title="${isPinned ? 'Unpin: stop applying these labels by default' : 'Pin: apply these labels by default on every visit'}">${isPinned ? '📌 Pinned ✓' : '📌 Pin as default'}</button>`);
      } else if (pinnedLabelsState.length) {
        chips.push(`<button type="button" class="badge" data-pin-apply="1" title="Apply your pinned labels">📌 My topics: ${pinnedLabelsState.map((l) => `#${esc(l)}`).join(' ')}</button>`);
      }

      box.innerHTML = chips.join('');
    }

    function buildFeedUrl() {
      let from = toIsoDateStart(customRangeState.from);
      let to = toIsoDateEnd(customRangeState.to);
      if (!from && !to && presetDaysState !== 'all') {
        const n = Math.max(1, Number(presetDaysState || 7));
        const now = new Date();
        const fromD = new Date(now.getTime() - n * 24 * 60 * 60 * 1000);
        from = toIsoDateStart(toDateInput(fromD));
        to = toIsoDateEnd(toDateInput(now));
      }

      const u = new URL('/api/feed', window.location.origin);
      if (from) u.searchParams.set('from', from);
      if (to) u.searchParams.set('to', to);
      u.searchParams.set('limit', limitState);
      for (const l of getSelectedLabels()) u.searchParams.append('label', l);
      return u.pathname + u.search;
    }

    function esc(v) {
      return String(v ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function safeUrl(v) {
      try {
        const u = new URL(String(v || ''), window.location.origin);
        if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
      } catch {}
      return '#';
    }

    function randomId(prefix = 'id') {
      if (window.crypto?.randomUUID) return `${prefix}_${window.crypto.randomUUID()}`;
      return `${prefix}_${Math.random().toString(36).slice(2)}_${Date.now()}`;
    }

    // Daily digest subscription (growth loop): a public Telegram channel URL
    // and optional email signup page from /api/client-config. Channel CTAs
    // render only when configured, so the UI carries no dead "subscribe"
    // affordances on unconfigured deploys. RSS is always available.
    let digestTelegramUrl = '';
    let emailSignupUrl = '';

    function subscribeChannels() {
      const channels = [
        { channel: 'rss', href: '/rss.xml', label: '📡 RSS feed', desc: 'Every story, in your reader' },
      ];
      if (digestTelegramUrl) {
        channels.push({ channel: 'telegram', href: digestTelegramUrl, label: '📬 Telegram daily digest', desc: 'Top stories, once a day', external: true });
      }
      if (emailSignupUrl) {
        channels.push({ channel: 'email', href: emailSignupUrl, label: '✉️ Email digest', desc: 'The recap, in your inbox', external: true });
      }
      return channels;
    }

    function subscribeLinksHtml(placement) {
      return subscribeChannels().map((c) =>
        `<a href="${esc(c.href)}"${c.external ? ' target="_blank" rel="noopener"' : ''} data-subscribe-channel="${esc(c.channel)}" data-subscribe-placement="${esc(placement)}">${c.label}${c.desc ? `<span class="sub-desc">${esc(c.desc)}</span>` : ''}</a>`
      ).join('');
    }

    function setSubscribeMenuOpen(open) {
      const menu = document.getElementById('subscribeMenu');
      const btn = document.getElementById('subscribeToggle');
      if (!menu || !btn) return;
      if (open) menu.innerHTML = subscribeLinksHtml('menu');
      menu.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) posthogCapture('subscribe_menu_open', { channels: subscribeChannels().map((c) => c.channel) });
    }

    function initSubscribeMenu() {
      const btn = document.getElementById('subscribeToggle');
      const menu = document.getElementById('subscribeMenu');
      if (!btn || !menu) return;
      btn.addEventListener('click', () => setSubscribeMenuOpen(menu.hidden));
      document.addEventListener('click', (e) => {
        if (!menu.hidden && !e.target.closest('.subscribe-wrap')) setSubscribeMenuOpen(false);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setSubscribeMenuOpen(false);
      });
    }

    // Reciprocity, stated plainly: when reader clicks/feedback have produced
    // real ranking adjustments (pipeline/auto_tune.py via the feed API's
    // reader_tuning block), say so in the footer with honest counts. Renders
    // nothing while no adjustments exist.
    function renderReaderTuningNote(rt) {
      const foot = document.querySelector('.sitefooter');
      if (!foot || !rt) return;
      const boosted = Array.isArray(rt.boosted) ? rt.boosted : [];
      const down = Array.isArray(rt.downweighted) ? rt.downweighted : [];
      if (!boosted.length && !down.length) return;

      let el = foot.querySelector('[data-reader-tuning]');
      if (!el) {
        el = document.createElement('p');
        el.dataset.readerTuning = '1';
        foot.appendChild(el);
      }
      const updated = rt.updated_at ? `, updated ${fmtCompactDate(rt.updated_at)}` : '';
      el.textContent = `👍 Reader feedback is tuning this feed: ${boosted.length} source${boosted.length === 1 ? '' : 's'} boosted, ${down.length} downweighted (last ${rt.window_days || 30} days${updated}).`;
      const names = (list) => list.slice(0, 5).map((b) => sourceDisplayName(b.source)).join(', ');
      el.title = [
        boosted.length ? `Boosted: ${names(boosted)}` : '',
        down.length ? `Downweighted: ${names(down)}` : '',
      ].filter(Boolean).join(' · ');
    }

    function renderDigestCtas() {
      if (!digestTelegramUrl) return;
      const nav = document.querySelector('.quicknav');
      if (nav && !nav.querySelector('[data-digest-cta="quicknav"]')) {
        const a = document.createElement('a');
        a.href = digestTelegramUrl;
        a.target = '_blank';
        a.rel = 'noopener';
        a.dataset.digestCta = 'quicknav';
        a.textContent = '📬 Daily digest';
        nav.appendChild(a);
      }
      const foot = document.querySelector('.sitefooter');
      if (foot && !foot.querySelector('[data-digest-cta="footer"]')) {
        const a = document.createElement('a');
        a.href = digestTelegramUrl;
        a.target = '_blank';
        a.rel = 'noopener';
        a.dataset.digestCta = 'footer';
        a.textContent = '📬 Daily Telegram digest';
        foot.prepend(a, document.createTextNode(' · '));
      }
    }

    async function initClientConfig() {
      try {
        const res = await fetch('/api/client-config');
        if (!res.ok) return;
        const cfg = await res.json();

        const tg = String(cfg?.digest?.telegram_url || '');
        if (safeUrl(tg) !== '#' && tg) digestTelegramUrl = tg;
        const em = String(cfg?.digest?.email_signup_url || '');
        if (safeUrl(em) !== '#' && em) emailSignupUrl = em;
        if (digestTelegramUrl) {
          renderDigestCtas();
          // The catch-up brief includes a subscribe link; re-render so it
          // picks the URL up if the feed finished loading before the config.
          if (viewState === 'feed' && feedCache.items.length) renderFeedList();
        }

        const ph = cfg?.posthog || {};
        if (!ph.enabled || !ph.project_api_key) return;

        (function(document, posthog){
          if (posthog.__SV) return;
          window.posthog = posthog;
          posthog._i = posthog._i || [];
          posthog.__SV = 1;
          posthog.init = function(apiKey, options, name){
            const target = name ? (posthog[name] = []) : posthog;
            target.people = target.people || [];
            const methods = ['capture','identify','alias','people.set','people.set_once','register','register_once','unregister','reset','isFeatureEnabled'];
            const factory = function(method){
              return function(){
                target.push([method].concat(Array.prototype.slice.call(arguments, 0)));
              };
            };
            for (const m of methods) {
              const parts = m.split('.');
              if (parts.length === 2) {
                target[parts[0]][parts[1]] = factory(m);
              } else {
                target[m] = factory(m);
              }
            }
            posthog._i.push([apiKey, options, name]);
          };
        })(document, window.posthog || []);

        window.posthog.init(ph.project_api_key, {
          api_host: ph.host || 'https://us.i.posthog.com',
          person_profiles: 'identified_only',
          autocapture: false,
          capture_pageview: false,
          capture_pageleave: true,
          persistence: 'localStorage+cookie',
          loaded: (sdk) => {
            const anon = getAnonUserId();
            sdk.identify(anon);
            sdk.capture('page_view', {
              path: window.location.pathname,
              referrer: document.referrer || null,
            });
            window.__posthogEnabled = true;
          },
        });

        if (!document.getElementById('posthog-array-js')) {
          const s = document.createElement('script');
          s.id = 'posthog-array-js';
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = (ph.host || 'https://us.i.posthog.com').replace('.i.posthog.com', '-assets.i.posthog.com') + '/static/array.js';
          s.onerror = () => console.debug('posthog_loader_failed');
          document.head.appendChild(s);
        }
      } catch (e) {
        console.debug('posthog_init_failed', e);
      }
    }

    function posthogCapture(event, properties = {}) {
      if (!window.__posthogEnabled || !window.posthog) return;
      try {
        window.posthog.capture(event, properties);
      } catch (e) {
        console.debug('posthog_capture_failed', e);
      }
    }

    function getAnonUserId() {
      const key = 'ai_feed_anon_user_id';
      let v = localStorage.getItem(key);
      if (!v) {
        v = randomId('anon');
        localStorage.setItem(key, v);
      }
      return v;
    }

    function captureEvents(events) {
      if (!events?.length) return;
      const allImpression = events.every((e) => e.event_type === 'impression');
      if (allImpression) {
        posthogCapture('impression_batch', {
          count: events.length,
          run_id: events[0]?.run_id || null,
        });
      } else {
        for (const ev of events) {
          if (ev.event_type !== 'click') continue;
          posthogCapture('click', {
            item_id: ev.item_id || null,
            source: ev.source || null,
            rank_position: ev.rank_position || null,
            run_id: ev.run_id || null,
            url: ev.url || null,
          });
        }
      }
    }

    // Human display names for source slugs (config/sources.yaml). Raw ids
    // like "infoq_ai_ml" in the byline read as scraper output, not curation.
    const SOURCE_NAMES = {
      arxiv_cs_ai: 'arXiv cs.AI',
      arxiv_cs_lg: 'arXiv cs.LG',
      arxiv_cs_cl: 'arXiv cs.CL',
      paperswithcode_latest: 'Papers with Code',
      openai_blog: 'OpenAI Blog',

      aws_ml_blog: 'AWS ML Blog',
      vllm_releases: 'vLLM Releases',
      triton_releases: 'Triton Releases',
      llamaindex_releases: 'LlamaIndex Releases',
      langgraph_releases: 'LangGraph Releases',
      openai_codex_releases: 'OpenAI Codex Releases',
      claude_code_releases: 'Claude Code Releases',
      claude_agent_sdk_python_releases: 'Claude Agent SDK Releases',
      claude_blog: 'Claude Blog',

      infoq_ai_ml: 'InfoQ AI/ML',

      search_llm_ops_news: 'LLM Ops News',
    };
    const SOURCE_ACRONYMS = new Set(['ai', 'ml', 'llm', 'aws', 'api', 'sdk', 'gpu']);

    function sourceDisplayName(slug) {
      const s = String(slug || '').trim();
      if (!s) return 'unknown';
      if (SOURCE_NAMES[s]) return SOURCE_NAMES[s];
      // Unknown slug: best-effort prettify so new sources degrade gracefully.
      return s.split(/[_\s]+/)
        .filter(Boolean)
        .map((w) => SOURCE_ACRONYMS.has(w.toLowerCase()) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    function cleanText(v) {
      return String(v || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    // Older run snapshots still carry the generic heuristic placeholder;
    // newer pipeline output is either LLM-written or an honest
    // matched-topics line, both worth showing.
    const LEGACY_PLACEHOLDER_WHY = 'Potential relevance to AI platform engineering; verify practical impact.';

    function whyItMattersText(it) {
      const why = cleanText(it.why_it_matters);
      return why !== LEGACY_PLACEHOLDER_WHY ? why : '';
    }

    function cardHtml(it, { rank = null, runId = '' } = {}) {
      const key = itemKey(it);
      const title = esc(it.title || 'Untitled');
      const source = esc(sourceDisplayName(it.source));
      const sourceSlug = esc(it.source || 'unknown');
      const type = esc(it.type || 'news');
      const summaryRaw = cleanText(it.summary_1line);
      const summary = esc(summaryRaw);
      const published = fmtCardDate(it.published || it.first_seen || it.last_seen);
      const whyRaw = whyItMattersText(it);
      const why = (whyRaw && whyRaw !== summaryRaw) ? esc(whyRaw) : '';
      const href = safeUrl(it.url);
      const image = safeUrl(it.image_url || '');
      const alsoCoveredAll = (Array.isArray(it.also_covered) ? it.also_covered : [])
        .filter((e) => e && e.source && safeUrl(e.url) !== '#');
      const alsoCovered = alsoCoveredAll.slice(0, 4);
      // Trending hints: cross-source coverage count, and rank improvement
      // between the two most recent runs that included the item.
      const sourceCount = alsoCoveredAll.length + 1;
      const lastRank = it.rank_at_last_seen == null ? NaN : Number(it.rank_at_last_seen);
      const prevRank = it.rank_prev_seen == null ? NaN : Number(it.rank_prev_seen);
      const isClimbing = Number.isFinite(lastRank) && Number.isFinite(prevRank) && prevRank - lastRank >= 2;
      // Reciprocity: surface when reader clicks/feedback boosted this source's
      // ranking (auto-tune adjustment via the feed API). Threshold keeps the
      // badge meaningful — only clearly boosted sources get it.
      const isReaderBoosted = Number(it.reader_adjustment || 0) >= 0.05;
      const alsoHtml = alsoCovered
        .map((e) => `<a href="${safeUrl(e.url)}" target="_blank" rel="noopener" title="${esc(e.title || '')}">${esc(sourceDisplayName(e.source))}</a>`)
        .join(', ');
      const itemId = esc(key);
      const itemRunId = esc(it.ingest_batch_id || it.run_id || runId || '');
      const isFresh = String(it.tier_hint || '') === 'tier1_fresh';
      const isNew = rank !== null && !isFresh && isNewSinceLastVisit(it);
      const saved = isItemSaved(key);
      const fbActive = feedbackState[key]?.signal || '';
      const fbButtons = FEEDBACK_SIGNALS.map(({ signal, label }) =>
        `<button type="button" class="fb-btn" data-fb-id="${itemId}" data-fb-signal="${signal}" data-rank="${rank ?? ''}" data-run-id="${itemRunId}" aria-pressed="${fbActive === signal ? 'true' : 'false'}">${label}</button>`
      ).join('');

      return `
        <article${sourceCount >= 3 ? ' class="big-story"' : ''}>
          <div class="card-top">
            <span class="src">${source}</span>
            ${published ? `<span class="when">${esc(published)}</span>` : ''}
            ${type !== 'news' ? `<span class="badge">${type}</span>` : ''}
            ${isFresh ? `<span class="badge badge-fresh">⚡ Fresh</span>` : ''}
            ${isNew ? `<span class="badge badge-new">New</span>` : ''}
            ${sourceCount >= 2 ? `<span class="badge badge-trend" title="Covered by ${sourceCount} sources">🔥 ${sourceCount} sources</span>` : ''}
            ${isClimbing ? `<span class="badge badge-trend" title="Moved up from #${prevRank} to #${lastRank} between runs">📈 Climbing</span>` : ''}
            ${isReaderBoosted ? `<span class="badge badge-trend" title="Reader clicks and feedback boosted ${source} in the ranking">👍 Reader-boosted</span>` : ''}
            <button type="button" class="save-btn" data-save-id="${itemId}" aria-pressed="${saved ? 'true' : 'false'}" aria-label="${saved ? 'Remove from saved' : 'Save for later'}" title="${saved ? 'Remove from saved' : 'Save for later'}">${saved ? '★' : '☆'}</button>
            <button type="button" class="share-btn" data-share-id="${itemId}" aria-label="Share this story" title="Share">📤</button>
          </div>
          <div class="card-main">
            <div class="card-text">
              <h3><a href="${href}" target="_blank" rel="noopener" data-track="item-link" data-item-id="${itemId}" data-source="${sourceSlug}" data-rank="${rank ?? ''}" data-run-id="${itemRunId}" data-title="${title}">${title}</a></h3>
              ${summary ? `<p class="why">${summary}</p>` : ''}
            </div>
            ${image !== '#' ? `<img class="thumb" src="${image}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none';this.remove();" />` : ''}
          </div>
          ${why ? `<p class="matters">💡 ${why}</p>` : ''}
          ${alsoHtml ? `<p class="also">Also covered by ${alsoHtml}</p>` : ''}
          <div class="fb-row"><span class="fb-label">${fbActive ? FEEDBACK_THANKS : FEEDBACK_PROMPT}</span>${fbButtons}</div>
        </article>`;
    }

    function matchesQuery(it, q) {
      if (!q) return true;
      const hay = `${it.title || ''} ${it.summary_1line || ''} ${it.why_it_matters || ''} ${it.source || ''}`.toLowerCase();
      return q.split(/\s+/).every((w) => hay.includes(w));
    }

    function renderSavedView() {
      const list = document.getElementById('list');
      const q = searchQueryState.trim().toLowerCase();
      const all = Object.values(savedItemsState)
        .sort((a, b) => String(b.saved_at || '').localeCompare(String(a.saved_at || '')));
      const saved = all.filter((it) => matchesQuery(it, q));
      document.getElementById('meta').textContent = q
        ? `${saved.length} of ${all.length} saved stories`
        : `${all.length} saved ${all.length === 1 ? 'story' : 'stories'}`;
      syncSectionTabs();
      if (!saved.length) {
        list.innerHTML = q
          ? `<div class="state">No saved items match “${esc(q)}”.</div>`
          : `<div class="state">Nothing saved yet — tap ☆ on any story to keep it here.</div>`;
        return;
      }
      const tools = `<div class="saved-tools"><button type="button" data-export-saved="1" title="Download your saved stories as a Markdown file">⬇ Export as Markdown</button></div>`;
      list.innerHTML = tools + saved.map((it) => cardHtml(it)).join('');
    }

    // First-visit onboarding: one-time topic picker that feeds the existing
    // pinned-labels ("my topics") default, which is otherwise hard to discover.
    const ONBOARDING_DONE_KEY = 'ai_feed_onboarding_done_v1';
    const ONBOARD_TOPICS = [
      { value: 'platform', label: 'Platform' },
      { value: 'release', label: 'Releases' },
      { value: 'research', label: 'Research' },
      { value: 'paper', label: 'Papers' },
      { value: 'news', label: 'News' },
    ];
    let onboardSelection = new Set();

    function isOnboardingDone() {
      try {
        return localStorage.getItem(ONBOARDING_DONE_KEY) === '1';
      } catch {
        return true;
      }
    }

    function markOnboardingDone() {
      try {
        localStorage.setItem(ONBOARDING_DONE_KEY, '1');
      } catch {}
    }

    // Kept compact and rendered a few cards into the feed (not above it):
    // a first-time visitor should see stories on the first screen, then get
    // the personalization nudge once the feed has shown its value.
    function onboardingHtml() {
      if (isOnboardingDone() || visitLastMs > 0 || pinnedLabelsState.length) return '';
      const chips = ONBOARD_TOPICS.map(({ value, label }) =>
        `<button type="button" data-onboard-topic="${value}" aria-pressed="${onboardSelection.has(value) ? 'true' : 'false'}">${label}</button>`
      ).join('');
      return `
        <section class="onboard" aria-label="Personalize your feed">
          <div class="onboard-head"><strong>👋 Liking this?</strong> <span>Pick your topics — they'll be your default view here.</span></div>
          <div class="onboard-chips">
            ${chips}
            <button type="button" data-onboard-save="1"${onboardSelection.size ? '' : ' disabled'}>Save topics</button>
            <button type="button" data-onboard-skip="1">Skip</button>
          </div>
        </section>`;
    }

    // Subscribe nudge for returning readers: by the second visit the feed has
    // shown its value, so make the retention ask — once, dismissibly. First
    // visits get the topic onboarding instead (mutually exclusive via
    // visitLastMs), and any subscribe click or "Not now" retires the nudge.
    const SUBSCRIBE_NUDGE_DONE_KEY = 'ai_feed_subscribe_nudge_done_v1';

    function isSubscribeNudgeDone() {
      try {
        return localStorage.getItem(SUBSCRIBE_NUDGE_DONE_KEY) === '1';
      } catch {
        return true;
      }
    }

    function markSubscribeNudgeDone() {
      try {
        localStorage.setItem(SUBSCRIBE_NUDGE_DONE_KEY, '1');
      } catch {}
    }

    function subscribeNudgeHtml() {
      if (isSubscribeNudgeDone() || !(visitLastMs > 0)) return '';
      const links = subscribeChannels().map((c) =>
        `<a role="button" href="${esc(c.href)}"${c.external ? ' target="_blank" rel="noopener"' : ''} data-subscribe-channel="${esc(c.channel)}" data-subscribe-placement="nudge">${c.label}</a>`
      ).join('');
      return `
        <section class="onboard" aria-label="Subscribe to the feed">
          <div class="onboard-head"><strong>🔔 Good to see you back.</strong> <span>Get tomorrow's stories without having to check in.</span></div>
          <div class="onboard-chips">
            ${links}
            <button type="button" data-subscribe-nudge-skip="1">Not now</button>
          </div>
        </section>`;
    }

    // "Catch me up": a dismissable brief of the most important stories that
    // arrived since the reader's previous visit. Importance = cross-source
    // coverage first, then the feed's own ranking.
    const CATCHUP_DISMISS_KEY = 'ai_feed_catchup_dismissed';
    let catchupViewCaptured = false;

    function isCatchupDismissed() {
      try {
        return sessionStorage.getItem(CATCHUP_DISMISS_KEY) === '1';
      } catch {
        return false;
      }
    }

    function dismissCatchup() {
      try {
        sessionStorage.setItem(CATCHUP_DISMISS_KEY, '1');
      } catch {}
    }

    function lastVisitLabel() {
      const d = new Date(visitLastMs);
      if (Number.isNaN(d.getTime())) return '';
      const today = new Date();
      if (d.toDateString() === today.toDateString()) return 'earlier today';
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function catchupHtml(items) {
      if (!(visitLastMs > 0) || isCatchupDismissed()) return '';
      const fresh = items.filter((it) => {
        const t = Date.parse(it.first_seen || it.collected_at || it.published || '');
        return Number.isFinite(t) && t > visitLastMs;
      });
      if (!fresh.length) return '';

      const picks = fresh
        .map((it, i) => ({ it, i, sources: (Array.isArray(it.also_covered) ? it.also_covered.length : 0) + 1 }))
        .sort((a, b) => b.sources - a.sources || a.i - b.i)
        .slice(0, 5);

      const bullets = picks.map(({ it, sources }) => {
        // Lead with why-it-matters when the pipeline has real signal; the
        // publisher summary is the fallback, not the headline act.
        const lineRaw = whyItMattersText(it) || cleanText(it.summary_1line);
        const short = lineRaw.length > 110 ? `${lineRaw.slice(0, 110).trimEnd()}…` : lineRaw;
        const flames = sources >= 2 ? ` <span class="badge badge-trend" title="Covered by ${sources} sources">🔥 ${sources} sources</span>` : '';
        return `<li><a href="${safeUrl(it.url)}" target="_blank" rel="noopener" data-track="item-link" data-item-id="${esc(itemKey(it))}" data-source="${esc(it.source || '')}" data-title="${esc(it.title || '')}">${esc(it.title || 'Untitled')}</a>${flames}${short ? ` <span class="catchup-summary">— ${esc(short)}</span>` : ''}</li>`;
      }).join('');

      if (!catchupViewCaptured) {
        catchupViewCaptured = true;
        posthogCapture('catchup_view', { new_count: fresh.length, shown: picks.length });
      }

      const topicsNote = getSelectedLabels().length ? ' in your topics' : '';
      return `
        <section class="catchup" aria-label="Catch up since your last visit">
          <div class="catchup-head">
            <strong>⚡ Catch me up</strong>
            <span class="catchup-sub">Since your last visit (${esc(lastVisitLabel())}): ${fresh.length} new ${fresh.length === 1 ? 'story' : 'stories'}${topicsNote}</span>
            <button type="button" class="catchup-dismiss" data-catchup-dismiss="1" aria-label="Dismiss catch-up brief" title="Dismiss">×</button>
          </div>
          <ul>${bullets}</ul>
          <p class="catchup-more"><a href="/daily">Read the full daily recap →</a>${digestTelegramUrl ? ` · <a href="${safeUrl(digestTelegramUrl)}" target="_blank" rel="noopener" data-digest-cta="catchup">📬 Get this as a daily Telegram digest</a>` : ''}</p>
        </section>`;
    }

    // Saved items live only in localStorage; Markdown export is the escape
    // hatch so a cleared browser doesn't mean a lost reading list.
    function exportSavedMarkdown() {
      const all = Object.values(savedItemsState)
        .sort((a, b) => String(b.saved_at || '').localeCompare(String(a.saved_at || '')));
      if (!all.length) return;
      const lines = ['# Saved stories — AI Feed (llm-digest.com)', ''];
      for (const it of all) {
        const title = String(it.title || 'Untitled').replace(/[\[\]]/g, '');
        const date = fmtCompactDate(it.published || it.saved_at);
        lines.push(`- [${title}](${it.url || ''})${it.source ? ` — ${sourceDisplayName(it.source)}` : ''}${date ? `, ${date}` : ''}`);
        const summary = String(it.summary_1line || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        if (summary) lines.push(`  ${summary}`);
      }
      const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ai-feed-saved-${toDateInput(new Date())}.md`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      posthogCapture('saved_export', { count: all.length });
    }

    // Last fetched feed payload; search re-renders from here without refetching.
    let feedCache = { items: [], runs: [], freshAdded: 0, runId: null };

    function renderFeedList() {
      const list = document.getElementById('list');
      const { items, runs, freshAdded, runId } = feedCache;
      const q = searchQueryState.trim().toLowerCase();
      const visible = items.filter((it) => matchesQuery(it, q));

      // Reader-facing summary line: stories + recency, not pipeline jargon.
      const latestRunAt = runs.reduce((acc, r) => {
        const t = Date.parse(r?.run_at || '');
        return Number.isFinite(t) && t > acc ? t : acc;
      }, 0);
      const updatedNote = latestRunAt ? ` · updated ${fmtRelTime(new Date(latestRunAt).toISOString())}` : '';
      const newSince = visible.filter((it) => String(it.tier_hint || '') !== 'tier1_fresh' && isNewSinceLastVisit(it)).length;
      const newNote = newSince > 0 ? ` · ${newSince} new since your last visit` : '';
      const selectedLabels = getSelectedLabels();
      const labelNote = selectedLabels.length ? ` · topics: ${selectedLabels.join(', ')}` : '';
      // "159 stories" alone reads as homework; naming the window frames it
      // as coverage ("everything from the last 7 days") instead of a backlog.
      const RANGE_LABELS = { 1: 'today', 3: 'last 3 days', 7: 'last 7 days', 30: 'last 30 days' };
      const rangeLabel = (customRangeState.from || customRangeState.to) ? '' : RANGE_LABELS[presetDaysState] || '';
      const rangeNote = rangeLabel ? ` ${rangeLabel === 'today' ? 'today' : `from the ${rangeLabel}`}` : '';
      const countText = q
        ? `${visible.length} of ${items.length} stories`
        : `${items.length} ${items.length === 1 ? 'story' : 'stories'}${rangeNote}`;
      document.getElementById('meta').textContent = `${countText}${updatedNote}${newNote}${labelNote}`;
      syncSectionTabs();

      if (!visible.length) {
        list.innerHTML = q
          ? `<div class="state">No items match “${esc(q)}”. Try a different search.</div>`
          : `<div class="state">No items for that date/time range. Try widening the window.</div>`;
        return;
      }

      const cards = visible.map((it, i) => cardHtml(it, { rank: i + 1, runId }));
      if (!q) {
        // Onboarding (first visit) or subscribe nudge (returning visits) goes
        // after the 3rd story; catch-up stays pinned on top.
        const promo = onboardingHtml() || subscribeNudgeHtml();
        if (promo) cards.splice(Math.min(3, cards.length), 0, promo);
        cards.unshift(catchupHtml(items));
      }
      list.innerHTML = cards.join('');
    }

    async function run() {
      syncUrlFromFilters();
      if (viewState === 'saved') {
        renderSavedView();
        return;
      }
      const res = await fetch(buildFeedUrl());
      if (!res.ok) throw new Error(`feed_http_${res.status}`);

      const data = await res.json();
      const items = data.items || [];
      const runs = data.runs || [];
      const runId = runs?.[0]?.run_at || null;

      feedCache = {
        items,
        runs,
        freshAdded: Number(data.tier1_blend?.fresh_added || 0),
        runId,
      };
      itemsByKey = new Map(items.map((it) => [itemKey(it), it]));
      renderFeedList();
      renderReaderTuningNote(data.reader_tuning);
      maybeHighlightSharedItem();

      posthogCapture('feed_view', {
        items_count: items.length,
        runs_count: runs.length,
        fresh_added: feedCache.freshAdded,
        selected_labels: getSelectedLabels(),
      });

      const impressions = items.slice(0, 200).map((it, i) => ({
        event_type: 'impression',
        item_id: it.id || `${it.url || ''}::${it.title || ''}`,
        title: it.title || '',
        url: it.url || '',
        source: it.source || '',
        rank_position: i + 1,
        run_id: it.ingest_batch_id || it.run_id || runId,
        ts: new Date().toISOString(),
      }));
      captureEvents(impressions);
    }

    // exitSaved: filter interactions leave the saved view and go back to the feed.
    function refreshFeed({ exitSaved = false } = {}) {
      if (exitSaved) viewState = 'feed';
      run().catch(err => {
        document.getElementById('meta').textContent = 'Feed unavailable';
        document.getElementById('list').innerHTML = `<div class="state">Could not load the feed right now. Please refresh in a moment.</div>`;
        console.error(err);
      });
    }

    function initClickTracking() {
      const list = document.getElementById('list');
      if (!list) return;

      list.addEventListener('click', (e) => {
        if (e.target.closest('button[data-export-saved]')) {
          exportSavedMarkdown();
          return;
        }

        const topicBtn = e.target.closest('button[data-onboard-topic]');
        if (topicBtn) {
          const v = topicBtn.dataset.onboardTopic || '';
          if (onboardSelection.has(v)) onboardSelection.delete(v);
          else onboardSelection.add(v);
          renderFeedList();
          return;
        }

        if (e.target.closest('button[data-onboard-save]')) {
          if (!onboardSelection.size) return;
          pinnedLabelsState = [...onboardSelection];
          persistPinnedLabels();
          markOnboardingDone();
          posthogCapture('onboarding_topics', { action: 'save', labels: pinnedLabelsState });
          setSelectedLabels(pinnedLabelsState);
          refreshFeed();
          return;
        }

        if (e.target.closest('button[data-onboard-skip]')) {
          markOnboardingDone();
          posthogCapture('onboarding_topics', { action: 'skip' });
          renderFeedList();
          return;
        }

        if (e.target.closest('button[data-catchup-dismiss]')) {
          dismissCatchup();
          posthogCapture('catchup_dismiss', {});
          renderFeedList();
          return;
        }

        if (e.target.closest('button[data-subscribe-nudge-skip]')) {
          markSubscribeNudgeDone();
          posthogCapture('subscribe_nudge_dismiss', {});
          renderFeedList();
          return;
        }

        const fbBtn = e.target.closest('button[data-fb-signal]');
        if (fbBtn) {
          const active = toggleFeedback(fbBtn.dataset.fbId || '', fbBtn.dataset.fbSignal || '', {
            rank: Number(fbBtn.dataset.rank || 0) || null,
            runId: fbBtn.dataset.runId || null,
          });
          const row = fbBtn.closest('.fb-row');
          row?.querySelectorAll('button[data-fb-signal]').forEach((b) => {
            b.setAttribute('aria-pressed', b.dataset.fbSignal === active ? 'true' : 'false');
          });
          const label = row?.querySelector('.fb-label');
          if (label) label.textContent = active ? FEEDBACK_THANKS : FEEDBACK_PROMPT;
          return;
        }

        const shareBtn = e.target.closest('button[data-share-id]');
        if (shareBtn) {
          shareItem(shareBtn);
          return;
        }

        const saveBtn = e.target.closest('button[data-save-id]');
        if (saveBtn) {
          const nowSaved = toggleSaved(saveBtn.dataset.saveId || '');
          if (viewState === 'saved') {
            renderSavedView();
          } else {
            saveBtn.textContent = nowSaved ? '★' : '☆';
            saveBtn.setAttribute('aria-pressed', nowSaved ? 'true' : 'false');
            const label = nowSaved ? 'Remove from saved' : 'Save for later';
            saveBtn.setAttribute('aria-label', label);
            saveBtn.title = label;
            updateSavedTab();
          }
          return;
        }

        const a = e.target.closest('a[data-track="item-link"]');
        if (!a) return;

        const event = {
          event_type: 'click',
          item_id: a.dataset.itemId || null,
          title: a.dataset.title || null,
          url: a.getAttribute('href') || null,
          source: a.dataset.source || null,
          rank_position: Number(a.dataset.rank || 0) || null,
          run_id: a.dataset.runId || null,
          ts: new Date().toISOString(),
        };
        captureEvents([event]);
      });
    }

    function initFilters() {
      const searchEl = document.getElementById('searchBox');
      let searchDebounce = null;
      searchEl?.addEventListener('input', () => {
        searchQueryState = searchEl.value;
        clearTimeout(searchDebounce);
        // Search filters the already-fetched items client-side: no refetch needed.
        searchDebounce = setTimeout(() => {
          syncUrlFromFilters();
          if (viewState === 'saved') renderSavedView();
          else renderFeedList();
        }, 200);
      });

      document.getElementById('searchToggle')?.addEventListener('click', () => {
        const box = document.getElementById('searchBox');
        const opening = !!box?.hidden;
        setSearchVisible(opening, { focus: true });
        if (!opening && searchQueryState.trim()) {
          // Collapsing the search also clears it so hidden filters can't confuse.
          searchQueryState = '';
          if (box) box.value = '';
          syncUrlFromFilters();
          if (viewState === 'saved') renderSavedView();
          else renderFeedList();
        }
      });

      document.getElementById('rangeSelect')?.addEventListener('change', (e) => {
        setDateRangeDays(e.target.value);
        refreshFeed({ exitSaved: true });
      });

      document.getElementById('savedTab')?.addEventListener('click', () => {
        viewState = viewState === 'saved' ? 'feed' : 'saved';
        refreshFeed();
      });

      document.getElementById('sections')?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-section]');
        if (!btn) return;
        const section = btn.dataset.section || '';
        // "All" clears the filter; any other tab selects exactly that section.
        setSelectedLabels(section ? [section] : []);
        refreshFeed({ exitSaved: true });
      });

      document.getElementById('selectedLabels')?.addEventListener('click', (e) => {
        if (e.target.closest('button[data-pin-toggle]')) {
          const labels = getSelectedLabels();
          const unpin = sameLabels(labels, pinnedLabelsState);
          pinnedLabelsState = unpin ? [] : labels;
          persistPinnedLabels();
          posthogCapture('labels_pin', { action: unpin ? 'unpin' : 'pin', labels: pinnedLabelsState });
          renderSelectedLabelsChips();
          return;
        }

        if (e.target.closest('button[data-pin-apply]')) {
          setSelectedLabels(pinnedLabelsState);
          posthogCapture('labels_pin', { action: 'apply', labels: pinnedLabelsState });
          refreshFeed({ exitSaved: true });
          return;
        }

        const btn = e.target.closest('button[data-chip-remove]');
        if (!btn) return;
        const next = new Set(getSelectedLabels());
        next.delete(btn.getAttribute('data-chip-remove') || '');
        setSelectedLabels([...next]);
        refreshFeed({ exitSaved: true });
      });
    }

    // Subscribe CTAs live in several places (quicknav, catch-up brief, footer,
    // subscribe menu, returning-visitor nudge); document-level listeners
    // attribute clicks by placement.
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[data-digest-cta]');
      if (a) posthogCapture('digest_subscribe_click', { placement: a.dataset.digestCta });
    });

    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[data-subscribe-channel]');
      if (!a) return;
      posthogCapture('subscribe_click', {
        channel: a.dataset.subscribeChannel || null,
        placement: a.dataset.subscribePlacement || null,
      });
      // Any channel click retires the returning-visitor nudge.
      if (a.dataset.subscribePlacement === 'nudge') markSubscribeNudgeDone();
      setSubscribeMenuOpen(false);
    });

    initThemeToggle();
    initSubscribeMenu();
    readFiltersFromUrl();
    initFilters();
    initClickTracking();
    initClientConfig();
    refreshFeed();
  </script>
</body>
</html>
