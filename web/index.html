<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Feed</title>
  <link rel="stylesheet" href="https://oat.ink/oat.min.css" />
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://oat.ink/oat.min.js" defer></script>
  <style>
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    :root,
    html[data-theme="light"] {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --card: #ffffff;
      --border: #e5e5e5;
      --accent: #2563eb;
      --muted: #6b7280;
    }
    html[data-theme="dark"] {
      --bg: #15171c;
      --fg: #e8e8ea;
      --card: #1e2128;
      --border: #34373f;
      --accent: #5b8def;
      --muted: #9aa0aa;
    }
    body {
      margin: 0;
      line-height: 1.5;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--fg);
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    button, input, select, textarea {
      color: inherit;
      background: var(--card);
      border-color: var(--border);
    }
    a {
      color: var(--accent);
    }
    main {
      width: 100%;
      max-width: 920px;
      margin: 1rem auto;
      padding: 0 0.9rem 2rem;
      overflow-x: clip;
    }
    header {
      margin-bottom: 1rem;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .topbar h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0;
      margin: 0.75rem 0 0;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.9rem;
    }
    .presets button {
      font-size: 0.9rem;
      padding: 0.3rem 0.55rem;
    }
    .sections {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
      border-bottom: 1px solid var(--border, #e5e5e5);
      padding-bottom: 0.5rem;
    }
    .sections button {
      font-size: 0.92rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: inherit;
    }
    .sections button:hover {
      border-color: var(--accent, #2563eb);
    }
    .sections button.active {
      background: var(--accent, #2563eb);
      border-color: var(--accent, #2563eb);
      color: #fff;
      font-weight: 600;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.6rem;
      margin-top: 0.8rem;
      align-items: end;
    }
    .filters label {
      font-size: 0.92rem;
      opacity: 0.9;
      display: block;
      margin-bottom: 0.25rem;
    }
    .filters .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-control {
      width: 100%;
      min-height: 56px;
    }
    .label-filter {
      display: flex;
      flex-direction: column;
    }
    #labelPickerWrap {
      display: block;
      width: 100%;
      position: relative;
    }
    #labelPicker {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      left: 0;
      width: min(320px, 90vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    #labelSearch {
      width: 100%;
      margin-bottom: 0.5rem;
    }
    #labelOptions {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    #labelOptions label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
      font-size: 0.92rem;
    }
    .picker-actions {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .selected-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .selected-labels .badge {
      cursor: pointer;
    }
    .label-filter #labelPickerBtn {
      width: 100%;
      min-height: 56px;
      padding: 0.65rem 0.9rem;
      text-align: left;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      margin: 0;
      line-height: 1.2;
      font-size: 16px;
    }
    #list {
      display: grid;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    article {
      padding: 1rem;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      background: var(--card, #fff);
    }
    .thumb {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 0.6rem;
      border: 1px solid var(--border, #e5e5e5);
    }
    article h3 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    article h3 a {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.45rem 0;
      min-width: 0;
    }
    .badge {
      display: inline-block;
      max-width: 100%;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 999px;
      padding: 0.18rem 0.55rem;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, var(--card));
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .badge-fresh {
      border-color: #16a34a;
      color: #166534;
      background: #ecfdf3;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-fresh {
      border-color: #22c55e;
      color: #bbf7d0;
      background: #14532d;
    }
    .badge-new {
      border-color: #d97706;
      color: #92400e;
      background: #fef3c7;
      font-weight: 600;
    }
    html[data-theme="dark"] .badge-new {
      border-color: #f59e0b;
      color: #fde68a;
      background: #78350f;
    }
    .save-btn {
      margin-left: auto;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1;
      padding: 0 0.2rem;
      color: var(--muted);
    }
    .save-btn:hover,
    .save-btn[aria-pressed="true"] {
      color: #f59e0b;
    }
    .why {
      margin: 0.35rem 0 0;
      font-size: 1rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .matters {
      margin: 0.45rem 0 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
      border-left: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      padding-left: 0.55rem;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .when {
      align-self: center;
      color: var(--muted);
      font-size: 0.86rem;
      white-space: nowrap;
    }
    .state {
      border: 1px dashed var(--border, #d9d9d9);
      border-radius: 10px;
      padding: 1rem;
      opacity: 0.85;
    }
    input, button, a[role="button"] {
      font-size: 16px;
    }
    @media (max-width: 640px) {
      main {
        margin-top: 0.75rem;
      }
      .topbar h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <h1>📰 AI Feed</h1>
        <button id="themeToggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
      </div>
      <p id="meta">Loading...</p>
      <menu>
        <a href="/daily" role="button">📰 Daily recap</a>
        <a href="/weekly" role="button">🗓️ Weekly recap</a>
        <a href="/api/rss" role="button">RSS feed</a>
        <a href="/api/feed" role="button">JSON feed</a>
      </menu>

      <div class="presets" id="presets">
        <button type="button" data-days="1">Today</button>
        <button type="button" data-days="3">Last 3d</button>
        <button type="button" data-days="7">Last 7d</button>
        <button type="button" data-days="30">Last 30d</button>
        <button type="button" data-days="all">All</button>
      </div>

      <nav class="sections" id="sections" aria-label="Sections">
        <button type="button" data-section="" class="active">All</button>
        <button type="button" data-section="platform">Platform</button>
        <button type="button" data-section="release">Releases</button>
        <button type="button" data-section="research">Research</button>
        <button type="button" data-section="paper">Papers</button>
        <button type="button" data-section="news">News</button>
        <button type="button" id="savedTab">⭐ Saved</button>
      </nav>

      <form id="filters" class="filters">
        <div>
          <label for="fromDate">From</label>
          <input type="date" id="fromDate" class="filter-control" />
        </div>
        <div>
          <label for="toDate">To</label>
          <input type="date" id="toDate" class="filter-control" />
        </div>
        <div>
          <label for="limit">Max items</label>
          <input type="number" id="limit" class="filter-control" value="200" min="1" max="500" step="10" />
        </div>
        <div class="label-filter">
          <label for="labelPickerBtn">Labels</label>
          <div id="labelPickerWrap">
            <button type="button" id="labelPickerBtn">Choose labels</button>
            <div id="labelPicker" hidden>
              <input type="search" id="labelSearch" placeholder="Search labels…" aria-label="Search labels" />
              <div id="labelOptions"></div>
              <div class="picker-actions">
                <button type="button" id="clearLabelsBtn">Clear</button>
                <button type="button" id="closeLabelPickerBtn">Done</button>
              </div>
            </div>
          </div>
        </div>
        <div class="actions">
          <button type="submit">Apply</button>
          <button type="button" id="clearFilters">Reset</button>
        </div>
      </form>
      <div id="selectedLabels" class="selected-labels"></div>
    </header>

    <section id="list" aria-live="polite"></section>
  </main>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }

    function initThemeToggle() {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current);
      btn.addEventListener('click', () => {
        const now = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(now === 'dark' ? 'light' : 'dark');
      });
    }

    function fmtCompactDate(v) {
      if (!v) return '';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '';
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return d.toLocaleDateString(undefined, sameYear
        ? { month: 'short', day: 'numeric' }
        : { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function toIsoDateStart(dateStr) {
      if (!dateStr) return null;
      return `${dateStr}T00:00:00`;
    }

    function toIsoDateEnd(dateStr) {
      if (!dateStr) return null;
      return `${dateStr}T23:59:59`;
    }

    function toDateInput(d) {
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    let presetDaysState = '7';

    function setDateRangeDays(days) {
      presetDaysState = String(days);

      const fromEl = document.getElementById('fromDate');
      const toEl = document.getElementById('toDate');
      if (!fromEl || !toEl) return;

      if (days === 'all') {
        fromEl.value = '';
        toEl.value = '';
        return;
      }

      const n = Number(days);
      const now = new Date();
      const from = new Date(now.getTime() - n * 24 * 60 * 60 * 1000);
      fromEl.value = toDateInput(from);
      toEl.value = toDateInput(now);
    }

    // 'feed' renders the API feed; 'saved' renders locally saved items.
    let viewState = 'feed';

    // Items from the last feed render, keyed by itemKey, so saves can snapshot
    // the full item even after the DOM only holds rendered HTML.
    let itemsByKey = new Map();

    const VISIT_LAST_KEY = 'ai_feed_last_visit_at';
    const VISIT_SESSION_KEY = 'ai_feed_visit_session_at';
    const VISIT_SESSION_GAP_MS = 30 * 60 * 1000;

    // Returns when the previous visit session started (0 = first visit).
    // Reloads within VISIT_SESSION_GAP_MS keep the same baseline so "New"
    // markers don't vanish on refresh.
    function initVisitTracking() {
      try {
        const now = Date.now();
        const sessionStart = Number(localStorage.getItem(VISIT_SESSION_KEY) || 0);
        if (sessionStart && now - sessionStart <= VISIT_SESSION_GAP_MS) {
          return Number(localStorage.getItem(VISIT_LAST_KEY) || 0);
        }
        if (sessionStart) localStorage.setItem(VISIT_LAST_KEY, String(sessionStart));
        localStorage.setItem(VISIT_SESSION_KEY, String(now));
        return sessionStart || 0;
      } catch {
        return 0;
      }
    }

    const visitLastMs = initVisitTracking();

    function isNewSinceLastVisit(it) {
      if (!(visitLastMs > 0)) return false;
      const t = Date.parse(it.first_seen || it.collected_at || it.published || '');
      return Number.isFinite(t) && t > visitLastMs;
    }

    const SAVED_ITEMS_KEY = 'ai_feed_saved_items_v1';

    function loadSavedItems() {
      try {
        const v = JSON.parse(localStorage.getItem(SAVED_ITEMS_KEY) || '{}');
        return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
      } catch {
        return {};
      }
    }

    let savedItemsState = loadSavedItems();

    function persistSavedItems() {
      try {
        localStorage.setItem(SAVED_ITEMS_KEY, JSON.stringify(savedItemsState));
      } catch {}
    }

    function itemKey(it) {
      return String(it.id || `${it.url || ''}::${it.title || ''}`);
    }

    function isItemSaved(key) {
      return Object.prototype.hasOwnProperty.call(savedItemsState, key);
    }

    function snapshotForSave(it) {
      return {
        id: it.id || null,
        title: it.title || '',
        url: it.url || '',
        source: it.source || '',
        type: it.type || 'news',
        summary_1line: it.summary_1line || '',
        why_it_matters: it.why_it_matters || '',
        llm_label_source: it.llm_label_source || '',
        image_url: it.image_url || '',
        published: it.published || it.first_seen || it.last_seen || null,
        saved_at: new Date().toISOString(),
      };
    }

    function toggleSaved(key) {
      if (isItemSaved(key)) {
        delete savedItemsState[key];
        persistSavedItems();
        posthogCapture('item_save', { item_id: key, action: 'unsave' });
        return false;
      }
      const it = itemsByKey.get(key);
      if (!it) return false;
      savedItemsState[key] = snapshotForSave(it);
      persistSavedItems();
      posthogCapture('item_save', { item_id: key, action: 'save', source: it.source || null });
      return true;
    }

    function updateSavedTab() {
      const btn = document.getElementById('savedTab');
      if (!btn) return;
      const n = Object.keys(savedItemsState).length;
      btn.textContent = n > 0 ? `⭐ Saved (${n})` : '⭐ Saved';
      btn.classList.toggle('active', viewState === 'saved');
    }

    // 'preset' keeps the URL on a relative window (?days=N) so shared links stay
    // fresh; 'custom' pins explicit ?from/?to dates the user picked.
    let dateModeState = 'preset';

    function readFiltersFromUrl() {
      const p = new URLSearchParams(window.location.search);

      viewState = p.get('view') === 'saved' ? 'saved' : 'feed';

      const limit = p.get('limit');
      const limitEl = document.getElementById('limit');
      if (limit && limitEl) limitEl.value = limit;

      const from = p.get('from');
      const to = p.get('to');
      if (from || to) {
        dateModeState = 'custom';
        presetDaysState = 'all'; // explicit range wins; disable preset fallback
        const fromEl = document.getElementById('fromDate');
        const toEl = document.getElementById('toDate');
        if (fromEl) fromEl.value = from || '';
        if (toEl) toEl.value = to || '';
      } else {
        const days = p.get('days');
        const valid = days === 'all' || (Number(days) > 0);
        setDateRangeDays(valid ? days : 7);
      }

      const labels = p.getAll('label').flatMap((v) => String(v).split(','));
      setSelectedLabels(labels);
    }

    function syncUrlFromFilters() {
      const p = new URLSearchParams();
      if (viewState === 'saved') p.set('view', 'saved');
      for (const l of getSelectedLabels()) p.append('label', l);

      if (dateModeState === 'custom') {
        const from = document.getElementById('fromDate')?.value || '';
        const to = document.getElementById('toDate')?.value || '';
        if (from) p.set('from', from);
        if (to) p.set('to', to);
      } else if (presetDaysState !== '7') {
        p.set('days', presetDaysState);
      }

      const limit = document.getElementById('limit')?.value || '200';
      if (limit !== '200') p.set('limit', limit);

      const qs = p.toString();
      history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
    }

    let selectedLabelsState = new Set();

    // Section tabs are a quick-select over the existing label filter.
    // Each maps to a single llm_category/type label value.
    const SECTION_VALUES = new Set(['platform', 'release', 'research', 'paper', 'news']);

    function activeSection() {
      const labels = getSelectedLabels();
      if (labels.length === 0) return '';
      if (labels.length === 1 && SECTION_VALUES.has(labels[0])) return labels[0];
      return null; // advanced/multi-label selection: no single section is active
    }

    function syncSectionTabs() {
      const current = viewState === 'saved' ? null : activeSection();
      const buttons = document.querySelectorAll('#sections button[data-section]');
      buttons.forEach((b) => {
        const matches = current !== null && (b.dataset.section || '') === current;
        b.classList.toggle('active', matches);
      });
      updateSavedTab();
    }

    function normalizeLabel(v) {
      return String(v || '')
        .trim()
        .toLowerCase()
        .replace(/^#+/, '')
        .replace(/\s+/g, '_');
    }

    function getSelectedLabels() {
      return [...selectedLabelsState];
    }

    function setSelectedLabels(values) {
      selectedLabelsState = new Set(
        (Array.isArray(values) ? values : [])
          .map((v) => normalizeLabel(v))
          .filter(Boolean)
      );
      renderSelectedLabelsChips();
      updateLabelPickerButton();
      syncSectionTabs();
    }

    function updateLabelPickerButton() {
      const btn = document.getElementById('labelPickerBtn');
      if (!btn) return;
      const n = selectedLabelsState.size;
      btn.textContent = n > 0 ? `Labels (${n})` : 'Choose labels';
    }

    function renderSelectedLabelsChips() {
      const box = document.getElementById('selectedLabels');
      if (!box) return;
      const labels = getSelectedLabels();
      if (!labels.length) {
        box.innerHTML = '';
        return;
      }
      box.innerHTML = labels.map((l) => `<button type="button" class="badge" data-chip-remove="${esc(l)}">#${esc(l)} ×</button>`).join('');
    }

    function syncLabelOptions(available) {
      const box = document.getElementById('labelOptions');
      if (!box) return;
      const selected = new Set(getSelectedLabels());
      const q = String(document.getElementById('labelSearch')?.value || '').trim().toLowerCase();
      const dedup = new Map();
      for (const x of (Array.isArray(available) ? available : [])) {
        const v = normalizeLabel(x?.label);
        if (!v) continue;
        const c = Number(x?.count || 0);
        dedup.set(v, Number(dedup.get(v) || 0) + c);
      }

      const labels = [...dedup.entries()]
        .map(([label, count]) => ({ label, count }))
        .filter((x) => !q || x.label.includes(q));

      box.innerHTML = labels.map((x) => {
        const v = x.label;
        const c = Number(x?.count || 0);
        if (!v) return '';
        const safe = esc(v);
        const checked = selected.has(v) ? ' checked' : '';
        return `<label><input type="checkbox" data-label-opt="${safe}" value="${safe}"${checked} /> ${safe} (${c})</label>`;
      }).join('');
    }

    function buildFeedUrl() {
      const fromDate = document.getElementById('fromDate')?.value || '';
      const toDate = document.getElementById('toDate')?.value || '';

      let from = toIsoDateStart(fromDate);
      let to = toIsoDateEnd(toDate);
      if (!from && !to && presetDaysState !== 'all') {
        const n = Math.max(1, Number(presetDaysState || 7));
        const now = new Date();
        const fromD = new Date(now.getTime() - n * 24 * 60 * 60 * 1000);
        from = toIsoDateStart(toDateInput(fromD));
        to = toIsoDateEnd(toDateInput(now));
      }

      const limit = document.getElementById('limit')?.value || '200';
      const labels = getSelectedLabels();
      const u = new URL('/api/feed', window.location.origin);
      if (from) u.searchParams.set('from', from);
      if (to) u.searchParams.set('to', to);
      if (limit) u.searchParams.set('limit', limit);
      for (const l of labels) u.searchParams.append('label', l);
      return u.pathname + u.search;
    }

    function esc(v) {
      return String(v ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function safeUrl(v) {
      try {
        const u = new URL(String(v || ''), window.location.origin);
        if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
      } catch {}
      return '#';
    }

    function randomId(prefix = 'id') {
      if (window.crypto?.randomUUID) return `${prefix}_${window.crypto.randomUUID()}`;
      return `${prefix}_${Math.random().toString(36).slice(2)}_${Date.now()}`;
    }

    async function initPosthog() {
      try {
        const res = await fetch('/api/client-config');
        if (!res.ok) return;
        const cfg = await res.json();
        const ph = cfg?.posthog || {};
        if (!ph.enabled || !ph.project_api_key) return;

        (function(document, posthog){
          if (posthog.__SV) return;
          window.posthog = posthog;
          posthog._i = posthog._i || [];
          posthog.__SV = 1;
          posthog.init = function(apiKey, options, name){
            const target = name ? (posthog[name] = []) : posthog;
            target.people = target.people || [];
            const methods = ['capture','identify','alias','people.set','people.set_once','register','register_once','unregister','reset','isFeatureEnabled'];
            const factory = function(method){
              return function(){
                target.push([method].concat(Array.prototype.slice.call(arguments, 0)));
              };
            };
            for (const m of methods) {
              const parts = m.split('.');
              if (parts.length === 2) {
                target[parts[0]][parts[1]] = factory(m);
              } else {
                target[m] = factory(m);
              }
            }
            posthog._i.push([apiKey, options, name]);
          };
        })(document, window.posthog || []);

        window.posthog.init(ph.project_api_key, {
          api_host: ph.host || 'https://us.i.posthog.com',
          person_profiles: 'identified_only',
          autocapture: false,
          capture_pageview: false,
          capture_pageleave: true,
          persistence: 'localStorage+cookie',
          loaded: (sdk) => {
            const anon = getAnonUserId();
            sdk.identify(anon);
            sdk.capture('page_view', {
              path: window.location.pathname,
              referrer: document.referrer || null,
            });
            window.__posthogEnabled = true;
          },
        });

        if (!document.getElementById('posthog-array-js')) {
          const s = document.createElement('script');
          s.id = 'posthog-array-js';
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = (ph.host || 'https://us.i.posthog.com').replace('.i.posthog.com', '-assets.i.posthog.com') + '/static/array.js';
          s.onerror = () => console.debug('posthog_loader_failed');
          document.head.appendChild(s);
        }
      } catch (e) {
        console.debug('posthog_init_failed', e);
      }
    }

    function posthogCapture(event, properties = {}) {
      if (!window.__posthogEnabled || !window.posthog) return;
      try {
        window.posthog.capture(event, properties);
      } catch (e) {
        console.debug('posthog_capture_failed', e);
      }
    }

    function getAnonUserId() {
      const key = 'ai_feed_anon_user_id';
      let v = localStorage.getItem(key);
      if (!v) {
        v = randomId('anon');
        localStorage.setItem(key, v);
      }
      return v;
    }

    function captureEvents(events) {
      if (!events?.length) return;
      const allImpression = events.every((e) => e.event_type === 'impression');
      if (allImpression) {
        posthogCapture('impression_batch', {
          count: events.length,
          run_id: events[0]?.run_id || null,
        });
      } else {
        for (const ev of events) {
          if (ev.event_type !== 'click') continue;
          posthogCapture('click', {
            item_id: ev.item_id || null,
            source: ev.source || null,
            rank_position: ev.rank_position || null,
            run_id: ev.run_id || null,
            url: ev.url || null,
          });
        }
      }
    }

    function cardHtml(it, { rank = null, runId = '' } = {}) {
      const key = itemKey(it);
      const title = esc(it.title || 'Untitled');
      const source = esc(it.source || 'unknown');
      const type = esc(it.type || 'news');
      const summaryRaw = String(it.summary_1line || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      const summary = esc(summaryRaw);
      const published = fmtCompactDate(it.published || it.first_seen || it.last_seen);
      const whyRaw = String(it.why_it_matters || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      // Heuristic labeling emits one generic placeholder for every item — only
      // LLM-written "why it matters" text adds signal beyond the summary.
      const why = (whyRaw && whyRaw !== summaryRaw && String(it.llm_label_source || '') !== 'heuristic')
        ? esc(whyRaw)
        : '';
      const href = safeUrl(it.url);
      const image = safeUrl(it.image_url || '');
      const itemId = esc(key);
      const itemRunId = esc(it.ingest_batch_id || it.run_id || runId || '');
      const isFresh = String(it.tier_hint || '') === 'tier1_fresh';
      const isNew = rank !== null && !isFresh && isNewSinceLastVisit(it);
      const saved = isItemSaved(key);

      return `
        <article>
          ${image !== '#' ? `<img class="thumb" src="${image}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none';this.remove();" />` : ''}
          <h3>${rank !== null ? `${rank}. ` : ''}<a href="${href}" target="_blank" rel="noopener" data-track="item-link" data-item-id="${itemId}" data-source="${source}" data-rank="${rank ?? ''}" data-run-id="${itemRunId}" data-title="${title}">${title}</a></h3>
          <div class="meta-row">
            <span class="badge">${source}</span>
            ${type !== 'news' ? `<span class="badge">${type}</span>` : ''}
            ${isFresh ? `<span class="badge badge-fresh">⚡ Fresh</span>` : ''}
            ${isNew ? `<span class="badge badge-new">New</span>` : ''}
            ${published ? `<span class="when">${esc(published)}</span>` : ''}
            <button type="button" class="save-btn" data-save-id="${itemId}" aria-pressed="${saved ? 'true' : 'false'}" aria-label="${saved ? 'Remove from saved' : 'Save for later'}" title="${saved ? 'Remove from saved' : 'Save for later'}">${saved ? '★' : '☆'}</button>
          </div>
          ${summary ? `<p class="why">${summary}</p>` : ''}
          ${why ? `<p class="matters">💡 ${why}</p>` : ''}
        </article>`;
    }

    function renderSavedView() {
      const list = document.getElementById('list');
      const saved = Object.values(savedItemsState)
        .sort((a, b) => String(b.saved_at || '').localeCompare(String(a.saved_at || '')));
      document.getElementById('meta').textContent = `${saved.length} saved item${saved.length === 1 ? '' : 's'}`;
      syncSectionTabs();
      if (!saved.length) {
        list.innerHTML = `<div class="state">Nothing saved yet — tap ☆ on any story to keep it here.</div>`;
        return;
      }
      list.innerHTML = saved.map((it) => cardHtml(it)).join('');
    }

    async function run() {
      syncUrlFromFilters();
      const list = document.getElementById('list');
      if (viewState === 'saved') {
        renderSavedView();
        return;
      }
      const res = await fetch(buildFeedUrl());
      if (!res.ok) throw new Error(`feed_http_${res.status}`);

      const data = await res.json();
      const items = data.items || [];
      const runs = data.runs || [];
      const tier1Blend = data.tier1_blend || null;
      const availableLabels = data.available_labels || [];
      window.__availableLabels = availableLabels;
      const selectedLabels = getSelectedLabels();
      const runId = runs?.[0]?.run_at || null;

      syncLabelOptions(availableLabels);

      const freshAdded = Number(tier1Blend?.fresh_added || 0);
      const freshnessNote = freshAdded > 0 ? ` · ${freshAdded} fresh` : '';
      const newSince = items.filter((it) => String(it.tier_hint || '') !== 'tier1_fresh' && isNewSinceLastVisit(it)).length;
      const newNote = newSince > 0 ? ` · ${newSince} new since last visit` : '';
      const labelNote = selectedLabels.length ? ` · labels: ${selectedLabels.join(', ')}` : '';
      document.getElementById('meta').textContent = `${items.length} items · ${runs.length} runs in range${freshnessNote}${newNote}${labelNote}`;
      syncSectionTabs();

      posthogCapture('feed_view', {
        items_count: items.length,
        runs_count: runs.length,
        fresh_added: freshAdded,
        selected_labels: selectedLabels,
      });

      if (!items.length) {
        list.innerHTML = `<div class="state">No items for that date/time range. Try widening the window.</div>`;
        return;
      }

      itemsByKey = new Map(items.map((it) => [itemKey(it), it]));
      list.innerHTML = items.map((it, i) => cardHtml(it, { rank: i + 1, runId })).join('');

      const impressions = items.slice(0, 200).map((it, i) => ({
        event_type: 'impression',
        item_id: it.id || `${it.url || ''}::${it.title || ''}`,
        title: it.title || '',
        url: it.url || '',
        source: it.source || '',
        rank_position: i + 1,
        run_id: it.ingest_batch_id || it.run_id || runId,
        ts: new Date().toISOString(),
      }));
      captureEvents(impressions);
    }

    // exitSaved: filter interactions leave the saved view and go back to the feed.
    function refreshFeed({ exitSaved = false } = {}) {
      if (exitSaved) viewState = 'feed';
      run().catch(err => {
        document.getElementById('meta').textContent = 'Feed unavailable';
        document.getElementById('list').innerHTML = `<div class="state">Could not load the feed right now. Please refresh in a moment.</div>`;
        console.error(err);
      });
    }

    function initClickTracking() {
      const list = document.getElementById('list');
      if (!list) return;

      list.addEventListener('click', (e) => {
        const saveBtn = e.target.closest('button[data-save-id]');
        if (saveBtn) {
          const nowSaved = toggleSaved(saveBtn.dataset.saveId || '');
          if (viewState === 'saved') {
            renderSavedView();
          } else {
            saveBtn.textContent = nowSaved ? '★' : '☆';
            saveBtn.setAttribute('aria-pressed', nowSaved ? 'true' : 'false');
            const label = nowSaved ? 'Remove from saved' : 'Save for later';
            saveBtn.setAttribute('aria-label', label);
            saveBtn.title = label;
            updateSavedTab();
          }
          return;
        }

        const a = e.target.closest('a[data-track="item-link"]');
        if (!a) return;

        const event = {
          event_type: 'click',
          item_id: a.dataset.itemId || null,
          title: a.dataset.title || null,
          url: a.getAttribute('href') || null,
          source: a.dataset.source || null,
          rank_position: Number(a.dataset.rank || 0) || null,
          run_id: a.dataset.runId || null,
          ts: new Date().toISOString(),
        };
        captureEvents([event]);
      });
    }

    function initFilters() {
      const form = document.getElementById('filters');
      const clearBtn = document.getElementById('clearFilters');
      const presets = document.getElementById('presets');
      const labelPickerWrap = document.getElementById('labelPickerWrap');
      const labelPickerBtn = document.getElementById('labelPickerBtn');
      const labelPicker = document.getElementById('labelPicker');
      const closeLabelPickerBtn = document.getElementById('closeLabelPickerBtn');
      const labelOptions = document.getElementById('labelOptions');
      const labelSearch = document.getElementById('labelSearch');
      const clearLabelsBtn = document.getElementById('clearLabelsBtn');
      const selectedLabelsBox = document.getElementById('selectedLabels');

      form?.addEventListener('submit', (e) => {
        e.preventDefault();
        refreshFeed({ exitSaved: true });
      });

      labelPickerBtn?.addEventListener('click', (e) => {
        e.preventDefault();
        if (!labelPicker) return;
        const willOpen = labelPicker.hasAttribute('hidden');
        if (willOpen) {
          labelPicker.removeAttribute('hidden');
          setTimeout(() => labelSearch?.focus(), 0);
        } else {
          labelPicker.setAttribute('hidden', '');
        }
      });

      closeLabelPickerBtn?.addEventListener('click', () => {
        labelPicker?.setAttribute('hidden', '');
      });

      document.addEventListener('click', (e) => {
        if (!labelPickerWrap || !labelPicker || labelPicker.hasAttribute('hidden')) return;
        if (labelPickerWrap.contains(e.target)) return;
        labelPicker.setAttribute('hidden', '');
      });

      document.getElementById('fromDate')?.addEventListener('change', () => { dateModeState = 'custom'; });
      document.getElementById('toDate')?.addEventListener('change', () => { dateModeState = 'custom'; });

      presets?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-days]');
        if (!btn) return;
        dateModeState = 'preset';
        setDateRangeDays(btn.dataset.days);
        refreshFeed({ exitSaved: true });
      });

      document.getElementById('savedTab')?.addEventListener('click', () => {
        viewState = viewState === 'saved' ? 'feed' : 'saved';
        refreshFeed();
      });

      const sections = document.getElementById('sections');
      sections?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-section]');
        if (!btn) return;
        const section = btn.dataset.section || '';
        // "All" clears the filter; any other tab selects exactly that section.
        setSelectedLabels(section ? [section] : []);
        refreshFeed({ exitSaved: true });
      });

      labelSearch?.addEventListener('input', () => {
        syncLabelOptions(window.__availableLabels || []);
      });

      labelOptions?.addEventListener('change', (e) => {
        const input = e.target.closest('input[data-label-opt]');
        if (!input) return;
        const next = new Set(getSelectedLabels());
        const v = String(input.value || '').trim();
        if (!v) return;
        if (input.checked) next.add(v);
        else next.delete(v);
        setSelectedLabels([...next]);
        refreshFeed({ exitSaved: true });
      });

      clearLabelsBtn?.addEventListener('click', () => {
        setSelectedLabels([]);
        syncLabelOptions(window.__availableLabels || []);
        refreshFeed({ exitSaved: true });
      });

      selectedLabelsBox?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-chip-remove]');
        if (!btn) return;
        const v = btn.getAttribute('data-chip-remove') || '';
        const next = new Set(getSelectedLabels());
        next.delete(v);
        setSelectedLabels([...next]);
        syncLabelOptions(window.__availableLabels || []);
        refreshFeed({ exitSaved: true });
      });

      clearBtn?.addEventListener('click', () => {
        dateModeState = 'preset';
        setDateRangeDays(7);
        document.getElementById('limit').value = '200';
        setSelectedLabels([]);
        syncLabelOptions(window.__availableLabels || []);
        refreshFeed({ exitSaved: true });
      });
    }

    initThemeToggle();
    readFiltersFromUrl();
    initFilters();
    initClickTracking();
    initPosthog();
    refreshFeed();
  </script>
</body>
</html>
