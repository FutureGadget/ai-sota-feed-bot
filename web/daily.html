<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Daily Recap | LLM Digest</title>
  <meta name="description" content="What happened in AI today — the day's model releases, research, and tooling news, summarized and categorized in a 3-minute read." />
  <link rel="canonical" href="https://www.llm-digest.com/daily" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LLM Digest" />
  <meta property="og:title" content="AI Daily Recap" />
  <meta property="og:description" content="What happened in AI today — the day's model releases, research, and tooling news, summarized and categorized in a 3-minute read." />
  <meta property="og:url" content="https://www.llm-digest.com/daily" />
  <meta property="og:image" content="https://www.llm-digest.com/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.llm-digest.com/og-default.png" />
  <link rel="alternate" type="application/rss+xml" title="LLM Digest feed" href="/rss.xml" />
  <link rel="stylesheet" href="https://oat.ink/oat.min.css" />
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://oat.ink/oat.min.js" defer></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    :root, html[data-theme="light"] {
      --bg: #ffffff; --fg: #1a1a1a; --card: #ffffff; --border: #e5e5e5; --accent: #2563eb; --muted: #6b7280;
    }
    html[data-theme="dark"] {
      --bg: #15171c; --fg: #e8e8ea; --card: #1e2128; --border: #34373f; --accent: #5b8def; --muted: #9aa0aa;
    }
    body { margin: 0; line-height: 1.5; overflow-x: hidden; background: var(--bg); color: var(--fg); }
    *, *::before, *::after { box-sizing: border-box; }
    button, input, select, textarea { color: inherit; background: var(--card); border-color: var(--border); }
    a { color: var(--accent); }
    main { width: 100%; max-width: 860px; margin: 1rem auto; padding: 0 0.9rem 3rem; overflow-x: clip; }
    header { margin-bottom: 1rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .topbar h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
    menu { display: flex; flex-wrap: wrap; gap: 0.75rem; padding: 0; margin: 0.75rem 0 0; align-items: center; }
    .muted { color: var(--muted); }
    .recap-title { font-size: 1.7rem; margin: 1.2rem 0 0.2rem; line-height: 1.25; }
    .recap-range { color: var(--muted); margin: 0 0 1rem; font-size: 0.98rem; }
    .intro { font-size: 1.05rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.1rem; margin: 0 0 1.5rem; }
    .intro p { margin: 0 0 0.75rem; }
    .intro p:last-child { margin-bottom: 0; }
    .tldr { margin: 0 0 1rem; padding: 0 0 0.9rem; border-bottom: 1px solid var(--border); }
    .tldr-label { text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.72rem;
      font-weight: 600; color: var(--muted); margin: 0 0 0.55rem; }
    .tldr ul { margin: 0; padding-left: 1.15rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .tldr li { font-size: 0.95rem; line-height: 1.45; }
    .toc { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
    .toc a { font-size: 0.9rem; padding: 0.3rem 0.7rem; border: 1px solid var(--border);
      border-radius: 999px; text-decoration: none; }
    .toc a:hover { border-color: var(--accent); }
    .cat { margin: 0 0 2rem; scroll-margin-top: 1rem; }
    .cat h2 { font-size: 1.25rem; margin: 0 0 0.25rem; display: flex; align-items: baseline; gap: 0.5rem; }
    .cat h2 .count { font-size: 0.85rem; color: var(--muted); font-weight: 400; }
    .cat-summary { color: var(--fg); opacity: 0.9; margin: 0 0 0.9rem; }
    .articles { display: flex; flex-direction: column; gap: 0.7rem; }
    article { border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 0.9rem; background: var(--card); }
    article h3 { margin: 0 0 0.3rem; font-size: 1.02rem; line-height: 1.35; }
    article h3 a { text-decoration: none; }
    article h3 a:hover { text-decoration: underline; }
    .art-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-bottom: 0.3rem; }
    .badge { font-size: 0.72rem; padding: 0.1rem 0.5rem; font-weight: 500;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 999px; color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, var(--card)); white-space: nowrap; }
    .art-summary { margin: 0.1rem 0 0; font-size: 0.95rem; }
    .state { padding: 2rem 1rem; text-align: center; color: var(--muted); }
    .archive { margin-left: auto; }
    footer { margin-top: 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <h1>📰 AI Daily Recap</h1>
        <button id="themeToggle" type="button" aria-label="Toggle theme">🌙 Dark</button>
      </div>
      <p id="meta" class="muted">Loading…</p>
      <menu>
        <a href="/" role="button">← Live feed</a>
        <a href="/weekly" role="button">🗓️ Weekly recap</a>
        <a href="/voices" role="button">🗣️ Voices</a>
        <a href="/#subscribe" role="button">✉️ Email digest</a>
        <a id="jsonLink" href="/api/daily" role="button">JSON</a>
        <label class="archive muted">Day
          <select id="archive" aria-label="Choose day"></select>
        </label>
      </menu>
    </header>

    <section id="recap" aria-live="polite">
      <div class="state">Loading the daily recap…</div>
    </section>

    <footer>
      Built from the AI SOTA feed. Each item links to its original source.
    </footer>
  </main>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }
    function initThemeToggle() {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
      btn.addEventListener('click', () => {
        const now = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(now === 'dark' ? 'light' : 'dark');
      });
    }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function safeUrl(u) {
      if (!u) return '#';
      try {
        const url = new URL(u, window.location.origin);
        return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '#';
      } catch { return '#'; }
    }

    function fmtDate(v) {
      if (!v) return '';
      const d = new Date(v);
      return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // Long, readable date for the recap header, e.g. "Sunday, Jun 7, 2026".
    function fmtLongDate(v) {
      if (!v) return '';
      const d = new Date(`${v}T00:00:00`);
      return Number.isNaN(d.getTime())
        ? String(v)
        : d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
    }

    // ?date= or /daily/<date> path segment.
    function dateFromLocation() {
      const q = new URLSearchParams(window.location.search).get('date');
      if (q) return q;
      const m = window.location.pathname.match(/\/daily\/(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : null;
    }

    // intro may be a single string (optionally with blank-line paragraph breaks)
    // or an array of paragraph strings. Normalize to a list of paragraphs.
    function introParagraphs(intro) {
      if (Array.isArray(intro)) return intro.map((p) => String(p).trim()).filter(Boolean);
      return String(intro || '').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
    }

    function renderIntro(recap) {
      const paras = introParagraphs(recap.intro);
      const highlights = Array.isArray(recap.highlights) ? recap.highlights.filter(Boolean) : [];
      if (!paras.length && !highlights.length) return '';
      const tldr = highlights.length
        ? `<div class="tldr">
             <p class="tldr-label">In 30 seconds</p>
             <ul>${highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>
           </div>`
        : '';
      const body = paras.map((p) => `<p>${esc(p)}</p>`).join('');
      return `<div class="intro">${tldr}${body}</div>`;
    }

    function renderRecap(recap) {
      document.title = `AI Daily Recap — ${recap.title || recap.date}`;
      document.getElementById('jsonLink').href = `/api/daily?date=${encodeURIComponent(recap.date)}`;
      const cats = Array.isArray(recap.categories) ? recap.categories : [];
      const totalArticles = cats.reduce((n, c) => n + (c.articles?.length || 0), 0);
      document.getElementById('meta').textContent =
        `${recap.article_count ?? totalArticles} articles · ${cats.length} categories`;

      const toc = cats.length > 1
        ? `<nav class="toc">${cats.map((c) =>
            `<a href="#${esc(c.slug || c.name)}">${esc(c.name)} (${c.articles?.length || 0})</a>`).join('')}</nav>`
        : '';

      const sections = cats.map((c) => {
        const arts = (c.articles || []).map((a) => {
          const href = safeUrl(a.url);
          const date = fmtDate(a.published);
          return `
            <article>
              <h3><a href="${href}" target="_blank" rel="noopener" data-track="daily-link">${esc(a.title || 'Untitled')}</a></h3>
              <div class="art-meta">
                ${a.source ? `<span class="badge">${esc(a.source)}</span>` : ''}
                ${date ? `<span class="badge">${esc(date)}</span>` : ''}
              </div>
              ${a.summary ? `<p class="art-summary">${esc(a.summary)}</p>` : ''}
            </article>`;
        }).join('');
        return `
          <section class="cat" id="${esc(c.slug || c.name)}">
            <h2>${esc(c.name)} <span class="count">${c.articles?.length || 0} item${(c.articles?.length || 0) === 1 ? '' : 's'}</span></h2>
            ${c.summary ? `<p class="cat-summary">${esc(c.summary)}</p>` : ''}
            <div class="articles">${arts}</div>
          </section>`;
      }).join('');

      document.getElementById('recap').innerHTML = `
        <h2 class="recap-title">${esc(recap.title || recap.date)}</h2>
        <p class="recap-range">${esc(fmtLongDate(recap.date))}</p>
        ${renderIntro(recap)}
        ${toc}
        ${sections || '<div class="state">No categories in this recap yet.</div>'}`;
    }

    async function loadArchive(currentDate) {
      const sel = document.getElementById('archive');
      try {
        const res = await fetch('/api/daily?list=1');
        if (!res.ok) throw new Error('list_http_' + res.status);
        const { days = [] } = await res.json();
        if (!days.length) { sel.innerHTML = '<option>—</option>'; return; }
        sel.innerHTML = days.map((d) =>
          `<option value="${esc(d.date)}" ${d.date === currentDate ? 'selected' : ''}>${esc(d.date)} · ${esc(d.title || '')}</option>`).join('');
        sel.addEventListener('change', () => {
          window.location.search = `?date=${encodeURIComponent(sel.value)}`;
        });
      } catch {
        sel.innerHTML = '<option>—</option>';
      }
    }

    async function run() {
      const date = dateFromLocation();
      const url = date ? `/api/daily?date=${encodeURIComponent(date)}` : '/api/daily';
      try {
        const res = await fetch(url);
        if (res.status === 404) {
          document.getElementById('meta').textContent = 'No recap yet';
          document.getElementById('recap').innerHTML =
            '<div class="state">No daily recap has been published yet. Check back soon.</div>';
          return;
        }
        if (!res.ok) throw new Error('daily_http_' + res.status);
        const recap = await res.json();
        renderRecap(recap);
        loadArchive(recap.date);
      } catch (err) {
        console.error(err);
        document.getElementById('meta').textContent = 'Recap unavailable';
        document.getElementById('recap').innerHTML =
          '<div class="state">Could not load the daily recap right now. Please refresh in a moment.</div>';
      }
    }

    initThemeToggle();
    run();
  </script>

  <!-- Bubble Buddy mascot: decorative WebGL character, lazy-loaded on idle,
       skipped under prefers-reduced-motion. Never affects initial load. -->
  <script type="module">
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const go = () => import('/mascot/mascot.js').catch(() => {});
      'requestIdleCallback' in window ? requestIdleCallback(go, { timeout: 5000 }) : setTimeout(go, 2500);
    }
  </script>
  <!-- "New updates" nav dots — flag unread updates in the daily, weekly,
       storylines and knowledge-map sections. Daily and weekly are time-aware
       (a stale recap never reads as "fresh" even if you haven't opened it);
       storylines and the map rely on read history alone. Signals come from
       /api/updates; "seen" markers live in localStorage. See
       docs/product-specs/nav-update-indicators.md. -->
  <script>
    (function () {
      var SEEN = {
        daily: 'ai_feed_seen_daily_v1',
        weekly: 'ai_feed_seen_weekly_v1',
        storylines: 'ai_feed_seen_storylines_v1',
        map: 'ai_feed_seen_map_v1'
      };
      var ROUTE = { '/daily': 'daily', '/weekly': 'weekly', '/storylines': 'storylines', '/map': 'map' };
      // Daily/weekly age-out: a stale recap is not "fresh" even when unread.
      var DAILY_FRESH_MAX_AGE = 1;   // covers today or yesterday
      var WEEKLY_FRESH_MAX_AGE = 8;  // most recent completed week (+1 day grace)

      function getItem(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function setItem(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      function ms(s) { var t = s ? Date.parse(s) : NaN; return isFinite(t) ? t : NaN; }

      function currentSection() {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (p === '/daily' || p.indexOf('/daily/') === 0) return 'daily';
        if (p === '/weekly' || p.indexOf('/weekly/') === 0) return 'weekly';
        if (p === '/storylines' || p.indexOf('/storyline/') === 0) return 'storylines';
        if (p === '/map' || p.indexOf('/topic/') === 0) return 'map';
        return null;
      }

      // Whole-day difference (now - dateStr), UTC, in days.
      function dayAge(nowIso, dateStr) {
        if (!dateStr) return Infinity;
        var now = new Date(nowIso);
        var d = new Date(dateStr.length === 10 ? dateStr + 'T00:00:00Z' : dateStr);
        if (isNaN(now.getTime()) || isNaN(d.getTime())) return Infinity;
        var a = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
        var b = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
        return Math.round((a - b) / 86400000);
      }

      // Value compared against the "seen" marker for each section.
      function signalOf(u, section) {
        if (section === 'daily') return u.daily && u.daily.generated_at;
        if (section === 'weekly') return u.weekly && u.weekly.generated_at;
        if (section === 'storylines') return u.storylines && u.storylines.last_updated;
        if (section === 'map') return u.map && u.map.updated;
        return null;
      }

      function isUnread(section, signal) {
        var seen = getItem(SEEN[section]);
        if (!seen) return true;
        var a = ms(signal), b = ms(seen);
        if (isFinite(a) && isFinite(b)) return a > b;
        return String(signal) > String(seen); // date-only strings sort lexically
      }

      function isFresh(section, u) {
        if (section === 'daily') return dayAge(u.now, u.daily && u.daily.date) <= DAILY_FRESH_MAX_AGE;
        if (section === 'weekly') return dayAge(u.now, u.weekly && u.weekly.end) <= WEEKLY_FRESH_MAX_AGE;
        return true; // storylines + map: read history only, no time gate
      }

      function injectStyle() {
        if (document.getElementById('nav-update-style')) return;
        var s = document.createElement('style');
        s.id = 'nav-update-style';
        s.textContent = '.nav-update-dot{display:inline-block;margin-left:.4rem;padding:.03rem .34rem;font-size:.62rem;font-weight:700;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;color:var(--accent,#2563eb);background:color-mix(in srgb,var(--accent,#2563eb) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent,#2563eb) 38%,transparent);border-radius:999px;vertical-align:middle;animation:navUpdateIn .35s ease-out both}@keyframes navUpdateIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.nav-update-dot{animation:none}}.nav-update-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}';
        (document.head || document.documentElement).appendChild(s);
      }

      function decorate(section) {
        var links = document.querySelectorAll('.quicknav a[href], menu a[href]');
        for (var i = 0; i < links.length; i++) {
          var a = links[i];
          var pathOnly = (a.getAttribute('href') || '').split('#')[0].split('?')[0].replace(/\/+$/, '');
          if (ROUTE[pathOnly] !== section || a.querySelector('.nav-update-dot')) continue;
          var dot = document.createElement('span');
          dot.className = 'nav-update-dot';
          dot.textContent = 'New';
          dot.setAttribute('aria-hidden', 'true');
          a.appendChild(dot);
          var sr = document.createElement('span');
          sr.className = 'nav-update-sr';
          sr.textContent = ' (new updates)';
          a.appendChild(sr);
        }
      }

      function run() {
        fetch('/api/updates', { headers: { accept: 'application/json' } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (u) {
            if (!u) return;
            injectStyle();
            Object.keys(ROUTE).forEach(function (route) {
              var section = ROUTE[route];
              var signal = signalOf(u, section);
              if (signal && isUnread(section, signal) && isFresh(section, u)) decorate(section);
            });
            var cur = currentSection();
            if (cur) {
              var sig = signalOf(u, cur);
              if (sig) setItem(SEEN[cur], sig);
            }
          })
          .catch(function () {});
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
