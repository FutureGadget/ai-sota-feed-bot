schema_version: 1
id: storyline-content-review
name: "Contents review for storylines"
description: Review live storylines for factual or editorial errors and publish corrections.

schedule:
  cron: "0 8 * * *"
  timezone: Asia/Seoul
  enabled: true
  delivery: best_effort

execution:
  environment: local
  scheduler: antigravity
  capabilities:
    network: true
    browser: true

repository:
  slug: FutureGadget/ai-sota-feed-bot
  default_branch: main

permissions:
  git_push: unrestricted

agent:
  prompt_file: prompt.md
