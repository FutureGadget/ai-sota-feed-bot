schema_version: 1
id: playbook-content-review
name: "Contents review for playbook"
description: Review live Playbook cards for factual, evidence, or editorial errors.

schedule:
  cron: "0 10 * * *"
  timezone: Asia/Seoul
  enabled: true
  delivery: best_effort

execution:
  environment: local
  scheduler: antigravity
  capabilities:
    network: true
    browser: true

repository:
  slug: FutureGadget/ai-sota-feed-bot
  default_branch: main

permissions:
  git_push: unrestricted

agent:
  prompt_file: prompt.md
