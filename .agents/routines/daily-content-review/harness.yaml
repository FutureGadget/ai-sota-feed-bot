schema_version: 1
id: daily-content-review
name: "Contents review for daily"
description: Review the live daily recap for factual or editorial errors and publish corrections.

schedule:
  cron: "0 6 * * *"
  timezone: Asia/Seoul
  enabled: true
  delivery: best_effort

execution:
  environment: local
  scheduler: antigravity
  capabilities:
    network: true
    browser: true

repository:
  slug: FutureGadget/ai-sota-feed-bot
  default_branch: main

permissions:
  git_push: unrestricted

agent:
  prompt_file: prompt.md
