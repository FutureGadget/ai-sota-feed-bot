schema_version: 1
id: daily-recap
name: "[News Feed Management] Daily recap"
description: Curate and publish the next unpublished UTC day's AI news recap.

schedule:
  # 06:00 KST — built ahead of the 08:00 KST email send (23:00 UTC) so the
  # curated recap is committed before the digest goes out. The prompt picks
  # its target date from the latest published recap (not from "yesterday in
  # UTC" relative to run time), so it is self-healing across missed runs
  # regardless of exactly when in the day this fires.
  cron: "0 6 * * *"
  timezone: Asia/Seoul
  enabled: true

execution:
  environment: cloud

repository:
  slug: FutureGadget/ai-sota-feed-bot
  default_branch: main

permissions:
  git_push: unrestricted

agent:
  prompt_file: prompt.md
