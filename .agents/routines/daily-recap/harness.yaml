schema_version: 1
id: daily-recap
name: "[News Feed Management] Daily recap"
description: Curate and publish the previous UTC day's AI news recap.

schedule:
  # 00:30 UTC — runs just AFTER the UTC date rollover so the recap's
  # "yesterday in UTC" is the day that just finished. The previous 06:00 KST
  # slot was 21:00 UTC of the *prior* UTC day (3h before the 00:00 UTC / 09:00
  # KST rollover), so "yesterday in UTC" resolved one day too far back and a
  # day's recap was perpetually skipped/lagged. Scheduling in UTC (not KST)
  # keeps this aligned with the UTC-keyed recap date and removes the foot-gun.
  # Still hours ahead of the 23:00 UTC daily email send, so the curated recap is
  # committed before the digest goes out.
  cron: "30 0 * * *"
  timezone: UTC
  enabled: true

execution:
  environment: cloud

repository:
  slug: FutureGadget/ai-sota-feed-bot
  default_branch: main

permissions:
  git_push: unrestricted

agent:
  prompt_file: prompt.md
