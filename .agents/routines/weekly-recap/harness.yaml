schema_version: 1
id: weekly-recap
name: "[News Feed Management] Update Weekly AI Feed Summary page"
description: Curate and publish the current ISO week's AI recap.

schedule:
  # Saturday 06:00 KST — built ahead of the Saturday 08:00 KST weekly email send
  # (Friday 23:00 UTC) so the curated recap is committed before it goes out.
  cron: "0 6 * * 6"
  timezone: Asia/Seoul
  enabled: true

execution:
  environment: cloud

repository:
  slug: FutureGadget/ai-sota-feed-bot
  default_branch: main

permissions:
  git_push: unrestricted

agent:
  prompt_file: prompt.md
