name: Model pricing refresh

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: models-refresh
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh provider offers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python pipeline/model_pricing.py
      - name: Generate static model payloads
        run: python -c "from pipeline.render_static_pages import load_models_artifact, write_models_static_json; write_models_static_json(load_models_artifact())"
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/git_commit_runtime.sh "chore(data): refresh model pricing $(date -u +%F)"
