name: AI Feed Email Digest

# Email digest to the subscriber list. Runs on its OWN schedule — NOT the hourly
# feed pipeline (hourly email = instant unsubscribe). Reads whatever data the
# hourly pipeline already committed to main. Secrets-gated: with no EMAIL_API_KEY
# (or config/email.yaml enabled:false) publish_email.py is a clean no-op and the
# cursor commit finds nothing to push.
#
#   - daily brief:   23:00 UTC (08:00 KST) for Korean readers and English readers
#                    on the original send; 11:30 UTC (07:30 ET) for English
#                    readers who chose the US-morning send (inputs.slot=us)
#   - weekly recap:  Friday 23:00 UTC (Sat 08:00 KST); Saturday 12:00 UTC for
#                    the US-morning send
#   The cron-job.org jobs pass inputs.locale; see
#   docs/how-to/hourly-trigger-cron-job-org.md.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "daily | weekly"
        default: "daily"
      dry_run:
        description: "Render only, do not send"
        type: boolean
        default: false
      test_send:
        description: "Send only to the EMAIL_TEST_TO secret (no subscribers, no cursor change)"
        type: boolean
        default: false
      locale:
        description: "Language: all | en | ko"
        type: choice
        options: [all, en, ko]
        default: all
      slot:
        description: "Send time: kst = 23:00 UTC (English + Korean), us = 11:30 UTC (English), all"
        type: choice
        options: [kst, us, all]
        default: kst

permissions:
  contents: write

concurrency:
  group: email-digest
  cancel-in-progress: false

jobs:
  email-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Send digest
        env:
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          # Resend: broadcasts target a Segment (formerly "Audience"); optional Topic.
          EMAIL_SEGMENT_ID: ${{ secrets.EMAIL_SEGMENT_ID }}
          # Korean readers' segment. Unset = no Korean send (English only).
          EMAIL_SEGMENT_ID_KO: ${{ secrets.EMAIL_SEGMENT_ID_KO }}
          # English readers who chose the US-morning send (11:30 UTC). Unset =
          # no such edition; everyone stays on the 23:00 UTC send.
          EMAIL_SEGMENT_ID_EN_US: ${{ secrets.EMAIL_SEGMENT_ID_EN_US }}
          EMAIL_TOPIC_ID: ${{ secrets.EMAIL_TOPIC_ID }}
          # Per-digest selection: daily/weekly each scope to their own Topic so a
          # "weekly only" subscriber is suppressed from the daily send.
          EMAIL_TOPIC_ID_DAILY: ${{ secrets.EMAIL_TOPIC_ID_DAILY }}
          EMAIL_TOPIC_ID_WEEKLY: ${{ secrets.EMAIL_TOPIC_ID_WEEKLY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          # Test sends go to this one address only (the owner's inbox).
          EMAIL_TEST_TO: ${{ secrets.EMAIL_TEST_TO }}
          INPUT_KIND: ${{ github.event.inputs.kind }}
          INPUT_LOCALE: ${{ github.event.inputs.locale }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TEST_SEND: ${{ github.event.inputs.test_send }}
        run: |
          # Manual dispatch picks the kind; cron maps the weekly schedule to
          # --kind weekly (github.event.schedule carries the cron expression).
          KIND="$INPUT_KIND"
          if [ -z "$KIND" ]; then
            if [ "$SCHEDULE" = "0 23 * * 5" ]; then KIND="weekly"; else KIND="daily"; fi
          fi
          MODE=""
          if [ "$DRY_RUN" = "true" ]; then MODE="--dry-run"; elif [ "$TEST_SEND" = "true" ]; then MODE="--test"; fi
          .venv/bin/python publish/publish_email.py --kind "$KIND" --locale "${INPUT_LOCALE:-all}" --slot "${INPUT_SLOT:-kst}" $MODE

      # Storyline follow alerts ride the daily run. A failure here must not
      # block committing the digest cursor above, and the follow cursor only
      # advances after a successful send.
      - name: Send storyline follow alerts
        # Follow alerts are English and ride the 23:00 UTC daily run, never a
        # Korean-only or US-morning run, so they go out once a day as before.
        if: ${{ github.event.inputs.kind != 'weekly' && github.event.inputs.test_send != 'true' && github.event.inputs.locale != 'ko' && github.event.inputs.slot != 'us' }}
        continue-on-error: true
        env:
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_SEGMENT_ID_FOLLOWERS: ${{ secrets.EMAIL_SEGMENT_ID_FOLLOWERS }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
          .venv/bin/python publish/publish_follows.py $DRY

      - name: Commit send cursor
        # always(): a failed Korean send must not drop the English cursor, or the
        # next run would re-send the English edition.
        if: ${{ always() && github.event.inputs.dry_run != 'true' && github.event.inputs.test_send != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The cursor file is absent until the first successful send in a
          # checkout (publish_email.py writes it only after sending), and
          # `git diff` never reports untracked files — so stage first and
          # check the index, or the cursor is never committed at all.
          if [ ! -f data/email/state.json ]; then
            echo "no cursor change to commit"
            exit 0
          fi
          git add data/email/state.json
          if git diff --cached --quiet -- data/email/state.json; then
            echo "no cursor change to commit"
            exit 0
          fi
          git commit -m "chore(data): advance email digest cursor $(date -u +%F)"
          # main is busy with hourly bot commits — rebase + retry on push.
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          echo "cursor push failed after retries" >&2
          exit 1
