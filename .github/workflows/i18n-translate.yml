name: I18n Static Page Translation

on:
  schedule:
    # Run daily at 23:30 UTC
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      locale:
        description: "Target locale"
        default: "ko"
        type: string
      surface:
        description: "Surface to translate (blank = all)"
        default: ""
        type: string
      limit:
        description: "Max candidates to translate"
        default: "10"
        type: string
      days:
        description: "Translate pages modified within N days (blank = no limit)"
        default: "7"
        type: string

concurrency:
  # Same group as feed-full-publish: serialize paid work against one budget.
  # Refresh main before spending and delta-merge saved usage when publishing.
  group: feed-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # start deploy-cloudflare.yml after publishing
      id-token: write
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01GN2AuwqLTq1XD8kxxuTbqr
      ANTHROPIC_ORGANIZATION_ID: c5b5d449-b5e3-4ee2-8710-0214f52e2d83
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01Tf5xcLoVaBZiGUC7e5K38f
      ANTHROPIC_WORKSPACE_ID: wrkspc_016Khe3Wp6MbgC6YGEbWB7xi
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - name: Reject publishing from a non-main ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Static translation publishing is only allowed from main." >&2
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Set remote URL with GITHUB_TOKEN (HTTPS push)
        run: |
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Recover pending paid outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python scripts/persist_static_i18n.py recover

      - name: Refresh main before spending
        id: prepare
        env:
          INPUT_LOCALE: ${{ inputs.locale || 'ko' }}
        run: |
          .venv/bin/python scripts/persist_static_i18n.py prepare \
            --checkpoint "$RUNNER_TEMP/static-i18n/checkpoint.json" \
            --run-id "actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --locale "$INPUT_LOCALE"

      # GitHub OIDC tokens expire after about 5 minutes and the Anthropic SDK
      # rereads this file on each credential refresh, so keep rewriting it.
      # The first fetch must succeed; a failed refresh keeps the previous token.
      - name: Fetch GitHub OIDC token and keep it fresh
        run: |
          set -eo pipefail
          umask 077
          fetch_token() {
            curl -sS -f -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" || return 1
            mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          (
            while sleep 240; do
              fetch_token || echo "OIDC token refresh failed" >&2
            done
          ) > /dev/null 2>&1 &
          disown

      - name: Translate static pages
        env:
          INPUT_SURFACE: ${{ inputs.surface }}
          INPUT_DAYS: ${{ inputs.days || '2' }}
          INPUT_LOCALE: ${{ inputs.locale || 'ko' }}
          INPUT_LIMIT: ${{ inputs.limit || '10' }}
        run: |
          SURFACE_ARG=""
          if [ -n "$INPUT_SURFACE" ]; then
            SURFACE_ARG="--surface $INPUT_SURFACE"
          fi
          DAYS_ARG=""
          if [ -n "$INPUT_DAYS" ]; then
            DAYS_ARG="--days $INPUT_DAYS"
          fi
          .venv/bin/python scripts/translate.py \
            --locale "$INPUT_LOCALE" \
            --limit "$INPUT_LIMIT" \
            $SURFACE_ARG \
            $DAYS_ARG

      # Save outputs and both ledger versions before rendering or publishing.
      # This also runs after partial failures/cancellation. Recovery is required
      # before a later run can enter the paid step.
      - name: Checkpoint paid outputs
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          .venv/bin/python scripts/persist_static_i18n.py checkpoint \
            --checkpoint "$RUNNER_TEMP/static-i18n/checkpoint.json"

      - name: Save paid translation outputs
        id: save
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: static-i18n-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/static-i18n/checkpoint.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish saved outputs
        id: publish
        if: ${{ always() && steps.save.outcome == 'success' }}
        run: |
          .venv/bin/python scripts/persist_static_i18n.py publish \
            --checkpoint "$RUNNER_TEMP/static-i18n/checkpoint.json"

      # GITHUB_TOKEN pushes do not trigger deploy-cloudflare.yml; start it so
      # the translated pages and data reach the live site.
      - name: Deploy the published translations
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main
