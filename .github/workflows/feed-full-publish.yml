name: AI Feed Full Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the complete pipeline without committing or pushing
        required: true
        default: false
        type: boolean

concurrency:
  group: feed-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # start deploy-cloudflare.yml after publishing
      id-token: write
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01GN2AuwqLTq1XD8kxxuTbqr
      ANTHROPIC_ORGANIZATION_ID: c5b5d449-b5e3-4ee2-8710-0214f52e2d83
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01Tf5xcLoVaBZiGUC7e5K38f
      ANTHROPIC_WORKSPACE_ID: wrkspc_016Khe3Wp6MbgC6YGEbWB7xi
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - name: Reject publishing from a non-main ref
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Publishing is only allowed from main; use dry_run for other refs." >&2
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Configure git workspace and user
        run: |
          git config --global --replace-all safe.directory "$GITHUB_WORKSPACE"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Set remote URL with GITHUB_TOKEN (HTTPS push)
        if: ${{ !inputs.dry_run }}
        run: |
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # A failed static publish must be reconciled before the feed spends from
      # the shared ledger. Keep English publishing available if recovery fails.
      - name: Recover pending paid static outputs
        id: recovery
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python scripts/persist_static_i18n.py recover

      # GitHub OIDC tokens expire after about 5 minutes and the Anthropic SDK
      # rereads this file on each credential refresh, so keep rewriting it.
      # The first fetch must succeed; a failed refresh keeps the previous token.
      # Translation is optional: if the token cannot be fetched, the localized
      # feed step fails on its own and English publishing continues.
      - name: Fetch GitHub OIDC token and keep it fresh
        continue-on-error: true
        run: |
          set -eo pipefail
          umask 077
          fetch_token() {
            curl -sS -f -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" || return 1
            mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          (
            while sleep 240; do
              fetch_token || echo "OIDC token refresh failed" >&2
            done
          ) > /dev/null 2>&1 &
          disown

      - name: Run full publish
        env:
          AUTO_PUSH_RUNTIME: ${{ inputs.dry_run && '0' || '1' }}
          # Unpublished usage cannot be omitted from the next paid request.
          # A no-push dry run cannot durably record paid usage either.
          STATIC_I18N_RECOVERY_BLOCKED: ${{ (inputs.dry_run || steps.recovery.outcome == 'failure') && '1' || '0' }}
          # Jev quality gate (pipeline/editorial_judge.py via OpenRouter
          # System One). Optional: when unset the build logs
          # judge_skipped reason=not_configured and runs deterministically.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Server-side operational telemetry (pipeline/telemetry.py). Optional:
          # when the project write key is unset the capture calls no-op cleanly.
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
        run: bash skills/ai-feed-digest-local/scripts/run_full.sh

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # push of fresh feed data above does not deploy it. The live API reads
      # data/ from R2, which only deploy-cloudflare.yml syncs: start it here.
      - name: Deploy the published data
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main
