name: AI Feed Full Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the complete pipeline without committing or pushing
        required: true
        default: false
        type: boolean

concurrency:
  group: feed-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reject publishing from a non-main ref
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Publishing is only allowed from main; use dry_run for other refs." >&2
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Configure git workspace and user
        run: |
          git config --global --replace-all safe.directory "$GITHUB_WORKSPACE"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Set remote URL with GITHUB_TOKEN (HTTPS push)
        if: ${{ !inputs.dry_run }}
        run: |
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run full publish
        env:
          AUTO_PUSH_RUNTIME: ${{ inputs.dry_run && '0' || '1' }}
          # Google Cloud Translation API key for Korean live-feed snapshots
          # (pipeline/build_localized_feed.py). Optional: when absent the
          # localized feed step emits localized_feed_missing_credentials
          # and leaves the prior snapshot in place.
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          # Server-side operational telemetry (pipeline/telemetry.py). Optional:
          # when the project write key is unset the capture calls no-op cleanly.
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
        run: bash skills/ai-feed-digest-local/scripts/run_full.sh
