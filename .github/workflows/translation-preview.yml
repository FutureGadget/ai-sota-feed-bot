name: Translation Preview

# Manual only. Translates the current top-20 /ko/ Brief cards with Claude and posts a
# side-by-side table (English / Google / Claude) to the run summary. Writes no
# data and commits nothing.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Brief cards to translate"
        default: "20"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01GN2AuwqLTq1XD8kxxuTbqr
      ANTHROPIC_ORGANIZATION_ID: c5b5d449-b5e3-4ee2-8710-0214f52e2d83
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01Tf5xcLoVaBZiGUC7e5K38f
      ANTHROPIC_WORKSPACE_ID: wrkspc_016Khe3Wp6MbgC6YGEbWB7xi
      # pipeline/translator.make_client requests a new GitHub OIDC token (id-token: write)
      # for each exchange: Anthropic accepts an identity token only once.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Preview Claude translations
        env:
          INPUT_LIMIT: ${{ inputs.limit || '20' }}
        run: .venv/bin/python scripts/translation_preview.py --limit "$INPUT_LIMIT"
