name: llm-digest-actions-runner

services:
  runner:
    build:
      context: .
    image: llm-digest-actions-runner:2.336.0
    container_name: llm-digest-actions-runner
    init: true
    restart: unless-stopped
    environment:
      RUNNER_URL: https://github.com/FutureGadget/ai-sota-feed-bot
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-llm-digest-docker-arm64}
      RUNNER_LABELS: llm-digest
      RUNNER_WORK: _work
    volumes:
      - type: bind
        source: ${RUNNER_WORK_DIR:?Set RUNNER_WORK_DIR in infra/actions-runner/.env}
        target: /home/runner/_work
      - type: volume
        source: runner-state
        target: /runner-state
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 2m

volumes:
  runner-state:
