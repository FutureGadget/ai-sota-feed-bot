# Unified ranking pipeline configuration (single canonical path)
enabled: true
preset: balanced

# Global cap on items scored after the per-slot freshness window. Note the
# prefilter ranks by freshness+reliability with a *slot-scaled* decay
# (freshness_hours/3), so sources in short-window slots (vendor/cloud, 96h)
# decay ~2.5x faster than frontier (240h) and can be crowded out of the pool by
# older frontier posts. 140 (was 120) keeps fresh short-window posts (e.g.
# google_cloud spec posts) from falling just below the line.
candidate_pool_cap: 140
llm_budget: 8
max_items: 24
# Merge strategy: fixed slot floors + dynamic headroom fill
slot_merge_strategy: floor_then_dynamic

slots:
  frontier_official:
    sources: [openai_blog, anthropic_engineering, anthropic_newsroom, claude_blog, google_deepmind_blog]
    min_items: 4
    max_items: 7
    max_per_source: 4
    freshness_hours: 240
    blend: {alpha: 0.80, beta: 0.20}

  agent_tooling_releases:
    sources: [openai_codex_releases, claude_code_releases, claude_agent_sdk_python_releases, langgraph_releases, llamaindex_releases]
    min_items: 1
    max_items: 4
    max_per_source: 1
    freshness_hours: 168
    blend: {alpha: 0.70, beta: 0.30}

  infra_runtime_releases:
    sources: [vllm_releases, triton_releases]
    min_items: 0
    max_items: 1
    max_per_source: 1
    freshness_hours: 240
    blend: {alpha: 0.70, beta: 0.30}

  open_weight_releases:
    # First-party model drops from the open-weight labs (Hugging Face org
    # listings — the earliest signal a launch emits, ahead of blog/press).
    # Bursty by design: usually empty, earns its seats on release day.
    sources: [hf_moonshotai_releases, hf_qwen_releases, hf_zai_glm_releases, hf_tencent_hunyuan_releases, hf_minimax_releases]
    min_items: 0
    max_items: 2
    max_per_source: 1
    freshness_hours: 168
    blend: {alpha: 0.70, beta: 0.30}

  vendor_general_updates:
    # Promotional vendor blogs (model launches, customer stories, marketing).
    # Capped at 1 — this is the "vendor noise, allow one" bucket.
    sources: [google_ai_blog, aws_ml_blog, nvidia_blog]
    min_items: 0
    max_items: 1
    max_per_source: 1
    freshness_hours: 96
    blend: {alpha: 0.70, beta: 0.30}

  cloud_platform_updates:
    # google_cloud_blog publishes platform-engineering content (open standards
    # like OKF, MCP/A2UI, inference-gateway reports) that is structurally
    # different from the marketing in vendor_general_updates. Given its own
    # seat so a substantive spec post no longer loses the single vendor slot to
    # an nvidia/aws benchmark PR piece. min_items: 0 — it earns the seat on
    # merit (the source also posts marketing), it is not guaranteed.
    sources: [google_cloud_blog]
    min_items: 0
    max_items: 1
    max_per_source: 1
    freshness_hours: 96
    blend: {alpha: 0.70, beta: 0.30}

  practitioner_analysis:
    sources: [simon_willison, latent_space, infoq_ai_ml, langchain_blog, vllm_blog, modal_blog, hamel_husain, eugene_yan, github_blog_ai_ml, philschmid, interconnects, sebastian_raschka, lilian_weng]
    min_items: 2
    max_items: 8
    max_per_source: 2
    freshness_hours: 240
    blend: {alpha: 0.85, beta: 0.15}

  community_signal:
    sources: [hackernews_ai, search_agent_engineering_news, search_llm_ops_news, search_cn_open_weight_labs]
    min_items: 1
    max_items: 4
    max_per_source: 1
    freshness_hours: 48
    blend: {alpha: 0.75, beta: 0.25}

  research_watch:
    sources: [arxiv_cs_ai, arxiv_cs_lg, arxiv_cs_cl, arxiv_llm_reliability, arxiv_cn_open_weight_reports, paperswithcode_latest, huggingface_blog, anthropic_research]
    min_items: 2
    max_items: 5
    max_per_source: 1
    freshness_hours: 336
    blend: {alpha: 0.85, beta: 0.15}

  overflow:
    sources: []
    min_items: 0
    max_items: 3
    max_per_source: 1
    freshness_hours: 72
    blend: {alpha: 0.75, beta: 0.25}

fallback: deterministic

time_decay:
  enabled: true
  # Smooth half-life multiplier applied after the normal Stage C slot score.
  # This makes old stories fade out of repeated hourly feed builds while still
  # letting unusually strong evergreen items compete above the floor.
  half_life_hours: 36
  floor: 0.25
  start_after_hours: 0
  slot_overrides:
    agent_tooling_releases:
      half_life_hours: 48
      floor: 0.30
    open_weight_releases:
      half_life_hours: 48
      floor: 0.30
    research_watch:
      half_life_hours: 72
      floor: 0.35
    practitioner_analysis:
      half_life_hours: 48
      floor: 0.30

dynamic_slot_rerank:
  enabled: true
  # Slot priority = base_bias + quality_weight*avg_llm_score + freshness_weight*avg_freshness
  quality_weight: 0.10
  freshness_weight: 0.25
  base_bias:
    frontier_official: 0.40
    practitioner_analysis: 0.12
    community_signal: 0.00
    agent_tooling_releases: 0.05
    open_weight_releases: 0.08  # first-party open-weight model drops: slightly above tooling releases, well below frontier blogs
    infra_runtime_releases: -0.10
    vendor_general_updates: -0.22
    cloud_platform_updates: -0.10  # less penalized than vendor noise; spec/platform posts compete in headroom
    research_watch: -0.10
    overflow: -0.20

# Keep core frontier representation in visible top band.
top_band_constraints:
  enabled: true
  top_n: 10
  min_frontier_official: 3
  min_anthropic_frontier: 1
  max_research_in_top_n: 3
  # The lead (position 1) is the brief's "read this first" — and the daily email
  # renders it as a hero. A fresh arXiv paper can outscore everything on a quiet
  # day; this keeps it from being the lead by lifting the best-scoring
  # non-research item to position 1. No-op when the whole band is research.
  lead_excludes_research: true

# Optional source-level bias for practical ordering within/across slots.
# Negative values push sources lower; positive values lift them.
source_bias:
  arxiv_cs_ai: -0.35
  arxiv_cs_lg: -0.35
  arxiv_cs_cl: -0.30
  arxiv_llm_reliability: -0.25  # topic-targeted: lift slightly above raw category dumps
  arxiv_cn_open_weight_reports: -0.15  # primary-source lab tech reports (Kimi/GLM/Qwen/MiniMax/DeepSeek): above topic searches, below curated blogs
  paperswithcode_latest: -0.25
  anthropic_research: 0.40
  anthropic_newsroom: 0.06
  claude_blog: 0.08
  openai_blog: 0.10
  anthropic_engineering: 0.12
  google_deepmind_blog: 0.10
  simon_willison: 0.08
  infoq_ai_ml: 0.08
  google_ai_blog: -0.10
  aws_ml_blog: -0.20
  nvidia_blog: -0.18
  google_cloud_blog: -0.12  # own slot (cloud_platform_updates): publishes standards/spec posts (OKF, MCP/A2UI, inference gateway)
  vllm_releases: -0.08
  triton_releases: -0.08
  langgraph_releases: 0.06
  llamaindex_releases: 0.05
  vllm_blog: 0.10        # deep inference-engineering writeups, direct platform-engineer fit
  modal_blog: 0.10       # same — serverless GPU/inference latency engineering
  hamel_husain: 0.08     # evals practitioner, low volume / high signal
  eugene_yan: 0.06       # applied ML practitioner (evals, agents, RAG)
  github_blog_ai_ml: -0.05  # mixed quality (agent-tooling deep dives + softer posts)
  philschmid: 0.10          # high-cadence practitioner, agent/inference deployment engineering
  interconnects: 0.10       # frequent, widely-cited RLHF/post-training research analysis
  sebastian_raschka: 0.08   # recognized author, LLM architecture/training analysis
  lilian_weng: 0.12         # foundational, widely-cited agent-engineering essays; very low volume

# Feedback/CTR auto-tuning (pipeline/auto_tune.py). Learned per-source deltas
# from data/feedback/source_adjustments.json are added on top of source_bias.
auto_tune:
  enabled: true
  window_days: 30            # rolling window; doubles as signal decay
  max_abs_adjustment: 0.15   # hard cap, keeps learned layer below hand-tuned bias
  explicit_weight: 0.10      # delta for a source with unanimously useful feedback
  ctr_weight: 0.08           # delta per doubling/halving of CTR vs global CTR
  min_explicit_events: 3     # feedback events needed before a source moves
  min_exposure: 25           # rank-weighted appearances needed for CTR signal
  ctr_smoothing_exposure: 20 # empirical-Bayes prior mass pulling CTR to global
  max_age_days: 14           # ranking ignores adjustments older than this

# Optional topical bias to prioritize agent-harness/coding updates from frontier vendors.
topical_bias:
  positive_keywords:
    - "agent"
    - "agentic"
    - "harness"
    - "eval"
    - "evaluation"
    - "codex"
    - "claude code"
    - "software delivery"
  positive_weight: 0.20
  negative_keywords:
    - "board"
    - "funding"
    - "partnership"
    - "appointed"
  negative_weight: -0.20

diagnostics_verbosity: full
