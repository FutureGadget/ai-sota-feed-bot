# Email digest configuration (exec-plan docs/exec-plans/active/v2.2-email-digest.md).
#
# The send is gated TWICE: `enabled: true` here AND a non-empty EMAIL_API_KEY in
# the environment. With either missing, publish/publish_email.py is a clean
# no-op (renders nothing, sends nothing, touches no state), like PostHog.
# No subscriber PII lives in this repo; the provider owns the
# list, double-opt-in, unsubscribe and compliance.
enabled: true

# resend | buttondown
#   resend:
#     - SIGNUP (api/subscribe.js): only EMAIL_API_KEY. Resend contacts are
#       global (POST /contacts) — no audience/segment id needed to register.
#     - SEND (publish_email.py): EMAIL_API_KEY + EMAIL_SEGMENT_ID + EMAIL_FROM
#       (a broadcast targets a Segment, formerly "Audience").
#     - PER-DIGEST SELECTION (optional): EMAIL_TOPIC_ID_DAILY and
#       EMAIL_TOPIC_ID_WEEKLY are separate Resend Topics, one per digest. Signup
#       (api/subscribe.js) opts a contact into the weekly topic always and the
#       daily topic unless they chose "weekly recap only"; each broadcast scopes
#       to its own topic so the opt-out holds, and Resend's preference page
#       manages it. Falls back to a single legacy EMAIL_TOPIC_ID (both digests,
#       one topic) when the per-kind ids aren't set.
#   buttondown: EMAIL_API_KEY (Authorization: Token ...); pairs with an external
#       hosted signup page via DIGEST_EMAIL_SIGNUP_URL.
provider: resend

from_name: "LLM Digest"
site_base: "https://www.llm-digest.com"
utm_source: "email"   # appended to every link for CTR attribution (PostHog loop)
# resend only: also append rid={{{contact.reader_id|none}}} to every tracked
# link so email clicks keep the subscriber's reader identity (north-star metric).
# The send ensures the `reader_id` contact property exists first and falls back
# to untagged links on any provider error. Backfill existing contacts once with
# `python3 publish/backfill_reader_ids.py`.
reader_id_links: true

# Storyline follow alerts (publish/publish_follows.py, resend only): readers who
# follow a story by email (lib/follow.js via /api/subscribe) get one personal email when stories
# they follow move. Runs after the daily digest in email-digest.yml.
follows:
  enabled: true

daily:
  max_items: 12       # finishable cap
  max_threads: 3      # "Continuing threads" storyline deltas in the daily brief

weekly:
  max_threads: 12     # Phase 4 — full set of threads that moved this week
  max_wiki: 4         # knowledge-map nodes; capped low so evergreen content
                      # doesn't dilute the recap's finishability
  max_favorites: 3    # "Reader favorites" — top most-clicked sources (CTR window)
