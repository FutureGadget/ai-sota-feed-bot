enabled: true
# Direct Anthropic API via the official Python SDK (pipeline/llm_label.py).
# Auth: ANTHROPIC_API_KEY (GitHub Actions repo secret in CI). When the key is
# absent the pipeline degrades to deterministic heuristics — it never fails.
# Legacy providers (pi_oauth local bridge, openai_compatible) stay selectable.
provider: anthropic_api
model_provider: anthropic
model: claude-haiku-4-5
bridge_command: node scripts/llm_bridge.mjs
api_key_env: ANTHROPIC_API_KEY
label_top_n: 8
rerank_top_n: 20
timeout_seconds: 15
max_retries: 1
cache_version: 15
content_fetch_enabled: true
content_fetch_top_n: 24
content_excerpt_chars: 2000
content_fetch_timeout_seconds: 8
content_fetch_time_budget_seconds: 60
