candidate_pool_cap: 140
llm_budget: 8
max_items: 24
slot_merge_strategy: floor_then_dynamic

slots:
  frontier_official:
    sources: [openai_blog, anthropic_engineering, anthropic_newsroom, google_deepmind_blog]
    min_items: 4
    max_items: 7
    max_per_source: 2
    freshness_hours: 72
    blend: {alpha: 0.80, beta: 0.20}

  agent_tooling_releases:
    sources: [openai_codex_releases, claude_code_releases, langgraph_releases, llamaindex_releases]
    min_items: 1
    max_items: 4
    max_per_source: 1
    freshness_hours: 168
    blend: {alpha: 0.70, beta: 0.30}

  infra_runtime_releases:
    sources: [vllm_releases, triton_releases]
    min_items: 0
    max_items: 1
    max_per_source: 1
    freshness_hours: 240
    blend: {alpha: 0.70, beta: 0.30}

  vendor_general_updates:
    sources: [google_ai_blog, aws_ml_blog, nvidia_blog]
    min_items: 0
    max_items: 1
    max_per_source: 1
    freshness_hours: 96
    blend: {alpha: 0.70, beta: 0.30}

  cloud_platform_updates:
    sources: [google_cloud_blog]
    min_items: 0
    max_items: 1
    max_per_source: 1
    freshness_hours: 96
    blend: {alpha: 0.70, beta: 0.30}

  practitioner_analysis:
    sources: [simon_willison, latent_space, infoq_ai_ml, langchain_blog, vllm_blog, modal_blog, hamel_husain, eugene_yan, github_blog_ai_ml, philschmid, interconnects, sebastian_raschka, lilian_weng]
    min_items: 2
    max_items: 8
    max_per_source: 2
    freshness_hours: 240
    blend: {alpha: 0.85, beta: 0.15}

  community_signal:
    sources: [hackernews_ai, search_agent_engineering_news, search_llm_ops_news]
    min_items: 1
    max_items: 4
    max_per_source: 1
    freshness_hours: 48
    blend: {alpha: 0.75, beta: 0.25}

  research_watch:
    sources: [arxiv_cs_ai, arxiv_cs_lg, arxiv_cs_cl, arxiv_llm_reliability, paperswithcode_latest, huggingface_blog, anthropic_research]
    min_items: 2
    max_items: 5
    max_per_source: 1
    freshness_hours: 336
    blend: {alpha: 0.85, beta: 0.15}

  overflow:
    sources: []
    min_items: 0
    max_items: 3
    max_per_source: 1
    freshness_hours: 72
    blend: {alpha: 0.75, beta: 0.25}

fallback: deterministic

time_decay:
  enabled: true
  half_life_hours: 36
  floor: 0.25
  start_after_hours: 0
  slot_overrides:
    agent_tooling_releases:
      half_life_hours: 48
      floor: 0.30
    research_watch:
      half_life_hours: 72
      floor: 0.35
    practitioner_analysis:
      half_life_hours: 48
      floor: 0.30

dynamic_slot_rerank:
  enabled: true
  quality_weight: 0.10
  freshness_weight: 0.25
  base_bias:
    frontier_official: 0.40
    practitioner_analysis: 0.12
    community_signal: 0.00
    agent_tooling_releases: 0.05
    infra_runtime_releases: -0.10
    vendor_general_updates: -0.22
    cloud_platform_updates: -0.10
    research_watch: -0.10
    overflow: -0.20

top_band_constraints:
  enabled: true
  top_n: 10
  min_frontier_official: 3
  min_anthropic_frontier: 1
  max_research_in_top_n: 3

source_bias:
  arxiv_cs_ai: -0.35
  arxiv_cs_lg: -0.35
  arxiv_cs_cl: -0.30
  arxiv_llm_reliability: -0.25  # topic-targeted: lift slightly above raw category dumps
  paperswithcode_latest: -0.25
  anthropic_research: 0.40
  anthropic_newsroom: 0.06
  openai_blog: 0.10
  anthropic_engineering: 0.12
  google_deepmind_blog: 0.10
  simon_willison: 0.08
  infoq_ai_ml: 0.08
  google_ai_blog: -0.10
  aws_ml_blog: -0.20
  nvidia_blog: -0.18
  google_cloud_blog: -0.12  # edge over aws/nvidia: publishes standards/spec posts (OKF, MCP/A2UI, inference gateway)
  vllm_releases: -0.08
  triton_releases: -0.08
  langgraph_releases: 0.06
  llamaindex_releases: 0.05
  vllm_blog: 0.10
  modal_blog: 0.10
  hamel_husain: 0.08
  eugene_yan: 0.06
  github_blog_ai_ml: -0.05
  philschmid: 0.10
  interconnects: 0.10
  sebastian_raschka: 0.08
  lilian_weng: 0.12

topical_bias:
  positive_keywords:
    - "agent"
    - "agentic"
    - "harness"
    - "eval"
    - "evaluation"
    - "codex"
    - "claude code"
    - "software delivery"
  positive_weight: 0.20
  negative_keywords:
    - "board"
    - "funding"
    - "partnership"
    - "appointed"
  negative_weight: -0.20

diagnostics_verbosity: full
