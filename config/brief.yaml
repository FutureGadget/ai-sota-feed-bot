# Daily admission ledger for the served Brief.
#
# The feed build writes the whole post-judge Stage A pool to
# data/quality/pool/<day>.json. This config decides which of those stories are
# admitted to the reader-facing 24-hour Brief and writes the durable result to
# data/brief/<day>.json. Admission is append-only within a day: a later build
# can add a story but never removes or re-ranks an admitted one.
#
# The ledger is a quality gate plus flood control, not a per-day ceiling. Caps
# are generous enough to keep everything worth reading, and the homepage folds
# the over-cap pool under "More from ...". See
# docs/product-specs/live-feed.md and the 2026-10-31 decision-log entry.

version: brief-ledger-v1
enabled: true

# Read the day's judged pool. A story already in a retained ledger is skipped by
# the prior_story guard, so a long-running story does not get a new card every
# day. `admission` closes the gap past the retention window.
retention_days: 3

# A story is news once
# --------------------
# The pool carries a row for as long as its slot's freshness window allows (up
# to ten days), and a row's first_seen_run restarts every UTC day. Without a
# bound, a story returned to the Brief every 24 hours until it left the pool:
# 40% of admissions over 2026-10-31..11-10 were repeats and added no story.
#
# max_hours_since_first_sighting: a story can be admitted only this long after
#   the pool first saw it (minimum first_seen_run over history_days). 48 leaves
#   a story held back by a flood guard two days to get in, which is where a
#   quiet weekend's Brief comes from. Keep it at or below retention_days * 24 -
#   24 so the prior_story guard still sees the earlier admission. 0 disables.
# history_days: pool days read for the first sighting (pool retention is 14).
admission:
  max_hours_since_first_sighting: 48
  history_days: 14

# Gate
# ----
# Release items are scored by their release tier, not the judge verdict (the
# judge drops release notes by design). Non-release items need a judge score
# at or above min_admit_score (the judge's keep threshold), or an unjudged
# item with enough evidence. The judge's review band sits below keep_at, so
# reviews are not admitted. Off-topic is always rejected. A missing evidence
# field is the judge-unavailable fail-open path; present-but-thin evidence is
# rejected.
exclude_categories: [off_topic]
min_admit_score: 0.35
min_evidence_chars: 300

release:
  major: 0.55
  minor: 0.20
  unknown: 0.30

# Unjudged rows are never scored zero: they take `scale` times the median
# judged score of their source role, then the window median, then `fallback`.
#
# admit_edition_picks: an unjudged row with thin evidence is admitted when the
# deterministic ranker gave it an edition seat. The judge cannot read
# openai_blog pages (49 to 178 characters of teaser against a 300 floor), so
# without this no OpenAI post reaches the Brief; 53 of the 56 rows it admitted
# over 2026-10-28..11-10 are openai_blog. Other thin rows stay rejected.
unjudged:
  admit_edition_picks: true
  scale: 0.9
  fallback: 0.35
  platform_relevant: 0.5
  corporate_marketing: 0.2

# utility = judge_keep * score
#         + platform_relevant * signals.platform_relevant
#         + coverage * log1p(source_count - 1)
#         + source_tune * learned per-source CTR/feedback delta
#         + in_edition * [appeared in any feed edition]
#         - corporate_marketing * signals.corporate_marketing
#         + freshness * freshness_at_admission
#         + must_cover * [release_tier == major]
#
# Freshness is evaluated at admission and then frozen: a story that was fresh
# when admitted keeps its seat even as the live score decays. That is the
# difference between admission and presentation.
weights:
  judge_keep: 1.0
  platform_relevant: 0.3
  coverage: 0.25
  source_tune: 0.5
  in_edition: 0.05
  corporate_marketing: 0.3
  freshness: 0.2
  must_cover: 1.0

freshness:
  half_life_hours: 36
  floor: 0.25

# Admission quotas are flood guards, not per-day ceilings. The values are
# deliberately generous: a busy day admits about 90-120 stories, the default
# Brief shows the cap-compliant top, and the rest is one click away. A source
# can contribute at most per_source_per_6h in any six-hour window (checked
# symmetrically across UTC midnight).
#
# per_source_per_6h was 3. hackernews_ai passes about 40 keeps a day, so 3 left
# stories the daily recap went on to pick with no card at all, not even under
# the "More from" fold. The display caps already bound the visible top, so
# this guard only decides what is reachable below it. 8 is worse than 5: the
# community role cap then fills before noon UTC.
quotas:
  global_per_day: 120
  per_source_per_6h: 5
  roles:
    first_party: 28
    practitioner: 18
    community: 16
    research: 28
    release: 12
    search: 4
    aggregator: 4
    default: 12
