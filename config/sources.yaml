  - name: langchain_blog
    type: sitemap
    url: "https://www.langchain.com/sitemap.xml"
    include_prefixes:
      - "https://www.langchain.com/blog/"
    extract_published_from_page: true
    page_meta_cache_ttl_hours: 24
  - name: search_agent_engineering_news
    type: rss
    url: "https://news.google.com/rss/search?q=%28agentic+coding+OR+coding+agent+OR+agent+harness+OR+claude+code+OR+openai+codex%29&hl=en-US&gl=US&ceid=US:en"
