sources:
  - name: arxiv_cs_ai
    type: arxiv_api
    category: cs.AI
    max_results: 40
  - name: arxiv_cs_lg
    type: arxiv_api
    category: cs.LG
    max_results: 40
  - name: arxiv_cs_cl
    type: arxiv_api
    category: cs.CL
    max_results: 30
  - name: arxiv_llm_reliability
    type: arxiv_api
    # Topic-targeted recall across CL/AI/LG for the platform-engineer reliability
    # lens (hallucination, factuality, trustworthiness, LLM evaluation). Catches
    # papers the per-category latest-N dumps miss; arXiv-URL dedupe collapses any
    # overlap with the category sources before ranking.
    search_query: '(cat:cs.CL OR cat:cs.AI OR cat:cs.LG) AND (abs:hallucination OR abs:factuality OR abs:trustworthy OR abs:"LLM evaluation")'
    max_results: 30
  - name: paperswithcode_latest
    type: rss
    url: "https://paperswithcode.com/rss/latest"
  - name: openai_blog
    type: rss
    url: "https://openai.com/news/rss.xml"
  - name: anthropic_newsroom
    type: sitemap
    url: "https://www.anthropic.com/sitemap.xml"
    include_prefixes:
      - "https://www.anthropic.com/news/"
    extract_published_from_page: true
  - name: anthropic_engineering
    type: sitemap
    url: "https://www.anthropic.com/sitemap.xml"
    include_prefixes:
      - "https://www.anthropic.com/engineering/"
    extract_published_from_page: true
  - name: anthropic_research
    type: sitemap
    url: "https://www.anthropic.com/sitemap.xml"
    extract_published_from_page: true
    include_prefixes:
      - "https://www.anthropic.com/research/"
  - name: google_deepmind_blog
    type: rss
    # Google DeepMind's official blog — frontier-lab signal (Gemini/Gemma
    # model launches, research). Treated as a frontier peer of OpenAI/Anthropic,
    # not as a promotional vendor blog like google_ai_blog/google_cloud_blog.
    url: "https://deepmind.google/blog/rss.xml"
  - name: huggingface_blog
    type: rss
    url: "https://huggingface.co/blog/feed.xml"
  - name: nvidia_blog
    type: rss
    url: "https://blogs.nvidia.com/feed/"
  - name: google_ai_blog
    type: rss
    url: "https://blog.google/technology/ai/rss/"
  - name: aws_ml_blog
    type: rss
    url: "https://aws.amazon.com/blogs/machine-learning/feed/"
  - name: google_cloud_blog
    type: rss
    # AI & ML category only — avoids the general Google Cloud blog's
    # database/infra/marketing noise; keeps the platform-engineer lens.
    url: "https://cloudblog.withgoogle.com/products/ai-machine-learning/rss/"
  - name: vllm_releases
    type: rss
    url: "https://github.com/vllm-project/vllm/releases.atom"
  - name: triton_releases
    type: rss
    url: "https://github.com/triton-inference-server/server/releases.atom"
  - name: llamaindex_releases
    type: rss
    url: "https://github.com/run-llama/llama_index/releases.atom"
  - name: langgraph_releases
    type: rss
    url: "https://github.com/langchain-ai/langgraph/releases.atom"
  - name: openai_codex_releases
    type: rss
    url: "https://github.com/openai/codex/releases.atom"
  - name: claude_code_releases
    type: rss
    url: "https://github.com/anthropics/claude-code/releases.atom"
  - name: claude_agent_sdk_python_releases
    type: rss
    url: "https://github.com/anthropics/claude-agent-sdk-python/releases.atom"
  - name: claude_blog
    type: sitemap
    url: "https://claude.com/sitemap.xml"
    include_prefixes:
      - "https://claude.com/blog/"
    extract_published_from_page: true
    page_meta_cache_ttl_hours: 24
  - name: hackernews_ai
    type: rss
    url: "https://hnrss.org/newest?q=(AI%20OR%20LLM%20OR%20agent%20OR%20inference)&count=30"
  - name: infoq_ai_ml
    type: rss
    url: "https://feed.infoq.com/ai-ml-data-eng/"
  - name: simon_willison
    type: rss
    url: "https://simonwillison.net/atom/everything/"
  - name: latent_space
    type: rss
    url: "https://www.latent.space/feed"
  - name: langchain_blog
    type: sitemap
    url: "https://www.langchain.com/sitemap.xml"
    include_prefixes:
      - "https://www.langchain.com/blog/"
    extract_published_from_page: true
    page_meta_cache_ttl_hours: 24
    # Sitemap ships no <lastmod>, so publish dates are discovered per page and
    # cached permanently. ~450 blog URLs; a budget above that count warms the
    # cold cache in a single run so the newest posts surface immediately
    # (steady state then fetches only genuinely-new posts).
    page_meta_fetch_budget: 600
  - name: search_agent_engineering_news
    type: rss
    url: "https://news.google.com/rss/search?q=%28agentic+coding+OR+coding+agent+OR+agent+harness+OR+claude+code+OR+openai+codex%29&hl=en-US&gl=US&ceid=US:en"
  - name: search_llm_ops_news
    type: rss
    url: "https://news.google.com/rss/search?q=%28LLM+inference+optimization+OR+serving+latency+OR+vLLM+OR+Triton%29&hl=en-US&gl=US&ceid=US:en"
  - name: vllm_blog
    type: rss
    # vLLM project's own technical blog (deep inference-engineering writeups:
    # speculative decoding, semantic routing, day-0 model support) — distinct
    # from vllm_releases, which is just GitHub changelog entries.
    url: "https://vllm.ai/blog/rss.xml"
  - name: modal_blog
    type: rss
    # Modal (serverless GPU platform) engineering blog — deep inference/serving
    # latency posts (speculative decoding, FlashAttention, sandbox cold starts).
    url: "https://modal.com/blog/atom.xml"
  - name: hamel_husain
    type: rss
    # Practitioner blog focused on LLM evals — direct match for the eval/
    # observability lens (e.g. "LLM Evals: Everything You Need to Know").
    url: "https://hamel.dev/index.xml"
  - name: eugene_yan
    type: rss
    # Applied ML practitioner blog (evals, agents, RAG) — low volume, high signal.
    url: "https://eugeneyan.com/rss/"
  - name: github_blog_ai_ml
    type: rss
    # GitHub Engineering's AI/ML category — agent tooling/harness engineering
    # (Copilot agentic harness evals, context handling, model routing).
    url: "https://github.blog/ai-and-ml/feed/"
  - name: philschmid
    type: rss
    # Philipp Schmid (Google DeepMind, ex-Hugging Face) — high-cadence practitioner
    # blog on agent architectures, fine-tuning, and inference/deployment engineering.
    url: "https://www.philschmid.de/rss"
  - name: interconnects
    type: rss
    # Nathan Lambert (Allen Institute for AI) — frequent, widely-cited analysis of
    # RLHF/post-training methods and frontier model internals.
    url: "https://www.interconnects.ai/feed"
  - name: sebastian_raschka
    type: rss
    # Sebastian Raschka's "Ahead of AI" — LLM architecture/training analysis from
    # a recognized author (Build a Large Language Model From Scratch).
    url: "https://magazine.sebastianraschka.com/feed"
  - name: lilian_weng
    type: rss
    # Lilian Weng (ex-OpenAI) — Lil'Log. Extremely low volume (~1-4 posts/year) but
    # foundational, widely-cited agent-engineering essays; same low-cadence
    # tradeoff as hamel_husain/eugene_yan, just sparser.
    url: "https://lilianweng.github.io/index.xml"
