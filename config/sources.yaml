  - name: claude_blog
    type: sitemap
    url: "https://claude.com/sitemap.xml"
    include_prefixes:
      - "https://claude.com/blog/"
    extract_published_from_page: true
    page_meta_cache_ttl_hours: 24
  - name: hackernews_ai
    type: rss
    url: "https://hnrss.org/newest?q=(AI%20OR%20LLM%20OR%20agent%20OR%20inference)&count=30"
