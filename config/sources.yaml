sources:
  - name: arxiv_cs_ai
    type: arxiv_api
    category: cs.AI
    max_results: 40
  - name: arxiv_cs_lg
    type: arxiv_api
    category: cs.LG
    max_results: 40
  - name: arxiv_cs_cl
    type: arxiv_api
    category: cs.CL
    max_results: 30
  - name: paperswithcode_latest
    type: rss
    url: "https://paperswithcode.com/rss/latest"
  - name: openai_blog
    type: rss
    url: "https://openai.com/news/rss.xml"
  - name: anthropic_newsroom
    type: sitemap
    url: "https://www.anthropic.com/sitemap.xml"
    include_prefixes:
      - "https://www.anthropic.com/news/"
    extract_published_from_page: true
  - name: anthropic_engineering
    type: sitemap
    url: "https://www.anthropic.com/sitemap.xml"
    include_prefixes:
      - "https://www.anthropic.com/engineering/"
    extract_published_from_page: true
  - name: anthropic_research
    type: sitemap
    url: "https://www.anthropic.com/sitemap.xml"
    extract_published_from_page: true
    include_prefixes:
      - "https://www.anthropic.com/research/"
  - name: google_deepmind_blog
    type: rss
    # Google DeepMind's official blog — frontier-lab signal (Gemini/Gemma
    # model launches, research). Treated as a frontier peer of OpenAI/Anthropic,
    # not as a promotional vendor blog like google_ai_blog/google_cloud_blog.
    url: "https://deepmind.google/blog/rss.xml"
  - name: huggingface_blog
    type: rss
    url: "https://huggingface.co/blog/feed.xml"
  - name: nvidia_blog
    type: rss
    url: "https://blogs.nvidia.com/feed/"
  - name: google_ai_blog
    type: rss
    url: "https://blog.google/technology/ai/rss/"
  - name: aws_ml_blog
    type: rss
    url: "https://aws.amazon.com/blogs/machine-learning/feed/"
  - name: google_cloud_blog
    type: rss
    # AI & ML category only — avoids the general Google Cloud blog's
    # database/infra/marketing noise; keeps the platform-engineer lens.
    url: "https://cloudblog.withgoogle.com/products/ai-machine-learning/rss/"
  - name: vllm_releases
    type: rss
    url: "https://github.com/vllm-project/vllm/releases.atom"
  - name: triton_releases
    type: rss
    url: "https://github.com/triton-inference-server/server/releases.atom"
  - name: llamaindex_releases
    type: rss
    url: "https://github.com/run-llama/llama_index/releases.atom"
  - name: langgraph_releases
    type: rss
    url: "https://github.com/langchain-ai/langgraph/releases.atom"
  - name: openai_codex_releases
